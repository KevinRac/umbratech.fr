<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire de Sanctuaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : grimoire sombre — onglets en haut, grille de fiches, fiche détaillée façon planificateur ; ambiance sombre unique assumée */
:root{
  --bg:#0e0a09; --panel:#17110e; --panel2:#201813; --line:#3a2b22; --line2:#55402f;
  --fg:#ebdfcc; --muted:#a6937b; --dim:#7d6c55;
  --ember:#d9592b; --ember-soft:#3a1a0f;
  --unique:#c9a86a; --mythic:#c784ff; --legend:#f0893c; --rune:#8fbfd1; --ok:#9fd18b; --bad:#e38a7a;
  --sS:#e5484d; --sA:#f0893c; --sB:#c9a86a; --sC:#8fbfd1; --sD:#7d6c55;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(ellipse 80% 40% at 50% -10%, #2a120a 0%, transparent 70%);}
a{color:var(--legend)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{border-bottom:1px solid var(--line);padding-block:22px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:0;letter-spacing:.02em;line-height:1.05;
  background:linear-gradient(180deg,#f3e4c6 0%, #c9a86a 55%, #8a5a2b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .season{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.brand .season b{color:var(--ember);font-weight:500}
.tag{color:var(--muted);margin:6px 0 18px;max-width:75ch}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-size:18px;white-space:nowrap}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ember)}
section.view{padding-top:26px}
h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 10px;color:var(--unique);text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:75ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.small{font-size:13.5px;color:var(--muted)}
.empty{color:var(--dim);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.chip:hover{border-color:var(--line2);color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--ember);color:var(--fg);background:var(--ember-soft)}
.sigil{--s:26px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;color:var(--cc);
  background:radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--cc) 38%, #120c09) 0%, #120c09 75%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--cc) 65%, transparent), 0 0 10px color-mix(in srgb,var(--cc) 30%, transparent)}
.sigil img{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--cc) 60%, transparent))}
.sigil svg{width:62%;height:62%;filter:drop-shadow(0 0 2px color-mix(in srgb,var(--cc) 60%, transparent))}
.sigil.lg{--s:76px;box-shadow:0 0 0 1px color-mix(in srgb,var(--cc) 70%, transparent),0 0 0 6px color-mix(in srgb,var(--cc) 10%, transparent),0 0 34px color-mix(in srgb,var(--cc) 40%, transparent);animation:halo 3.2s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--cc) 90%, transparent),0 0 0 9px color-mix(in srgb,var(--cc) 14%, transparent),0 0 48px color-mix(in srgb,var(--cc) 55%, transparent)}}
.card{position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(130% 90% at 100% 0%, color-mix(in srgb,var(--cc) 20%, transparent) 0%, transparent 55%), var(--panel)}
.card .wm{position:absolute;right:-26px;bottom:-30px;width:150px;height:150px;color:var(--cc);opacity:.08;z-index:-1;transition:opacity .3s, transform .5s}
.card .wm svg,.card .wm img{width:100%;height:100%;object-fit:contain}
.card:hover{border-color:color-mix(in srgb,var(--cc) 70%, var(--line));box-shadow:0 8px 28px -12px color-mix(in srgb,var(--cc) 70%, transparent)}
.card:hover .wm{opacity:.18;transform:rotate(-8deg) scale(1.06)}
.card h4{text-shadow:0 0 18px color-mix(in srgb,var(--cc) 35%, transparent)}
.dhead{position:relative;padding:18px;border:1px solid color-mix(in srgb,var(--cc) 40%, var(--line));border-radius:8px;overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 140% at 0% 0%, color-mix(in srgb,var(--cc) 22%, transparent), transparent 60%), var(--panel)}
.dhead .wm{position:absolute;right:-40px;top:-40px;width:240px;height:240px;color:var(--cc);opacity:.07;z-index:-1}
.dhead .wm svg,.dhead .wm img{width:100%;height:100%;object-fit:contain}
.chip .sigil{--s:22px}
/* icônes de compétences (originales) */
.sk{--ec:#cdbb9e;--z:48px;width:var(--z);height:var(--z);flex:none;position:relative;display:grid;place-items:center;color:color-mix(in srgb,var(--ec) 75%, #fff);
  clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
  background:radial-gradient(circle at 50% 30%, color-mix(in srgb,var(--ec) 55%, #1a120d) 0%, color-mix(in srgb,var(--ec) 18%, #0b0807) 62%, #070505 100%)}
.sk svg.gl{width:58%;height:58%;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ec) 70%, transparent))}
.sk svg.fr{position:absolute;inset:0;width:100%;height:100%;color:color-mix(in srgb,var(--ec) 70%, #5a4636)}
.sk.hasimg svg.gl{display:none}
.sk img.ic{position:absolute;inset:5%;width:90%;height:90%;object-fit:cover;z-index:1;pointer-events:none}
.sk svg.fr{z-index:2}
.skcell{display:grid;justify-items:center;gap:5px;min-width:0;text-align:center}
.skcell .lb{font-size:11px;line-height:1.2;color:var(--muted);max-width:100%;overflow-wrap:break-word;hyphens:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skcell .kb{font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.skrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:start}
/* liste des builds en lignes */
.blist{display:grid;gap:10px}
.brow{--cc:#888;display:grid;grid-template-columns:34px 52px minmax(0,1fr) minmax(0,540px);gap:16px;align-items:center;text-align:left;width:100%;
  padding:14px 18px;border:1px solid var(--line);border-radius:8px;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(90deg, color-mix(in srgb,var(--cc) 16%, transparent), transparent 45%), var(--panel);transition:border-color .2s, transform .2s, box-shadow .2s}
.brow:hover{border-color:color-mix(in srgb,var(--cc) 70%, var(--line));transform:translateX(3px);box-shadow:0 8px 26px -14px color-mix(in srgb,var(--cc) 80%, transparent)}
.brow .wm{position:absolute;left:44px;top:50%;width:140px;height:140px;transform:translateY(-50%);color:var(--cc);opacity:.06;z-index:-1}
.brow .wm svg,.brow .wm img{width:100%;height:100%;object-fit:contain}
.brow .sigil{--s:50px}
.brow .ttl{min-width:0}
.brow .ttl h4{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;line-height:1.15;text-shadow:0 0 18px color-mix(in srgb,var(--cc) 35%, transparent)}
.brow .ttl .cl{font-size:14px;color:color-mix(in srgb,var(--cc) 70%, var(--fg))}
.brow .ttl .mt{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-top:3px}
.brow .skrow .sk{--z:46px}
@media (max-width:980px){.brow{grid-template-columns:34px 52px minmax(0,1fr)}.brow .skrow{grid-column:1/-1}}
@media (max-width:480px){.brow{grid-template-columns:28px 44px minmax(0,1fr);gap:10px;padding:12px}.brow .sigil{--s:42px}.brow .skrow .sk{--z:40px}.skcell .lb{font-size:10.5px}}
.dhead .skrow{margin-top:16px;max-width:620px}
.dhead .skrow .sk{--z:60px}
@media (max-width:480px){.dhead .skrow .sk{--z:44px}}
@media (prefers-reduced-motion:reduce){.sigil.lg{animation:none}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1 1 240px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.search::placeholder{color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:7px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ember-soft);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .15s, transform .15s;min-width:0}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.card .cls{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.card h4{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.15}
.card .keys{display:flex;flex-wrap:wrap;gap:6px}
.card .foot{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.tier{font-family:var(--f-display);font-size:18px;width:32px;height:32px;display:grid;place-items:center;border:1px solid currentColor;border-radius:4px;flex:none}
.t-S{color:var(--sS)}.t-A{color:var(--sA)}.t-B{color:var(--sB)}.t-C{color:var(--sC)}.t-D,.t-x{color:var(--sD)}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.r-u{color:var(--unique)} .r-m{color:var(--mythic)} .r-l{color:var(--legend)} .r-r{color:var(--rune)}
.pill.r-u{border-color:#5a4a2c}.pill.r-m{border-color:#5b3a78}.pill.r-l{border-color:#6b3b1a}.pill.r-r{border-color:#33525e}
.detail{display:grid;gap:22px}
.back{background:none;border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;color:var(--muted);justify-self:start}
.back:hover{color:var(--fg);border-color:var(--line2)}
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dhead .tier{width:48px;height:48px;font-size:28px}
.dhead > div{min-width:0;flex:1}
.dhead h2{font-size:34px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.stack{display:grid;gap:22px;align-content:start}
.slot{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 14px;padding:11px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .sl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-top:4px}
.slot .it{font-weight:500;font-size:16px}
.en{color:var(--dim);font-size:13px;font-style:italic;font-weight:400}
.sock{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sock span{font-size:12.5px;padding:1px 7px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--rune)}
.sock span.g{color:var(--ok)} .sock span.f{color:var(--mythic)}
.drop{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:2px 8px}
.drop::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--ember);flex:none}
@media (max-width:480px){.slot{grid-template-columns:minmax(0,1fr)}}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
.skill{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.skill b{display:block;font-weight:500;overflow-wrap:anywhere}
.skill span{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.spec{border-left:2px solid var(--ember);padding-left:12px}
.spec .name{font-family:var(--f-display);font-size:19px}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.clean li{padding-left:16px;position:relative}
ul.clean li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--ember)}
.boards{display:grid;gap:6px;counter-reset:b}
.boards div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.boards div:last-child{border-bottom:0}
.boards b{font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.statgrid .sg{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0}
.statgrid ol{margin:6px 0 0;padding-left:20px;font-size:14px;display:grid;gap:3px}
.statgrid li::marker{color:var(--ember);font-family:var(--f-mono);font-size:11px}
.temp{font-family:var(--f-mono);font-size:10px;color:var(--legend);border:1px solid #6b3b1a;border-radius:2px;padding:0 4px;margin-left:4px}
.notes{white-space:pre-wrap;font-size:15px;line-height:1.6}
.notes .h{display:block;font-family:var(--f-display);font-size:18px;color:var(--unique);margin-top:10px}
.notebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 13px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--ember)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#160b06;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:500;background:var(--panel)}
tr:last-child td{border-bottom:0}
td input{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 8px;width:100%;min-width:180px}
td input.dirty{border-color:var(--ember)}
.st{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.st.perso{color:var(--ok)} .st.off{color:var(--unique)} .st.base{color:var(--muted)} .st.none{color:var(--bad)}
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media (max-width:400px){.bosses{grid-template-columns:minmax(0,1fr)}}
.boss{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.boss header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.boss h4{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.1}
.boss .loc{font-size:13.5px;color:var(--muted)}
.boss .key{font-family:var(--f-mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:3px 8px;border-radius:3px;white-space:nowrap}
.boss .grp{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.boss .grp .k{color:var(--dim);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.boss .flag{font-family:var(--f-mono);font-size:11px;color:var(--mythic)}
.boss .used{color:var(--ember);font-size:12px}
mark{background:#5a2a12;color:var(--fg);border-radius:2px;padding:0 2px}
.plan{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.plan{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.route{display:grid;gap:12px}
.route .stop{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--panel2)}
.route .stop b{font-family:var(--f-display);font-weight:400;font-size:18px}
.stophead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wherebtn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;font-size:13px;color:var(--muted)}
.wherebtn:hover,.wherebtn[aria-expanded="true"]{border-color:var(--ember);color:var(--fg)}
.wherebtn svg{width:12px;height:12px;flex:none}
.where{margin-top:10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:12px;display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:480px){.where{grid-template-columns:minmax(0,1fr)}}
.where svg.map{width:100%;height:auto;display:block}
.where dl{margin:0;display:grid;gap:6px;font-size:14px}
.where dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.where dd{margin:0}
.map rect{fill:var(--panel2);stroke:var(--line2);stroke-width:1}
.map rect.on{fill:var(--ember-soft);stroke:var(--ember);stroke-width:2}
.map text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.map text.on{fill:var(--fg);font-weight:700}
.map circle{fill:var(--ember)}
.gems{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gem{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.gem h4{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:20px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ember)}
.tierrow{display:grid;grid-template-columns:56px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.tierrow .tl{display:grid;place-items:center;font-family:var(--f-display);font-size:30px;background:var(--panel2);border-right:1px solid var(--line)}
.tierrow .tb{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--panel)}
.tb .ent{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:5px 10px 5px 6px;background:var(--panel2);font-size:14.5px}
.tb .ent.link{cursor:pointer;border-color:var(--line2)}
.tb .ent.link:hover{border-color:var(--ember)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--ember);padding:8px 16px;border-radius:4px;font-size:14px;z-index:10}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:13.5px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* infobulles objets / compétences */
.tipt{cursor:help;border-bottom:1px dotted color-mix(in srgb,currentColor 45%,transparent)}
.skcell{cursor:help}
#tip{position:fixed;z-index:1000;left:0;top:0;max-width:min(340px,calc(100vw - 24px));pointer-events:none;
  background:linear-gradient(180deg,#1d1511,#120d0b);border:1px solid var(--line2);border-top:2px solid var(--tc,var(--unique));
  border-radius:6px;padding:10px 12px 11px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:14px;line-height:1.45;color:var(--fg)}
#tip[hidden]{display:none}
#tip .tn{font-family:var(--f-display);font-size:19px;line-height:1.15;color:var(--tc,var(--unique))}
#tip .te{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-top:1px}
#tip .ts{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 6px}
#tip .td p{margin:0 0 5px}
#tip .td .rg{color:var(--rune);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
#tip .tsrc{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:12.5px;color:var(--muted)}
#tip .tsrc b{color:var(--ember);font-weight:500}
#tip .nd{color:var(--dim);font-style:italic}

/* poupée d'équipement */
.doll{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,1.1fr) minmax(0,1fr);gap:12px;align-items:stretch;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--cc) 22%,#120d0b) 0%,#0f0a09 75%);border:1px solid var(--line);border-radius:8px;padding:14px 10px 12px}
.doll .col{display:flex;flex-direction:column;gap:10px;align-items:center}
.doll .col.r{justify-content:flex-start}
.doll .mid{display:grid;place-items:center;color:var(--cc);opacity:.9;min-height:200px}
.doll .mid img{width:min(100%,150px);height:auto;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--cc) 60%,transparent));opacity:.55}
.doll .mid svg{width:min(100%,150px);height:auto;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--cc) 60%,transparent));opacity:.55}
.doll .wp{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.gs{width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.gt{position:relative;width:62px;height:62px;border-radius:6px;border:2px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 22%,#1b1310),#0d0908);display:grid;place-items:center;color:var(--rc);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 35%,transparent) inset,0 2px 8px rgba(0,0,0,.5);cursor:help}
.gt:hover,.gt:focus-visible{box-shadow:0 0 14px var(--rc),0 0 12px color-mix(in srgb,var(--rc) 45%,transparent) inset}
.si{width:20px;height:20px;object-fit:contain;vertical-align:-5px;margin-right:6px;flex:none}
.gem h4{display:flex;align-items:center;gap:0}.gem h4 .si{width:38px;height:38px;margin-right:10px;vertical-align:baseline}
.sock span .si{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.gt .so i.ic{width:18px;height:18px;border:0;background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 1px 2px #000)}
.gt .so i.ic .si{width:100%;height:100%;margin:0;vertical-align:top;display:block}
.ci{width:26px;height:26px;object-fit:cover;border-radius:4px;vertical-align:-8px;margin-right:8px;border:1px solid #5a4630}
.gt>svg{width:34px;height:34px;fill:currentColor;opacity:.85}
.gt img.ii{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;z-index:1}
.gt:has(img.ii)>svg{display:none}
.gt .so{z-index:2}
.gt .so{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:3px}
.gt .so i{width:9px;height:9px;border-radius:50%;background:var(--rune);border:1px solid #0008;box-shadow:0 0 4px currentColor}
.gt .so i.g{background:var(--ok)} .gt .so i.f{background:var(--mythic)}
.gs .gn{font-size:12px;line-height:1.2;color:var(--rc);overflow-wrap:break-word;max-width:100%}
.gs .gl{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.gdet{margin-top:14px}
.gdet>summary{cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:6px}
@media (max-width:560px){.doll{grid-template-columns:1fr 1fr}.doll .mid{display:none}.gs{width:84px}}
</style>

es étourdissantes infligent [25.0 - 30.0]% de dégâts supplémentaires."],"Aspect of Deeper Shadows":["a","Aspect légendaire","Votre maximum de cumuls de forme d'ombre est augmenté de [2 - 6]."],"Archdruid's Aspect":["a","Aspect légendaire","Vous obtenez un bonus passif pour chaque forme de druide. Forme humaine : [40 - 55]% de dégâts supplémentaires contre les adversaires à distance. Lycanthrope : [40 - 55]% de dégâts critiques supplémentaires contre les adversaires à proximité. Ursoïde : [30 - 45]% de dégâts supplémentaires tant que vous bénéficiez…"],"Aspect of Decay":["a","Aspect légendaire","Vous infligez [65 - 85]% de dégâts de corruption et d'engelure supplémentaires."],"Aspect of Fathomless Dark":["a","Aspect légendaire","Vos compétences des abîmes infligent des dégâts supplémentaires équivalents à [60 - 80]% de la réduction des dégâts accordée par votre résistance à l'ombre."],"Aspect of Channeling":["a","Aspect légendaire","Lorsque vous canalisez une compétence, tous les dégâts sont augmentés de [50 - 70]%."],"Aspect of Frozen Memories":["a","Aspect légendaire","Les dégâts de froid infligent [30 - 45]% de dégâts supplémentaires aux cibles glacées. Ce bonus est triplé contre les cibles gelées."],"Aspect of Combustion":["a","Aspect légendaire","Vos compétences de pyromancie infligent [70.0 - 100.0]% de dégâts critiques supplémentaires aux adversaires en feu."],"Aspect of Fiendish Oppression":["a","Aspect légendaire","L'invocation d'un démon majeur renverse les adversaires autour de lui pendant 5 s. Vos compétences de démons mineurs infligent [10 - 20]% de dégâts supplémentaires aux cibles sous l'effet d'une perte de contrôle."],"Aspect of Glynn's Anvil":["a","Aspect légendaire","Votre maximum de détermination est augmenté de 2 et vous obtenez [2.5 - 4]% de réduction des dégâts par cumul de détermination."],"Aspect of Elemental Attunement":["a","Aspect légendaire","Coup de chance : vous avez jusqu'à 20% de chances de réduire le temps de recharge d'une de vos compétences défensives de [8.0 - 10.0] s."],"Aspect of Disobedience":["a","Aspect légendaire","Vos dégâts sur la durée vous octroient [1.0 - 1.5]% de réduction des dégâts pendant 2 s. Cet effet peut se cumuler jusqu'à 30 fois."],"Aspect of Elemental Constellation":["a","Aspect légendaire","Lorsque vous disposez du même nombre de compétences de givre, de pyromancie et de foudre équipées, vous infligez [80.0 - 120.0]% de dégâts supplémentaires."],"Aspect of Heavenly Strength":["a","Aspect légendaire","Lorsque vous maniez une arme à deux mains, vous obtenez [30 - 40]% de réduction des dégâts."],"Aspect of Interdiction":["a","Aspect légendaire","Vous obtenez [2.0 - 3.0]%[+] de chances de bloquer par cumul de détermination."],"Aspect of Infestation":["a","Aspect légendaire","Les essaims pestilentiels infligent désormais également [125 - 175]% de leurs dégâts normaux sous forme de dégâts d'empoisonnement en 6 s."],"Aspect of Ignition":["a","Aspect légendaire","Les compétences renforcées par Instabilité infligent 40% de dégâts supplémentaires et vous avez [24.0 - 40.0]% de chances que l'instabilité persiste en utilisant une compétence renforcée."],"Aspect of Imitated Imbuement":["a","Aspect légendaire","Vos clones d'ombre et vos ombres reproduisent aussi les imprégnations appliquées à vos compétences. Lorsque vous utilisez une compétence d'imprégnation, vos dégâts non physiques augmentent de [40 - 60]% pendant 9 s."],"Aspect of Merciless Cold":["a","Aspect légendaire","Vos dégâts directs de froid augmentent de [10.0 - 15.0]% les dégâts de froid que subissent les adversaires pendant 4 s. Cet effet est cumulable jusqu'à 10 fois."],"Aspect of Lapa's Scripture":["a","Aspect légendaire","Lorsque vous perdez de la détermination, vous obtenez [392 - 718] de dégâts d'épines pendant 10 s. Cet effet peut se cumuler jusqu'à 20 fois."],"Aspect of Mending Obscurity":["a","Aspect légendaire","Lorsque vous vous camouflez et toutes les secondes pendant la durée du camouflage, vous récupérez [10.5 - 15.0]% de votre maximum de points de vie. Lorsque vous sortez du camouflage, vous obtenez une fortification équivalente à [7.0 - 10.0]% de votre maximum de points de vie."],"Aspect of Peril":["a","Aspect légendaire","Lorsque vous rendez une cible vulnérable, les dégâts qu'elle subit de votre part sont augmentés de [2.0 - 3.4]%, jusqu'à un maximum de [40 - 68]%."],"Aspect of Heresy":["a","Aspect légendaire","Chaque compétence occulte que vous utilisez augmente tous vos dégâts de [10.0 - 14.0]% pendant 15 s."],"Aspect of Pestilence":["a","Aspect légendaire","Les essaims pestilentiels infligent [70 - 100]% de dégâts supplémentaires, durent 50% plus longtemps et s'étendent vers l'extérieur."],"Aspect of Plains Power":["a","Aspect légendaire","Coup de chance : vous avez jusqu'à 25%[+] de chances de créer un cercle mystique pendant 10 s. L'utilisation d'une compétence de jaguar dans des cercles mystiques permet à ces derniers de réinitialiser la durée de votre férocité et d'augmenter vos dégâts de [8.0 - 12.0]% par cumul tant que vous restez à l'intérieur."],"Aspect of Rallying Reversal":["a","Aspect légendaire","Vous avez [60 - 80]% de chances d'obtenir 1 point de férocité lorsqu'une cible adverse subit l'un de vos effets de perte de contrôle ou lorsque vous stupéfiez un boss."],"Aspect of Inner Calm":["a","Aspect légendaire","Vous infligez jusqu'à [50 - 75]% de dégâts supplémentaires lorsque vous vous tenez immobile."],"Aspect of Overwhelming Currents":["a","Aspect légendaire","Les coups critiques des compétences de foudre augmentent les dégâts de Décharge électrique de [2.00 - 3.00]% pendant 4 s. Les cumuls ne réinitialisent pas la durée."],"Aspect of Searing Impact":["a","Aspect légendaire","Les météorites infligent [60.0 - 90.0]% de dégâts supplémentaires sous forme de brûlure en 4 s."],"Aspect of Redirected Force":["a","Aspect légendaire","Vos dégâts critiques augmentent à hauteur de [40 - 60]% de vos chances de bloquer. Si vous bloquez une attaque, ce bonus est doublé pendant 10 s."],"Aspect of Reanimation":["a","Aspect légendaire","Les dégâts infligés par vos créatures invoquées augmentent tant qu'elles sont en vie, jusqu'à atteindre [60 - 90]% après 10 s."],"Aspect of Thickened Blood":["a","Aspect légendaire","Les compétences de sang infligent jusqu'à [60 - 90]% de dégâts supplémentaires en fonction de la quantité de fortification dont vous disposez."],"Aspect of Retribution":["a","Aspect légendaire","Les cibles à distance ont 20% de chances d'être étourdies pendant 2 s lorsqu'elles vous infligent des dégâts. Vous infligez [15 - 25]% de dégâts supplémentaires aux cibles à distance."],"Aspect of Sky Power":["a","Aspect légendaire","Coup de chance : vous avez jusqu'à 25%[+] de chances de créer un cercle mystique pendant 10 s. L'utilisation d'une compétence d'aigle dans des cercles mystiques permet à ces derniers de se déplacer avec vous et d'exploser, infligeant [150 - 225] points de dégâts de foudre lorsque vous esquivez."],"Aspect of Supremacy":["a","Aspect légendaire","Lorsque vous tuez une cible alors qu'une compétence ultime est active, vous obtenez un cumul de suprématie qui augmente vos dégâts de [6.0 - 9.0]%, jusqu'à un maximum de [60.0 - 90.0]%. Lorsque la compétence ultime prend fin, vous obtenez 5 cumuls de suprématie, puis en perdez un par seconde."],"Aspect of Splintering Energy":["a","Aspect légendaire","Vos compétences de foudre infligent [120.0 - 180.0]% de dégâts supplémentaires, mais ce bonus est réduit de 10% par frappe consécutive."],"Aspect of Ultimate Shadow":["a","Aspect légendaire","Votre sol souillé inflige [80 - 120]% de dégâts supplémentaires et ralentit les adversaires de 50%."],"Aspect of the Followed Path":["a","Aspect légendaire","Les compétences utilisées sous la forme de métamorphose de base infligent [45 - 60]% de dégâts supplémentaires."],"Aspect of the Expectant":["a","Aspect légendaire","Les compétences de base augmentent vos dégâts de [4.0 - 6.0]% pendant 4. Cet effet est cumulable jusqu'à 10 fois."],"Aspect of the Frozen Wake":["a","Aspect légendaire","La formation d'une pointe de glace augmente ses dégâts de [2.0 - 3.0]% pendant 2 s. Cet effet est cumulable jusqu'à 30 fois."],"Aspect of the Juggernaut's Covenant":["a","Aspect légendaire","Lorsque vous consommez des cumuls de détermination sous l'effet d'un serment de mastodonte, vous infligez [60 - 100]% de dégâts supplémentaires."],"Aspect of the Arbiter's Zephyr":["a","Aspect légendaire","Le temps de recharge d'esquive de l'arbitre est réduit de [1.0 - 3.0] s."],"Aspect of the Orange Herald":["a","Aspect légendaire","Lorsque vous infligez des dégâts avec une compétence principale, le temps de recharge de l'une de vos compétences est réduit de [0.7 - 1.0] s."],"Aspect of Utmost Glory":["a","Aspect légendaire","Lorsque vous êtes en bonne santé, vos compétences infligent [20 - 35]% de dégâts supplémentaires. Cet effet est doublé contre les cibles affaiblies."],"Aspect of the Moonrise":["a","Aspect légendaire","Lorsque vous infligez des dégâts avec une compétence de base, vous recevez 4% de vitesse d'attaque supplémentaire pendant 10 s, jusqu'à un maximum de 5 fois. Une fois ce seuil atteint, vous sombrez dans une rage de sang vampirique et obtenez un bonus de [40 - 60]% aux dégâts des compétences de base et de 15% à la…"],"Aspect of the Untarnished Blaze":["a","Aspect légendaire","Lorsque vous êtes en bonne santé, vos compétences de pyromancie infligent [50 - 70]% de dégâts supplémentaires."],"Aspect of the Ursine Horror":["a","Aspect légendaire","Sous forme d'ursoïde, vous recevez 15% de soins supplémentaires de toutes les sources. De plus, vous obtenez 1 cumul d'accablement toutes les [4.0 - 2.0] s."],"Aspect of the Zealot's Covenant":["a","Aspect légendaire","Les coups supplémentaires de Serment de fanatique infligent [100.0 - 120.0]% de dégâts en plus.\nVotre maximum de ferveur est augmenté de 1 et sa durée de 2 s."],"Aspect of the Void":["a","Aspect légendaire","Les compétences de ténèbres affaiblissent les adversaires pendant 4 s. Les compétences de ténèbres infligent [10 - 15]% de dégâts supplémentaires aux cibles affaiblies."],"Aspect of the Warpath":["a","Aspect légendaire","Lorsque vous disposez de charges d'accablement, vos attaques d'arme contondante infligent [40 - 60]% de dégâts supplémentaires."],"Azurewrath":["u","Unique — Épée","Lorsque l'effet de gel expire, les cibles explosent en infligeant [100 - 120]% des dégâts qu'elles ont subis de votre part pendant qu'elles étaient gelées."],"Blasting Aspect":["a","Aspect légendaire","Pointes de glace et Météorites infligent [60 - 90]% de dégâts supplémentaires et leur taille est augmentée de 50%[+]."],"Bindings of Attrition":["u","Unique — Jambières","L'utilisation de Sombre geôle consomme 48% de votre maximum de points de vie pour réinitialiser son temps de recharge. Vous obtenez [20 - 30]% de réduction des dégâts supplémentaire lorsque Sombre geôle est active."],"Banished Lord's Talisman":["u","Unique — Amulette","Après avoir dépensé 275 points de ressource principale, vous obtenez 4 cumuls d'accablement. Vos coups critiques infligent [10 - 12]% de dégâts supplémentaires par cumul d'accablement."],"Blood Moon Breeches":["u","Unique — Jambières","Vos invocations ont [7.0 - 10.0]% de chances d'appliquer aléatoirement Décrépitude ou Vierge de fer lorsqu'elles infligent des dégâts. Vous infligez [50 - 60]% de dégâts critiques supplémentaires aux cibles adverses affectées par vos malédictions."],"Beastfall Boots":["u","Unique — Bottes","Lorsque vous utilisez une compétence ultime non canalisée, elle consomme toute votre énergie et inflige [0.60 - 0.75]% de dégâts supplémentaires par point d'énergie consommé.\nL'utilisation d'une compétence avec temps de recharge restaure 25 points d'énergie."],"Bold Chieftain's Aspect":["a","Aspect légendaire","Les temps de recharge de vos compétences de cri sont réduits de [8.0 - 10.0] s."],"Blood-Mad Idol":["u","Unique — Amulette","Vous êtes constamment sous l'effet de Rage du berserker, mais subissez 200% de dégâts de brûlure supplémentaires en 8 s. Tant que vous brûlez, Rage du berserker vous octroie [80 - 100]% de dégâts supplémentaires."],"Blue Rose":["u","Unique — Bague","Les compétences qui génèrent des pointes de glace infligent [40 - 60]% de dégâts supplémentaires. Coup de chance : vous avez jusqu'à 15% de chances de lancer une pointe de glace qui inflige 225 points de dégâts de froid."],"Bulwark's Aspect":["a","Aspect légendaire","Vous n'esquivez plus, mais votre réduction des dégâts bloqués est améliorée de [20 - 30]% et vos chances de bloquer augmentent de 15%[+]."],"Bloodless Scream":["u","Unique — Faux à deux mains","Vos compétences de ténèbres glacent les adversaires à hauteur de 100% au maximum et infligent [100 - 125]% de dégâts supplémentaires aux adversaires et aux boss gelés.\nToutes les 800 compétences de ténèbres qui infligent des dégâts, les cibles adverses à proximité sont effrayées pendant 0.25 s avant de geler…"],"Cage of Madness":["u","Unique — Heaume","Votre esquive vous transforme en forcené déchu pendant 15 s au maximum, qui explose pour infliger des dégâts de Commandement des Déchus. Ces dégâts sont augmentés de 100% pour chaque seconde passée sous la forme de forcené déchu.\nSous forme de forcené déchu, votre vitesse de déplacement est augmentée de 60% et vous…"],"Chainscourged Mail":["u","Unique — Jambières","Lorsque vous utilisez une compétence de combat qui inflige des dégâts, celle-ci est désactivée par la suite. Lorsque toutes les compétences de votre barre d'action sont désactivées, elles sont réactivées et leurs temps de recharge sont réinitialisés. Les compétences de combat que vous utilisez infligent [60.0 -…"],"Crown of Lucion":["u","Unique — Heaume","Chaque fois que vous utilisez une compétence avec un coût en ressource principale, vous infligez [10 - 15]% de dégâts supplémentaires et le coût en ressource augmente de 30%[+] pendant 6 s, jusqu'à un maximum de 6 fois."],"Conjuration Master's Aspect":["a","Aspect légendaire","Votre nombre maximum de conjurations est augmenté de 1 et vos dégâts de conjuration sont augmentés de [40 - 60]%."],"Crushing Aspect":["a","Aspect légendaire","Lorsque vous bénéficiez d'une fortification, vous infligez [45 - 65]% de dégâts supplémentaires."],"Cowl of the Nameless":["u","Unique — Heaume","Coup de chance : les compétences imprégnées ont jusqu'à 40% de chances de déclencher une puissante explosion qui inflige 75% des dégâts et applique l'effet d'imprégnation à l'ensemble des cibles touchées à [120 - 150]% de sa puissance."],"Demonic Aspect":["a","Aspect légendaire","Chaque coup porté avec des compétences de démonologie augmente les dégâts qu'elles infligent de [2.3 - 3.3]% pendant 10 s, jusqu'à un maximum de [45 - 65]%."],"Dirge of Airidah":["u","Unique — Bague","Les compétences de tempête que vous utilisez vous confèrent 1 point d'esprit et infligent [25 - 35]% de dégâts supplémentaires. Ce bonus est doublé lorsque vous touchez des cibles vulnérables, immobilisées ou ralenties."],"Dark Howl":["u","Unique — Gants","Rugissement débilitant est désormais une compétence de lycanthrope. De plus, Rugissement débilitant augmente de [60 - 80]% les dégâts que vous infligez sous forme de lycanthrope pendant la durée de l'effet."],"Dawnfire":["u","Unique — Gants","L'effet passif de Lumière sacrée inflige désormais [390 - 450] points de dégâts chaque seconde dans une petite zone autour de vous. Chaque fois que l'adversaire meurt à l'intérieur de cette zone, les dégâts qu'elle inflige sont augmentés de 15%[+] et sa taille de 10%[+] pendant 20 s, jusqu'à un maximum de 10 fois.…"],"Drognan's Anguish":["u","Unique — Bague","L'utilisation de compétences de pyromancie vous brûle à hauteur de 5% de votre maximum de points de vie en 10 s. Vous infligez jusqu'à [200 - 250]% de dégâts de brûlure supplémentaires en fonction de votre quantité de points de vie en train de brûler."],"Dolmen Stone":["u","Unique — Amulette","Au lieu <script>(function(){var b=window.D4DATA.builds.find(function(x){return x.id==="barbarian-whirl-wind-barb"});if(b){b.nf="Aperçu du build\nLes Plans de guerre et les Pouvoirs des Maléfiques se trouvent sur la variante Selig.\n\nLe Barbare Tourbillon est incroyablement puissant et rapide. Ce planificateur vous apprend à assembler l'équipement, les compétences et les plateaux de Parangon de cette compétence emblématique. Il vous aide aussi à résoudre tous vos problèmes de gestion de la Fureur, explique les aspects un peu déroutants et précise sur quelles armes placer vos compétences. Le planificateur propose plusieurs variantes : lisez-les avant de commencer.\n\nCette saison, tous les Barbares jouent une variante du Cœur fondu de Selig avec Foi persistante, en objet ou en charme. Ce n'est pas obligatoire, mais cela rend le personnage très résistant. Le Cœur fondu de Selig a été modifié : vous n'êtes plus « Immortel », mais cela reste la meilleure option défensive. Chaque variante propose une version sans cette amulette, mais c'est la version de fin de jeu à viser.\n\nLisez la section « Comment ça marche » (FAQ) du planificateur. Pour toute autre question, rejoignez l'auteur en direct sur Twitch, YouTube, TikTok ou X, ou sur son Discord quand il n'est pas en ligne : une équipe et une communauté y répondent à vos questions. Cliptis.com regroupe aussi tous ses guides pratiques.\n\nConfiguration des Plans de guerre : guide vidéo. Guide de montée de niveau : Tourbillon (leveling).\n\nBug d'enchantement\nUn bug touche actuellement l'enchantement sur console : vous ne pouvez pas changer un affixe sur un mot runique sans souris. Toutes les consoles prennent en charge la souris et le clavier. C'est la seule solution en attendant un correctif de Blizzard.\n\nForces et faiblesses\n- Extrêmement résistant\n- Amusant à jouer\n- Très mobile\n- Peut dépendre de l'équipement\n\nVariante Selig : avertissement\nATTENTION : jouer le Cœur fondu de Selig exige une configuration très précise. Vous devez :\n- Retirer toute la Vie maximale de votre équipement : vous devez en avoir ZÉRO.\n- Retirer toute la Vie maximale de votre plateau de Parangon, sauf les deux premiers nœuds de départ : ZÉRO également.\n- N'avoir aucune Vie maximale sur les charmes ni sur le sceau.\n- Le charme Foi persistante est indispensable pour jouer le Cœur fondu de Selig. Vous pouvez aussi porter Foi persistante en objet de qualité Mythique, ce qui ajoute de la survie.\n\nSeuils à atteindre pour jouer plus confortablement :\n- 473 de Vie maximale\n- 550 de Fureur maximale. Dès que vous atteignez au moins 650 de Fureur maximale, les affixes de runes ou d'équipement supplémentaires peuvent aller dans les rangs de Tourbillon au lieu de la Fureur maximale. Si votre bon équipement vous fait dépasser ce seuil, tant mieux : plus il y en a, mieux c'est, mais mélangez les deux le plus haut possible.\n- 20 à 24 de Régénération de Fureur. La Volonté de Tibault s'ajoute à votre autre Régénération de Fureur.\n- Plus de 250 points de Parangon (des points, pas des niveaux de Parangon). Prenez d'abord les nœuds défensifs.\n\nSi vous ne remplissez pas ces conditions, cette variante ne fonctionnera pas et vous mourrez. Utilisez la variante Mythique tant que tout n'est pas en place.\n\nÉquipement\nInfinité (masse à deux mains) doit être fabriquée sur une masse à deux mains. Ce sera aussi votre unique « amélioration en Mythique » via le Cube horadrique. Les mots runiques n'ont pas de version Mythique : l'utiliser ici donne un gros gain de dégâts. Infinité (masse à deux mains) possède une stat aléatoire : si vous n'obtenez pas Multiplicateur de dégâts physiques, recréez-en une jusqu'à l'obtenir.\n\nChoix d'éclats :\n- Éclat de la Mère\n- Éclat de Douleur\n- Éclat d'Angoisse\n\nTalisman\nPour les affixes de vos charmes, visez Rangs des compétences principales / martiales sur 2 pièces et Ressource maximale sur 3 pièces. Pour votre sceau, tout bonus de dégâts (x) est la meilleure option.\n\nCompétences et rotation\nLes dégâts de ce build viennent de Tourbillon et de Tourbillon tornade (Tornado Whirlwind).\n- Maintenez Tourbillon enfoncé.\n- Lancez Courroux du berserker pour les dégâts, la génération de Fureur et l'état Inarrêtable.\n- Utilisez Cri de ralliement une fois toutes les 4 secondes.\n- Lancez Cri de guerre et Cri provocateur dès qu'ils sont disponibles : dégâts supplémentaires, et réduction du temps de recharge de Courroux du berserker grâce à Mobilisation.\n\nFAQ : présentation du build\nCe build s'appuie sur Cri de ralliement pour obtenir énormément de vitesse de déplacement et de génération de Fureur. Tous les dégâts qui augmentent Tourbillon augmentent aussi Tourbillon tornade. Ces bonus viennent de Mighty Roar (Cri de guerre), de Damage Bonus (Cri provocateur) et de Berserking (Courroux du berserker). Le tout se combine pour des dégâts massifs !\n\nDétail des variantes :\n- Légendaire : votre build de départ quand vous sortez de votre build de montée de niveau.\n- Uniques : le milieu de jeu, la transition vers le build de fin de jeu.\n- Mythique : votre build d'entrée en fin de jeu. C'est la variante où vous passez au Cœur fondu de Selig. Elle utilise encore de la Vie maximale.\n- Selig : votre objectif final. Le Cœur fondu de Selig finit par offrir le plus de survie et de dégâts, même sans aucune Vie maximale.\n- Si vous mourez avec cette variante parce que Galvanisation ajoute de la Vie maximale, remplacez-la par Bond. Vous pouvez prendre le bonus d'arsenal de Bond et le glyphe Broyage pour un peu de dégâts en plus.\n- Configuration actuelle : ce que l'auteur porte réellement en jeu en progressant vers la variante Selig.\n\nFonctionnement des techniques d'arme\nQuand vous choisissez la technique d'arme (expertise) de votre Barbare, vous n'avez pas besoin de manier l'arme de la technique choisie. Ceci n'est qu'un exemple pour comprendre le fonctionnement. Pour la configuration de ce build, voir la sélection d'Arsenal ci-dessous :\n- Technique choisie : Arme d'hast. +15 % (x) de chances de coup de chance, et vous infligez +15 % (x) de dégâts en bonne santé.\n- Sélection d'Arsenal : Masse. Coup de chance : chance de gagner 5 de Fureur en touchant un ennemi. La Fureur gagnée est doublée pendant la Rage du berserker, et vous infligez +15 % (x) de dégâts critiques pendant la Rage du berserker.\nAvec cette configuration, vous obtenez à la fois le bonus de technique de la masse à deux mains choisie dans l'Arsenal et celui de la technique Arme d'hast.\n\nSources de Fureur maximale :\n- Affixes sur le casque, le plastron et l'amulette\n- Charmes\n- Plateaux de Parangon Porte-guerre et Maître d'armes\n- Chef-d'œuvre de Ramaladni\n- Cœur fondu de Selig\n\nNouveaux uniques\n- Pierre de Jordan (Stone of Jordan) vous oblige à cumuler des Résistances physiques. Elles viennent des charmes, des trempes et, au besoin, des affixes.\n- Insight (arme d'hast) semble la meilleure option face au Grand-père. La plupart des tests portent sur les paliers de dégâts, mais l'utilité qu'il apporte est de premier ordre.\n- Esprit (épée à une main) va être testé. Il augmente les dégâts du Chef-d'œuvre de Ramaladni et ajoute des rangs à Tourbillon et à Courroux du berserker, mais ces paliers sont déjà dilués vu le nombre de rangs et la quantité de Fureur habituelle : un aspect pourrait donc être plus optimal. Surveillez le journal des modifications.\n- Énigme (Enigma) offre une excellente réduction des dégâts, de la vitesse de déplacement et une Téléportation, mais exige beaucoup de réduction du temps de recharge pour que Courroux du berserker reste actif en permanence. C'est une source de Fureur et d'Inarrêtable, difficiles à abandonner, surtout avec le Cœur fondu de Selig. Si vous n'avez pas 100 % de disponibilité, utilisez la Rage d'Harrogath et la technique Épée à deux mains jusqu'à y parvenir.\n- Infinité (masse à deux mains) sera le meilleur objet des Barbares cette saison, mais seulement en l'améliorant en Mythique : ce doit être votre objet fabriqué. C'est le plus gros bonus de dégâts actif en permanence. La Fournaise fait de gros dégâts aux élites, mais ralentit la progression dans les Fosses : vous n'infligez aucun bonus aux monstres normaux et la barre de progression avance moins vite.\n\nConfiguration n° 1 (la plus résistante) :\n- Aspect de force céleste sur l'amulette\n- Rage d'Harrogath sur le plastron\n- Aspect of Berserk Ripping sur un anneau\n- Full Throttle (Courroux du berserker)\n- Aspect of Coagulation sur le pantalon\n\nConfiguration n° 2 (moins résistante, plus de dégâts) :\n- Aspect de force céleste sur le pantalon\n- Rage d'Harrogath sur le plastron\n- Aspect de gros bras sur l'amulette\n- Full Throttle (Courroux du berserker)\n- Aspect of Walloping sur un anneau (poussée de Fosse) ou Aspect of Berserk Ripping (farm)\n\nOption recharge\nMoins résistante que la configuration de la section Équipement du planificateur :\n- Rage d'Harrogath\n- Cri provocateur : Raging\n- Full Throttle (Courroux du berserker)\n- Aspect of Berserk Ripping sur votre anneau\n\nFAQ : sélection d'Arsenal\nVotre sélection d'Arsenal sera la masse à deux mains.\n- Pour apprendre à choisir ses armes : vidéo « How to Select Weapons » de l'auteur.\n- Pour les bases des multiplicateurs : vidéo « Additive vs. Multiplicative Damage ».\n- Pour régler vos défenses : vidéo « How to avoid getting one-shot ».\n\nInteractions d'aspects\n- L'Aspect du frappe-terre donne un bonus de dégâts sans changer d'arme. Il suffit d'avoir le bonus d'Accablement actif pour déclencher la seconde moitié de l'aspect.\n- Le glyphe Maître d'armes donne un bonus de dégâts sans changer d'arme.\n- L'Aspect de folie guerrière donne un bonus de dégâts pendant la Rage du berserker, sans changer d'arme.\n- Rage de sang gagne des dégâts tant que la Rage du berserker est active. Infliger des dégâts sur la durée n'est pas nécessaire pour obtenir ce bonus.\n\nGestion de la Fureur\nAffixes :\n- La Génération de ressource augmente la Fureur gagnée à chaque source de Fureur et se combine très bien avec Cri de ralliement.\n- La Régénération de Fureur est à ajouter sur le casque, le plastron, le pantalon et les bottes.\n- Vous pouvez aussi utiliser des trempes « Coup de chance : chance de restaurer de la ressource principale », à placer sur les bijoux.\n- Ne spammez pas votre compétence principale loin des monstres si vous ne pouvez pas maintenir votre Fureur. Toucher des monstres grâce au glyphe Colère génère de la Fureur.\n- Si vous n'avez pas l'Anneau du ciel sans étoiles, vous pouvez ajouter quelques affixes de Réduction du coût en ressource sur vos armes à deux mains pour imiter cet effet.\n\nRessources de l'auteur\nVidéo des Plans de guerre. Filtres de butin (code à copier sur la page Mobalytics) : filtre général avec explications ; début de jeu après le niveau 70 (850 objets, en Tourment I) ; milieu de jeu (Tourment IV à VIII) ; fin de jeu (Tourment VIII à XII). Vidéo « Ce mythique est-il utilisable avec mon build ? », Cliptis.com, tableur Google, vidéos sur le Maîtrise et la Trempe et sur le meilleur farm de matériaux, tables de butin des boss.\n\nJournal des modifications\n- 28 juil. 2026 : variante Gel ajoutée ; descriptions de plusieurs variantes clarifiées ; section Gestion de la Fureur mise à jour.\n- 3 août 2026 : Carnage ajouté à la variante Gel. À utiliser comme référence pour la variante sans Gel si vous changez.\n- 18 sept. 2026 : mots runiques ajoutés aux variantes (encore en test). Aspects de la section Uniques déplacés pour faire de la place. Plans de guerre et Pouvoirs des Maléfiques ajoutés à la variante Selig.\n- 19 sept. 2026 : Résistance physique ajoutée aux charmes et à plusieurs affixes d'armure ; « Coup de chance : chance de restaurer de la ressource principale » retiré des armes ; FAQ mise à jour avec les descriptions des nouveaux mots runiques.\n- 20 sept. 2026 : Infinité (masse à deux mains) et Esprit (épée à une main) ajoutés aux variantes Cœur fondu de Selig et Mythique (voir la FAQ). Exploitation remplacé par Broyage, points de Parangon réorganisés. Aspects des variantes Uniques et Mythique alignés sur les mots runiques.\n- 21 sept. 2026 : description d'Infinité (masse à deux mains) ajoutée sous l'équipement. Courroux du berserker : Duration Bonus remplacé par Overpower. Aspect du frappe-terre ajouté comme Kullean Tuning Prism. Mobilisation ajouté à la place d'Exploitation. Affixes mis à jour pour les mots runiques. Carnage remplacé par Décimation dans la variante Cœur fondu de Selig.\n- 24 sept. 2026 : avertissement sur le bug console des mots runiques ajouté au guide.\n- 30 sept. 2026 : descriptions des éclats ajoutées sous l'équipement.\n- 3 oct. 2026 : Torche des flammes infernales ajoutée aux variantes Mythique et Selig.";b.nfu=b.u;}window.D4DESC=window.D4DESC||{};window.D4DESC["Enigma"]=["u","Mot runique — Armure de torse","Votre esquive devient la téléportation du sorcier et coûte 33 points de ressource principale."];
window.D4DESC["Melted Heart of Selig"]=["u", "Unique mythique — Amulette", "Puissance de l'objet : 850\n157 Toutes les résistances\n+12.0% à toutes les caractéristiques\n+15.0% de chances d'obtenir un Coup de chance\n+25% à la vitesse de déplacement\n20.0% de génération de ressources\nLes dégâts sont infligés en premier lieu à votre ressource principale au lieu de vos points de vie et les dégâts subis de cette manière sont considérablement réduits.\nVotre ressource principale est doublée, mais votre maximum de points de vie est réduit de 75%."];})();</script>

function ruleTr(en){
  let m;
  if((m=en.match(/^Ranks To (.+?) Skills$/))) return "Rangs des compétences : "+tr(m[1]);
  if((m=en.match(/^Ranks To (.+)$/))) return "Rangs : "+tr(m[1]);
  if((m=en.match(/^(Fire|Lightning|Cold|Poison|Shadow|Physical) Damage Multiplier$/))) return "Multiplicateur de dégâts "+ELEM[m[1]];
  if((m=en.match(/^(Fire|Lightning|Cold|Poison|Shadow) Resistance$/))) return "Résistance "+ELEM[m[1]].replace(/^de /,"au ").replace(/^d'/,"à l'");
  if((m=en.match(/^Splinter of (.+)$/))) return "Fragment : "+m[1];
  if((m=en.match(/^Aspect of (the )?(.+)$/i))) return null;
  return null;
}
const FRO=(window.D4FR&&window.D4FR.terms)||{}, FRSETS=(window.D4FR&&window.D4FR.sets)||{};
const FRL={}; Object.entries(FRO).forEach(([k,v])=>FRL[k.toLowerCase()]=v);
function official(s){
  const d=FRO[s]||FRL[s.toLowerCase()]; if(d) return d;
  const m=s.match(/^(Linta|Mlor|Fer|Berú|Phoba) of (.+)$/); if(m&&FRSETS[m[2]]) return m[1]+" "+FRSETS[m[2]];
  return null;
}
function tr(en){
  if(en==null) return "";
  const s=String(en).trim();
  return OV[s] || official(s) || GL[s] || ruleTr(s) || s;
}
const has = en => !!(OV[en]||official(en)||GL[en]||ruleTr(en));
/* une stat brute de Mobalytics -> {txt, temp, fam} */
function statFR(raw){
  let s=raw, temp=false, fam="";
  if(s.endsWith("*")){temp=true; s=s.slice(0,-1);}
  const p=s.match(/^(.*?)\s*\(([^)]*)\)$/); if(p){ s=p[1]; fam=p[2]; temp=true; }
  if(/^(Stat \d|Tempering Stat \d)$/.test(s)) return null;
  return {txt:tr(s), en:s, temp, fam};
}

function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
let TERM_RE=null, TERM_KEYS=[];
function buildTermRe(){
  TERM_KEYS=[...new Set([...Object.keys(GL),...Object.keys(FRO),...Object.keys(OV)])].filter(k=>k.length>3 && tr(k)!==k).sort((a,b)=>b.length-a.length);
  TERM_RE = TERM_KEYS.length ? new RegExp("(^|[^A-Za-z'])("+TERM_KEYS.map(escapeRe).join("|")+")(?![A-Za-z'])","g") : null;
}
function cleanNotes(n){ return (n||"").replace(/ \n/g," ").replace(/\n(?=[,.!:;)])/g,"").replace(/\n- \n/g,"\n- ").trim(); }
function notesMechanical(n){
  let t=cleanNotes(n);
  PHRASES.forEach(([re,rep])=>{t=t.replace(re,rep);});
  if(TERM_RE) t=t.replace(TERM_RE,(m,pre,term)=>pre+tr(term));
  return t;
}

    if(CAN_WRITE&&DB){ try{ await DB.collection("notes").doc(b.id).set({fr:text,upd:b.u}); toast("Traduction enregistrée pour tous les visiteurs"); }catch(e){ toast("Traduction affichée, mais pas enregistrée"); } }
    renderNotes(b);
  }catch(e){
    el.innerHTML=old;
    toast(e&&e.code==="not_granted"?"Claude n'est pas autorisé sur cette page":e&&e.code==="rate_limited"?"Trop de demandes, réessayez plus tard":"La traduction a échoué, réessayez");

  }
}

const PSLOTS=["Helm","Chest Armor","Gloves","Pants","Boots","Amulet","Ring 1","Ring 2","Weapon","Offhand"];

function classItems(k){ const s=new Set(); D.loot.forEach(b=>{(b.all||[]).forEach(i=>s.add(i));(b[CLASSES[k].en]||[]).forEach(i=>s.add(i));}); RUNEWORDS.forEach(i=>s.add(i)); LEGACY.forEach(i=>s.add(i)); D.builds.filter(b=>b.cls===k).forEach(b=>b.g.forEach(g=>s.add(g[1]))); return [...s].sort((a,b)=>tr(a).localeCompare(tr(b),"fr")); }
function toEn(v){ v=v.trim(); if(!v) return ""; const m=v.match(/\(([^)]+)\)\s*$/); if(m) return m[1]; const hit=Object.keys({...GL,...OV}).find(en=>tr(en).toLowerCase()===v.toLowerCase()); return hit||v; }
function loadBuildIntoPlan(b){

function whereKey(label){
  const hit=D.loot.find(b=>b.boss!=="All Bosses"&&tr(b.name)===label); if(hit) return hit.boss;

  if(/^Mythique/.test(label)) return "_myth";
  if(/^Mot runique/.test(label)) return "_rune";

  if(/^Aspect/.test(label)) return "_aspect";
  return null;
}

  r.querySelectorAll(".wherebtn").forEach(b=>b.addEventListener("click",()=>{const p=document.getElementById(b.getAttribute("aria-controls"));const open=b.getAttribute("aria-expanded")!=="true";b.setAttribute("aria-expanded",open);p.hidden=!open;}));

  $("#v-classes").innerHTML=`<h2>Spécialisations de classe</h2><p class="lede">Le système propre à chaque classe, les choix faits par les builds de Mobalytics et les changements du patch 3.2.1.</p>
  <div class="grid">${Object.entries(CLASSES).map(([k,c])=>{const u=usage[k]?Object.entries(usage[k]).sort((a,b)=>b[1]-a[1]):[];return `<div class="box"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">${sigil(k)}<h3 style="margin:0">${c.nom}</h3></div>
    <div class="spec"><div class="name">${esc(c.spec)}</div><p class="small" style="margin:4px 0 0">${esc(c.specDesc)}</p></div>
    ${u.length?`<p class="small" style="margin:10px 0 0"><span class="eyebrow">Choix dans les builds</span><br>${u.map(([o,n])=>`${esc(tr(o))} (${n})`).join(" · ")}</p>`:""}
    <p class="small" style="margin:10px 0 0"><span class="eyebrow">Patch 3.2.1</span><br>${esc(ch[k])}</p></div>`;}).join("")}</div>`;
}

/* ============ TRADUCTIONS (glossaire partagé) ============ */
let TQ={q:"",only:false};
function allTerms(){
  const s=new Set();
  D.builds.forEach(b=>{ s.add(b.name); b.g.forEach(g=>{s.add(g[0]);s.add(g[1]);(g[3]||"").split("+").filter(Boolean).forEach(x=>s.add(x));}); b.s.forEach(x=>{s.add(x[0]);x[1].forEach(y=>s.add(y));}); b.c.forEach(x=>s.add(x)); (b.p||[]).forEach(x=>s.add(x)); b.b.forEach(x=>{s.add(x[0]);s.add(x[1]);}); Object.keys(b.st).forEach(x=>s.add(x)); });
  D.dict.forEach(x=>{const r=statFR(x); if(r) s.add(r.en);});
  D.loot.forEach(b=>{ s.add(b.name); if(b.location) s.add(b.location); Object.values(b).forEach(v=>Array.isArray(v)&&v.forEach(i=>s.add(i))); });
  return [...s].filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
const keyOf=en=>en.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,180)||"x";
let PENDING={};
function renderTrad(){
  const v=$("#v-trad"); const terms=allTerms();
  const st=en=>OV[en]?"perso":official(en)?"off":(GL[en]||ruleTr(en))?"base":"none";
  const nNone=terms.filter(t=>st(t)==="none").length;
  const list=terms.filter(t=>(!TQ.only||st(t)==="none")&&(!TQ.q||(t+" "+tr(t)).toLowerCase().includes(TQ.q.toLowerCase())));
  v.innerHTML=`<h2>Traductions</h2>
   <p class="lede">Les noms « officiel » viennent de la version française du jeu (base de données Wowhead). Le reste vient du glossaire du site. ${CAN_WRITE?"Corrigez une traduction ou complétez celles qui manquent : elle s'applique aussitôt partout, pour tous les visiteurs.":"Seuls les éditeurs de la page peuvent modifier le glossaire."}</p>
   <div class="status"><span><span class="dot"></span> ${terms.length} termes</span><span>${terms.length-nNone} traduits</span><span style="color:var(--bad)">${nNone} encore en anglais</span><span>${Object.keys(OV).length} corrections enregistrées</span></div>
   <div class="toolbar"><input class="search" id="tq" type="search" placeholder="Chercher un terme" value="${esc(TQ.q)}" aria-label="Chercher un terme">
     <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="tonly" ${TQ.only?"checked":""}> Seulement les termes non traduits</label>
     ${CAN_WRITE?`<button class="btn primary" id="tsave">Enregistrer les modifications</button>`:""}
     ${CAN_WRITE&&SAMPLE?`<button class="btn" id="tclaude">Proposer les traductions manquantes avec Claude</button>`:""}
   </div>
   <div class="tablewrap"><table><thead><tr><th>Anglais (Mobalytics)</th><th>Français</th><th>Source</th></tr></thead><tbody>
   ${list.slice(0,400).map(t=>{const s=st(t);const val=PENDING[t]!=null?PENDING[t]:(OV[t]||"");return `<tr><td>${esc(t)}</td><td>${CAN_WRITE?`<input data-en="${esc(t)}" value="${esc(val)}" placeholder="${esc(tr(t))}" class="${PENDING[t]!=null?"dirty":""}" aria-label="Traduction de ${esc(t)}">`:esc(tr(t))}</td><td><span class="st ${s}">${s==="perso"?"corrigé":s==="off"?"officiel":s==="base"?"glossaire":"à traduire"}</span></td></tr>`;}).join("")}
   </tbody></table></div>
   ${list.length>400?`<p class="small">${list.length-400} autres termes : affinez la recherche.</p>`:""}`;
  $("#tq").addEventListener("input",e=>{TQ.q=e.target.value;clearTimeout(renderTrad._t);renderTrad._t=setTimeout(()=>{renderTrad();const i=$("#tq");i.focus();i.setSelectionRange(i.value.length,i.value.length);},250);});
  $("#tonly").addEventListener("change",e=>{TQ.only=e.target.checked;renderTrad();});
  v.querySelectorAll("input[data-en]").forEach(i=>i.addEventListener("input",()=>{PENDING[i.dataset.en]=i.value;i.classList.add("dirty");}));
  const sv=$("#tsave"); if(sv) sv.addEventListener("click",saveTrad);
  const tc=$("#tclaude"); if(tc) tc.addEventListener("click",()=>suggestTrad(tc,terms.filter(t=>st(t)==="none")));
}
async function saveTrad(){
  if(!DB) return toast("Base de données indisponible");
  const entries=Object.entries(PENDING); if(!entries.length) return toast("Aucune modification");
  let ok=0;
  for(const [en,fr] of entries){
    try{ const ref=DB.collection("glossaire").doc(keyOf(en)); if(fr.trim()) await ref.set({en,fr:fr.trim()}); else await ref.delete(); ok++; delete PENDING[en]; }
    catch(e){ toast("Enregistrement refusé : vérifiez vos droits d'édition"); break; }
  }
  if(ok) toast(ok+" traduction"+(ok>1?"s":"")+" enregistrée"+(ok>1?"s":""));
}
async function suggestTrad(btn,missing){
  if(!missing.length) return toast("Tout est déjà traduit");
  btn.disabled=true; btn.textContent="Claude traduit…";
  const batch=missing.slice(0,150);
  try{
    const res=await SAMPLE.json(`Tu traduis des termes du jeu Diablo IV (Saison 15) de l'anglais vers le français, en utilisant les noms officiels de la version française quand tu les connais. Ce sont des noms d'objets uniques, d'aspects, de compétences, de plateaux et glyphes de Parangon, de sets de talisman et de statistiques. Si tu n'es pas sûr d'un nom officiel, propose une traduction fidèle. Réponds uniquement avec un objet JSON {"terme anglais": "traduction française"}.\n\nTermes :\n${batch.join("\n")}`,{modelTier:"default"});
    let n=0; Object.entries(res||{}).forEach(([en,fr])=>{ if(batch.includes(en)&&typeof fr==="string"&&fr.trim()){ PENDING[en]=fr.trim(); n++; } });
    TQ.only=true; renderTrad(); toast(n+" propositions : relisez-les puis enregistrez");
  }catch(e){ toast(e&&e.code==="not_granted"?"Claude n'est pas autorisé sur cette page":"Les propositions ont échoué, réessayez"); btn.disabled=false; btn.textContent="Proposer les traductions manquantes avec Claude"; }
}

function renderAll(){ buildTermRe(); renderTier(); renderBoss(); renderGems(); renderPlan(); renderClasses(); }
buildTermRe(); renderBuilds(); renderAll();
(function route0(){ const h=(location.hash||"").slice(1); if(TABS.includes(h)){ if(h==="trad") renderTrad(); showTab(h,{keepHash:true,noScroll:true}); } else if(D.builds.some(b=>b.id===h)){ openBuild(h); } })();

/* capacités : base partagée, identité, Claude */
(async()=>{
  if(!window.claude||!window.claude.use) return;
  const [db,user,sample]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
  SAMPLE=sample||null;
  if(user){ try{ CAN_WRITE=await user.canEdit(); }catch(e){} }
  const rerenderOpen=()=>{ const open=$("#v-builds .detail"); const h=(location.hash||"").slice(1); if(open&&D.builds.some(b=>b.id===h)){ const b=D.builds.find(x=>x.id===h); renderNotes(b);} else if(!$("#v-builds").hidden) renderBuilds(); if(!$("#v-trad").hidden) renderTrad(); };
  if(!db){ rerenderOpen(); return; }
  DB=db;
  db.collection("glossaire").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{const x=d.data(); if(x&&x.en&&x.fr) o[x.en]=x.fr;}); OV=o; renderAll(); rerenderOpen(); }, ()=>{});
  db.collection("notes").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{const x=d.data(); if(x&&x.fr) o[d.id]=x;}); NOTES=o; rerenderOpen(); }, ()=>{});
})();

/* ============ INFOBULLES (descriptions Wowhead FR) ============ */
(function(){
  const DESC=window.D4DESC||{};
  const tip=document.createElement("div"); tip.id="tip"; tip.hidden=true; tip.setAttribute("role","tooltip"); document.body.appendChild(tip);
  const COL={u:"var(--unique)",m:"var(--mythic)",l:"var(--legend)",r:"var(--rune)",s:"var(--ember)"};
  const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,'<span class="rg">[$1]</span>').split(/\n+/).filter(x=>x.trim()).map(x=>`<p>${x}</p>`).join("");
  let cur=null;
  function html(el){
    const en=el.dataset.tip, kind=el.dataset.tr||"u", d=DESC[en];
    const fr=tr(en), r=d&&d[0]==="a"?"l":kind;
    tip.style.setProperty("--tc",COL[r]||COL.u);
    let src="";
    if(kind!=="s"){ const l=sources(en,kind==="s"?"u":kind).filter(x=>!/^Aspect légendaire —/.test(x)||!d||d[0]!=="a"); if(d&&d[0]==="a") l.unshift("Codex de puissance ou extraction sur un légendaire"); if(l.length) src=`<div class="tsrc"><b>Où l'obtenir :</b> ${l.map(esc).join(" · ")}</div>`; }
    return `<div class="tn">${esc(fr)}</div>${fr!==en?`<div class="te">${esc(en)}</div>`:""}<div class="ts">${esc(d?d[1]:(kind==="s"?"Compétence":RUNEWORDS.includes(en)?"Mot runique":/^(Fer|Linta|Mlor|Berú|Phoba) of /.test(en)?"Charme d'ensemble":kind==="m"?"Unique mythique":"Unique"))}</div>
      <div class="td">${d?fmt(d[2]):`<p class="nd">Description pas encore relevée pour cet objet.</p>`}</div>${src}`;
  }
  function place(el){
    const r=el.getBoundingClientRect(), W=innerWidth, H=innerHeight, w=tip.offsetWidth, h=tip.offsetHeight;
    let x=Math.min(Math.max(8,r.left),W-w-8), y=r.bottom+8;
    if(y+h>H-8) y=Math.max(8,r.top-h-8);
    tip.style.left=x+"px"; tip.style.top=y+"px";
  }
  function show(el){ if(cur===el&&!tip.hidden) return; cur=el; tip.innerHTML=html(el); tip.hidden=false; place(el); }
  function hide(){ cur=null; tip.hidden=true; }
  const T=e=>e.target.closest&&e.target.closest("[data-tip]");
  let touch=false;
  document.addEventListener("touchstart",()=>{touch=true;},{passive:true});
  document.addEventListener("mouseover",e=>{ if(touch) return; const el=T(e); if(el) show(el); else if(cur) hide(); });
  document.addEventListener("focusin",e=>{ const el=T(e); if(el) show(el); else hide(); });
  document.addEventListener("focusout",()=>hide());
  document.addEventListener("click",e=>{ if(!touch) return; const el=T(e);
    if(el&&!el.closest(".brow")){ if(cur===el) hide(); else show(el); } else hide(); },true);
  addEventListener("scroll",()=>{ if(cur) hide(); },{passive:true});
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") hide(); });
})();
</script>
