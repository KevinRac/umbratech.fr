<title>La Brume</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout : arène plein écran sur canvas, HUD épinglé aux coins, menus en panneaux sombres centrés. Un seul thème, nocturne, par choix. */
:root{
  --night:#07080d; --deep:#0f121b; --panel:rgba(14,17,26,.95); --card:#121521; --line:#2a2f43; --line-hi:#454b66;
  --bone:#ece4ce; --ash:#9c99a9; --mute:#6c6a7a;
  --flame:#f3b94d; --umbra:#a387ec; --ember:#ea7a43; --blood:#dc4a55; --bile:#8fd46e;
  --f-display:"Grenze Gotisch","UnifrakturMaguntia",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.hud-tl{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:3px}
.act{font-family:var(--f-display);font-size:23px;line-height:1.1;margin:0;color:var(--bone);text-shadow:0 2px 10px #000}
.roomline{margin:0;color:var(--ash);font-size:13.5px;letter-spacing:.12em;text-transform:uppercase}
.path{display:flex;gap:4px;margin-top:4px}
.path span{min-width:22px;height:22px;padding:0 4px;display:grid;place-items:center;font-size:12.5px;font-weight:700;border:1px solid var(--line);color:var(--ash);background:rgba(8,10,16,.75);border-radius:3px}
.path span.cur{border-color:var(--flame);color:var(--flame)}
.hud-tr{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;width:min(230px,30vw);pointer-events:auto}
.relic{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line-hi);background:rgba(14,17,26,.88);border-radius:4px;color:var(--flame);font-size:16px;cursor:help}
.pausebtn{font:inherit;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;height:32px;padding:0 12px;border:1px solid var(--line-hi);background:rgba(14,17,26,.88);color:var(--ash);border-radius:4px;cursor:pointer}
.pausebtn:hover{color:var(--bone);border-color:var(--flame)}
.hud-boss{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,46vw);text-align:center}
.hud-boss p{font-family:var(--f-display);font-size:26px;margin:0 0 4px;color:#ffd8cf;text-shadow:0 2px 12px #000}
.bossbar{position:relative;height:11px;border:1px solid #6b2a33;background:rgba(0,0,0,.65);border-radius:2px;overflow:hidden}
.bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7e1a29,#e0434f)}
.bossbar::before,.bossbar::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);z-index:1}
.bossbar::before{left:33.3%}.bossbar::after{left:66.6%}
.hud-bl{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;width:min(320px,34vw)}
.stat{display:grid;grid-template-columns:84px minmax(0,1fr) 64px;align-items:center;gap:8px}
.stat .lab{color:var(--ash);text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;white-space:nowrap}
.stat .val{color:var(--bone);font-size:13.5px;text-align:right;white-space:nowrap}
.bar{position:relative;height:11px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
.bar.hp i{background:linear-gradient(90deg,#97283a,#e04f5b)}
.bar.lu i{background:linear-gradient(90deg,#b0761c,#f6c766)}
.bar.cor::before,.bar.cor::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45);z-index:1}
.bar.cor::before{left:var(--t1,33.3%)}.bar.cor::after{left:var(--t2,66.6%)}
.bar.cor.t0 i{background:linear-gradient(90deg,#3d7a33,#8fdc6c)}
.bar.cor.t1 i{background:linear-gradient(90deg,#7d8a2a,#e1d75a)}
.bar.cor.t2 i{background:linear-gradient(90deg,#8a2f22,#ff7a4d)}
.bar.xp,.bar.el{height:6px}
.bar.xp i{background:linear-gradient(90deg,#6c5bb3,#b6a3f2)}
.bar.el i{background:linear-gradient(90deg,#b4462b,#ffb15c)}
.bar.res i{background:linear-gradient(90deg,#34558c,#a6d4ff)}
.bar.bob i{background:linear-gradient(90deg,#7a1c34,#ff6b8a)}
.hud-skills{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px}
.slot{position:relative;width:68px;height:60px;border:1px solid var(--line-hi);background:rgba(11,13,20,.9);border-radius:4px;overflow:hidden;display:grid;align-content:space-between;padding:5px 7px}
.slot b{font-size:12.5px;color:var(--flame);font-weight:700;letter-spacing:.05em;position:relative;z-index:1}
.slot span{font-size:13px;color:var(--bone);line-height:1.1;position:relative;z-index:1}
.slot .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.66)}
.slot .badge{position:absolute;right:6px;top:4px;font-size:12.5px;color:var(--bone);font-style:normal;z-index:1}
.slot.locked{opacity:.28}
.slot.dim span{color:var(--mute)}
.hud-state{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:7px 12px;border:1px solid var(--line-hi);background:rgba(11,13,20,.9);border-radius:999px;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--flame)}
.hud-state.obscur{color:var(--umbra);border-color:#4a3d74}
.hud-state.inv{color:#c9d2ff;border-color:#3d4a7a}
.hud-state.sur{color:#fff1c2;border-color:var(--flame);background:rgba(80,55,10,.85)}
.hud-state.blind{color:var(--mute)}
.hud-state.g0{color:var(--bile);border-color:#3b5a33}
.hud-state.g1{color:#e3d860;border-color:#6a6328}
.hud-state.h0{color:#9fb7d8;border-color:#34445e}
.hud-state.h1{color:#c4e2ff;border-color:#4a6a96}
.hud-state.h2{color:#fff6dc;border-color:#e0b468;background:rgba(40,32,14,.88)}
.hud-state.t0{color:#ff9ec0;border-color:#6a2a44}
.hud-state.g2{color:#ff8462;border-color:#7a3226;background:rgba(60,14,10,.88)}
.hint{position:absolute;left:50%;top:calc(126px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(780px,calc(100% - 32px));text-align:center;font-size:14.5px;color:#d9d1bd;background:rgba(8,10,16,.82);border:1px solid var(--line);border-radius:4px;padding:8px 14px}
.hint kbd{font:700 12.5px var(--f-body);color:var(--flame);border:1px solid var(--line-hi);border-radius:3px;padding:1px 5px;margin:0 2px}
#toast{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);max-width:min(720px,calc(100% - 32px));padding:11px 22px;background:rgba(8,10,16,.97);border:1px solid var(--flame);border-radius:6px;font-size:18px;line-height:1.35;font-weight:600;color:#fff6df;text-shadow:0 1px 2px #000;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 8px 26px rgba(0,0,0,.6),0 0 22px rgba(243,185,77,.18);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tarrow{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:16;overflow:visible}
#tarrow .ring{animation:tapulse 1.1s ease-in-out infinite}
@keyframes tapulse{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){#tarrow .ring{animation:none}}
#toast.pause{font-size:20px;padding:14px 26px;border-width:2px;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 10px 34px rgba(0,0,0,.7),0 0 34px rgba(243,185,77,.35)}
#toast .sub{display:block;margin-top:6px;font-size:14px;font-weight:500;color:var(--flame);letter-spacing:.04em}
#banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;width:calc(100% - 32px)}
#banner.show{opacity:1}
#banner p{margin:0;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
#banner h2{font-family:var(--f-display);font-weight:500;font-size:clamp(44px,7vw,92px);line-height:1;margin:6px 0 0;color:#f4e3c0;text-shadow:0 0 40px rgba(243,185,77,.35),0 4px 18px #000}
#banner.boss h2{color:#ffd2c8;text-shadow:0 0 44px rgba(255,64,87,.45),0 4px 18px #000}

/* Overlays */
#overlay{position:absolute;inset:0;overflow-y:auto;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(120% 90% at 50% 35%,rgba(10,12,20,.72),rgba(3,4,8,.95));backdrop-filter:blur(2px)}
#overlay.see{background:linear-gradient(90deg,rgba(4,5,9,.93) 0%,rgba(4,5,9,.78) 46%,rgba(4,5,9,.45) 100%);backdrop-filter:none}
.panel{width:min(1140px,100%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px clamp(16px,3vw,40px);box-shadow:0 30px 90px rgba(0,0,0,.65)}
.eyebrow{margin:0;font-size:13.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;color:var(--bone)}
h2{font-size:clamp(32px,4.2vw,46px);line-height:1.02;margin-top:4px}
.sub{color:#cfc7b3;margin:8px 0 18px;max-width:58ch}
.h-sec{margin:22px 0 10px;font-size:13.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
.btn{font:inherit;font-weight:700;letter-spacing:.05em;padding:11px 18px;border-radius:4px;border:1px solid var(--line-hi);background:#1a1e2c;color:var(--bone);cursor:pointer}
.btn:hover{border-color:var(--flame)}
.btn.primary{background:var(--flame);color:#1d1405;border-color:var(--flame)}
.btn.primary:hover{background:#ffc965}
.btn.big{font-size:17px;padding:14px 26px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,.pausebtn:focus-visible,.cls:focus-visible{outline:2px solid var(--flame);outline-offset:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.k{font-size:13.5px;color:var(--mute)}
.muted{color:var(--mute)}

/* Écran titre */
.title-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;width:min(1180px,100%)}
@media (max-width:900px){.title-wrap{grid-template-columns:1fr}}
.title-main h1{font-size:clamp(76px,12vw,150px);line-height:.86;color:#f6e7c4;text-shadow:0 0 60px rgba(243,185,77,.32),0 6px 24px #000;margin:10px 0 18px}
.lede{font-size:18px;color:#d8d0bb;max-width:44ch;margin:0 0 26px}
.coarse-note{display:none;margin:14px 0 0;color:var(--ember)}
@media (pointer:coarse){.coarse-note{display:block}}
.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.classes{grid-template-columns:1fr}}
.cls{appearance:none;font:inherit;color:inherit;text-align:left;border:1px solid var(--line);background:rgba(14,17,26,.88);border-radius:4px;padding:12px 14px;display:grid;gap:4px;align-content:start}
button.cls{cursor:pointer}
button.cls:hover{border-color:var(--line-hi)}
.cls.sel{border-color:var(--c,var(--flame));box-shadow:inset 0 0 0 1px var(--c,var(--flame))}
.cls.off{opacity:.5}
.cls .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cls h3{font-size:24px;line-height:1}
.cls .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);border:1px solid var(--line-hi);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cls.sel .tag{color:var(--c,var(--flame));border-color:var(--c,var(--flame))}
.cls p{margin:0;font-size:14.5px;color:#cbc3af}
.cls .mech{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:14px}
.keys dt{text-align:right;white-space:nowrap}
.keys dd{margin:0;color:#cfc7b3}
kbd{font:700 13.5px var(--f-body);color:var(--flame);border:1px solid var(--line-hi);border-bottom-width:2px;border-radius:3px;padding:2px 7px;background:#11141e}
.tip{margin:14px 0 0;font-size:14.5px;color:var(--ash);max-width:56ch}

/* Montée de niveau, arbre */
.lv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
@media (max-width:880px){.lv{grid-template-columns:1fr}}
.tree-wrap{position:relative;border:1px solid var(--line);border-radius:4px;background:radial-gradient(circle at 50% 45%,#131726 0%,#0b0d14 72%);padding:8px 8px 2px}
.tree-svg .ar{max-height:min(54vh,500px);margin:0 auto}
.tbar{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}
.tb{font:500 13px var(--f-body);color:#cfc7b3;background:#10131c;border:1px solid #2a2f43;border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3;position:relative}
.tb .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#cfc7b3);display:inline-block}
.tb small{color:var(--mute);font-size:11.5px}
.tb:hover{border-color:var(--c,#8d8a9c);color:#fff}
.tb.on{background:color-mix(in srgb,var(--c,#cfc7b3) 22%,#10131c);border-color:var(--c,#cfc7b3);color:#fff}
.tb.sealed{opacity:.6}
.tb .od{position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--flame);box-shadow:0 0 8px var(--flame);animation:pulse 1.15s ease-in-out infinite}
.tb:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.tree-cap{min-height:92px;margin:10px 0 8px;padding:9px 14px;background:#0f121c;border:1px solid var(--line);border-left:3px solid var(--flame);border-radius:4px;font-size:14.5px;color:#cfc7b3}
.tree-cap .cap-h strong{font-family:var(--f-display);font-weight:500;font-size:22px}
.tree-cap .cap-m{color:var(--mute);font-size:12.5px;letter-spacing:.05em;margin:1px 0 6px}
.tree-cap .cap-m em{color:var(--flame);font-style:normal}
.tree-cap .up{color:var(--ash)}
.tree-cap .caphint{color:var(--mute)}
.lv .ar-leg{margin:0 2px 4px;font-size:12px}
.cards{display:grid;gap:10px}
.card{appearance:none;font:inherit;color:inherit;text-align:left;display:grid;gap:6px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.card:hover,.card.hl{border-color:var(--c,var(--flame));background:#181c2a;transform:translateY(-1px)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.card .meta .br{color:var(--c,var(--flame))}
.card h3{font-size:27px;line-height:1.02}
.card p{margin:0;color:#d2cab6;font-size:14.5px}
.card.key{border-color:#7a6232;background:linear-gradient(180deg,rgba(243,185,77,.1),rgba(243,185,77,0) 65%),var(--card)}
.card.key h3{color:#ffdf9a}
.card .gl{font-size:22px;color:var(--flame);line-height:1}
.arming .card{opacity:.6;pointer-events:none}
.asc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.asc-grid{grid-template-columns:1fr}}
.card.asc h3{font-size:40px}
.card.asc ul{margin:6px 0 0;padding:0 0 0 18px;color:#cfc7b3;font-size:14px;display:grid;gap:3px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.three{grid-template-columns:1fr}}
.narrow{width:min(980px,100%)}

/* Pause, fin */
.stats{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.stats dt{color:var(--ash)}
.stats dd{margin:0;text-align:right;color:var(--bone)}
.rl{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;color:#cfc7b3}
.rl .g{color:var(--flame);font-size:18px;text-align:center}
.rl strong{color:var(--bone)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:20px}
.tile{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--card)}
.tile span{display:block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.tile b{display:block;font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;border:1px solid var(--c,var(--line-hi));color:var(--bone);border-radius:999px;padding:3px 10px;background:#11141e}
/* Monnaies, Sanctuaire, Colporteur */
.cur{margin:3px 0 0;font-size:14px;color:var(--ash);display:flex;gap:14px;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px #000}
.cur b{color:var(--flame);font-weight:700}
.cur .sh b{color:#b9c7ff}
#hud.hub .run-only{display:none!important}
#hud.hub .hint{top:auto;bottom:96px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.npc-head{display:grid;gap:4px;margin-bottom:18px}
.quote{margin:8px 0 0;font-style:italic;color:#d8cfb8;max-width:64ch;border-left:2px solid var(--line-hi);padding-left:12px}
.purse{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--ash);margin:0}
.purse b{font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1;color:var(--flame)}
.purse.sh b{color:#b9c7ff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card .price{justify-self:start;font-weight:700;font-size:14px;letter-spacing:.04em;color:#1d1405;background:var(--flame);border-radius:999px;padding:2px 10px}
.card[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.card.sold{opacity:.28}
.meta{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:4px}
.mrow h3{font-size:22px;line-height:1.05}
.mrow p{margin:3px 0 0;font-size:14.5px;color:#cfc7b3}
.pips{display:flex;gap:4px;margin-top:7px}

function hpMul(){return (1+0.085*(G()-1))*(PAL()>=1?1.2:1);}
function dmgMul(){return (1+0.03*(G()-1))*(PAL()>=3?1.2:1);}
function spdMul(){return 1+0.012*(G()-1);}
function budget(){return (4.5+1.5*(G()-1))*(PAL()>=2?1.2:1);}
function allowedTypes(){const g=G();const t=['rampant','rampant'];for(const k in UNLOCK)if(g>=UNLOCK[k])t.push(k);if(g>=8)t.push('spectre','brute');if(g>=14)t.push('voile','hurleur','brute');return t;}
function genWave(b,allowed){const list=[];let guard=0;while(b>0.9&&guard++<80){const t=pick(allowed);const c=ED[t].cost;if(c>b+0.5){if(allowed.every(a=>ED[a].cost>b+0.5))break;continue;}list.push({type:t});b-=c;}if(!list.length)list.push({type:'rampant'});return list;}

function chooseTheme(al){
 const set=new Set(al),g=G();
 const elig=Object.keys(WTHEMES).filter(k=>WTHEMES[k].need.every(t=>set.has(t)));
 let pool=elig.filter(k=>k!==RUN.lastTheme);if(!pool.length)pool=elig;
 const tot=pool.reduce((a,k)=>a+WTHEMES[k].w(g),0);let r=Math.random()*tot;
 for(const k of pool){r-=WTHEMES[k].w(g);if(r<=0)return k;}
 return pool[pool.length-1];
}
function planRoom(type){
 const B=budget(),al=allowedTypes(),waves=[];
 const forced=RUN.forceTheme&&WTHEMES[RUN.forceTheme]?RUN.forceTheme:null;
 const newT=forced?null:al.find(t=>t!=='rampant'&&!RUN.seen.has(t));
 if(type==='combat'){
  const theme=forced||chooseTheme(al);room.wtheme=theme;RUN.lastTheme=theme;
  const shape=G()<=2?[0.75,1.15]:[0.6,1.0,1.35];
  shape.forEach((f,i)=>{if(i===0&&newT){const n=(newT==='brute'||newT==='hurleur')?1:2;const w=[];for(let k=0;k<n;k++)w.push({type:newT});w.push({type:'rampant'},{type:'rampant'});waves.push(w);}else waves.push(WTHEMES[theme].build(B*f));});
 }else if(type==='elite'){
  const et=pick(G()>=14?['voile','nourrice','brute','hurleur']:G()>=8?['brute','spectre','hurleur']:['brute','spectre']);
  waves.push(genWave(B*0.6,al));waves.push([{type:et,elite:true},...genWave(B*0.55,al)]);
 }
 for(const w of waves)for(const x of w)RUN.seen.add(x.type);
 return waves;
}
function findSpawn(minD=230){for(let i=0;i<50;i++){const x=rand(AR.x0+40,AR.x1-40),y=rand(AR.y0+40,AR.y1-40);if(hyp(x-P.x,y-P.y)<minD)continue;if(room.pillars.some(p=>hyp(x-p.x,y-p.y)<p.r+30))continue;return{x,y};}return{x:rand(AR.x0+40,AR.x1-40),y:AR.y0+60};}
function themePos(sp,pc){
 let x,y;const fr=((sp.gi||0)+0.5)/(sp.gn||1);
 if(sp.x!=null){x=sp.x;y=sp.y;}
 else if(sp.at==='back'){x=AR.x0+170+(AR.x1-AR.x0-340)*fr+rand(-25,25);y=AR.y0+58+rand(0,28);}
 else if(sp.at==='screen'){x=AR.x0+120+(AR.x1-AR.x0-240)*fr+rand(-20,20);y=AR.y0+190+rand(-16,16);}
 else if(sp.at==='pack'&&pc){x=clamp(pc.x+rand(-95,95),AR.x0+30,AR.x1-30);y=clamp(pc.y+rand(-70,70),AR.y0+30,AR.y1-30);}
 else return findSpawn();
 if(hyp(x-P.x,y-P.y)<200||room.pillars.some(q=>hyp(x-q.x,y-q.y)<q.r+30))return findSpawn();
 return{x,y};
}
function spawnWave(w,last){const pc=w.some(s=>s.at==='pack')?findSpawn(300):null;for(const sp of w){const p=themePos(sp,pc);room.spawning.push({x:p.x,y:p.y,type:sp.type,elite:!!sp.elite,key:sp.key,tag:sp.tag,siege:sp.siege,t:0.85+Math.random()*0.45});}room.lastSize=w.length;room.sinceWave=0;if(last&&room.waves.length>1){toast('Dernière vague',1.6);sfx('lastwave');}}
function createEnemy(type,x,y,elite=false){const d=ED[type];const e={type,x,y,r:d.r*(elite?CHAMP.taille:1),maxHp:d.hp*hpMul()*(elite?CHAMP.pv:1),spd:d.spd*spdMul()*(elite?CHAMP.vitesse:1),dmg:d.dmg*dmgMul()*(elite?CHAMP.degats:1),xp:d.xp*(elite?CHAMP.xp:1)*(1+0.05*(G()-1)),elite,state:'walk',t:rand(1.2,2.2),windTot:0.75,cd:rand(1,2.5),kbx:0,kby:0,flash:0,stun:0,marked:0,burnT:0,burnDps:0,exposed:false,dotAcc:0,dotT:0.45,orbT:0,crownT:0,devT:0,wob:Math.random()*TAU,ang:0,dead:false,chained:false,vuln:0,wT:0,dir:Math.random()<0.5?1:-1,aim:false,tok:null,hasteT:0,singT:0,thornT:0};e.hp=e.maxHp;enemies.push(e);

function makeDoors(){
 const A=ACTS[RUN.act],next=RUN.roomIdx+1;let types;
 if(room.type==='boss'){if(RUN.act<3)types=[RUN.act===1?'act':'act3'];else return;}
 else if(next===A.rooms)types=['boss'];
 else if(next===A.rooms-1)types=['halte'];
 else{
  const eliteOk=(RUN.act===1?next>=3:next>=2)&&room.type!=='elite';
  const halteOk=next>=3&&room.type!=='halte'&&next<A.rooms-2;
  const opts=[['combat',5],['elite',eliteOk?2.4:0],['autel',room.type!=='autel'?1.5:0],['halte',halteOk?1.1:0],['marchand',(next>=2&&!RUN.merchantAct[RUN.act])?1.3:0]].filter(o=>o[1]>0);
  const n=Math.random()<0.65?3:2;types=[];
  while(types.length<n&&opts.length){const tot=opts.reduce((a,o)=>a+o[1],0);let r=Math.random()*tot,i=0;for(;i<opts.length;i++){r-=opts[i][1];if(r<=0)break;}i=Math.min(i,opts.length-1);types.push(opts[i][0]);opts.splice(i,1);}
  if(next===A.rooms-2&&!RUN.merchantAct[RUN.act]&&!types.includes('marchand'))types[types.length-1]='marchand';
 }
 const xs=types.length===1?[W/2]:types.length===2?[W/2-200,W/2+200]:[W/2-320,W/2,W/2+320];
 room.doors=types.map((t,i)=>({type:t,x:xs[i],open:0}));
}

function next1(){return room.doors.length===1&&room.doors[0].type==='halte';}
function updateRoom(dt){
 if(room.annT>0){room.annT-=dt;if(room.annT<=0)announceTheme();}
 for(const sp of room.spawning){sp.t-=dt;if(sp.t<=0){const ne=createEnemy(sp.type,sp.x,sp.y,sp.elite);if(sp.key)ne.key=true;if(sp.tag)ne.tag=sp.tag;if(sp.siege)ne.siege=true;if(sp.cm)ne.cm=true;if(sp.role)ne.role=sp.role;sp.done=true;sparks(sp.x,sp.y,6,'#b9a6ff');}}
 room.spawning=room.spawning.filter(s=>!s.done);
 for(const d of room.doors)d.open=Math.min(1,d.open+dt*1.6);
 if(room.npcs)updateNpcs();
 if(room.cleared)return;
 if(room.type==='boss'){if(!room.started){room.bannerT-=dt;if(room.bannerT<=0){room.started=true;createBoss();}}else if(room.bossDead){room.cleared=true;onRoomCleared();}return;}
 if(room.type==='combat'||room.type==='elite'){
  room.sinceWave+=dt;
  const alive=enemies.reduce((n,e)=>n+(e.dead||e.puppet>0?0:1),0)+room.spawning.length;
  if(room.waveI<room.waves.length){
   const ready=room.waveI===0?room.sinceWave>=0.9:(alive===0&&room.sinceWave>0.6)||(alive<=Math.ceil(room.lastSize*0.3)&&room.sinceWave>2.5)||room.sinceWave>11;
   if(ready){const i=room.waveI++;spawnWave(room.waves[i],i===room.waves.length-1);}
  }else if(alive===0){room.cleared=true;onRoomCleared();}
 }
}

function collidePlayer(){for(const p of room.pillars){const dx=P.x-p.x,dy=P.y-p.y,d=hyp(dx,dy)||1,m=p.r+P.r;if(d<m){P.x=p.x+dx/d*m;P.y=p.y+dy/d*m;}}P.x=clamp(P.x,AR.x0+P.r,AR.x1-P.r);P.y=clamp(P.y,AR.y0+P.r,AR.y1-P.r);}
function nearestEnemy(x,y,max,skip){let best=null,bd=max;for(const e of enemies){if(e.dead||(skip&&skip.has(e)))continue;const d=hyp(e.x-x,e.y-y);if(d<bd){bd=d;best=e;}}return best;}
function gainLueur(n,raw){if(P.cls!=='lum')return;P.lueur=Math.min(100,P.lueur+n*(raw?1:P.s.lueurGain*(1+P.elan/100)));}
function heal(n,src){if(P.s.faim&&!['devour','boss','halte'].includes(src))return;P.hp=Math.min(P.s.maxHp,P.hp+n);}
function gainXp(n){P.xp+=n;while(P.xp>=xpNeed(P.level)){P.xp-=xpNeed(P.level);P.level++;P.pendingLv++;heal(P.s.maxHp*0.06,'level');sfx('level');}}
function moveInput(){let mx=0,my=0;if(keys.has('KeyW')||keys.has('ArrowUp'))my-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))my+=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))mx-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))mx+=1;return[mx,my];}
function addElan(n){const before=P.elan;P.elan=Math.min(100,P.elan+n);P.elanT=1.8;if(before<100&&P.elan>=100){toast('Élan maximal',1.2);sfx('elan');}}

function updatePlayer(dt){
 const s=P.s;
 P.atkT-=dt;P.iT-=dt;P.aCd-=dt;P.eCd-=dt;P.ultCd-=dt;P.rCd-=dt;P.swingT-=dt;P.hurtFlash-=dt;P.ambushT-=dt;P.dashInvisT-=dt;P.blindT-=dt;P.nightT-=dt;P.lan.pickCd-=dt;P.carapT-=dt;P.carapFx-=dt;P.metaT-=dt;P.stompCd-=dt;
 P.elanT-=dt;if(P.elanT<=0)P.elan=Math.max(0,P.elan-22*dt);
 if(P.dashBuf>0){P.dashBuf-=dt;if(P.dashCh>0&&P.dashT<=0){P.dashBuf=0;tryDash();}}
 if(P.surT>0){P.surT-=dt;if(P.surT<=0){P.blindT=2;P.lueur=30;toast('Ta lumière s’éteint…');}}
 if(P.dashCh<s.dashCharges){P.dashRecT-=dt;if(P.dashRecT<=0){P.dashCh++;P.dashRecT=s.dashCd;}}else P.dashRecT=s.dashCd;
 if(P.cls==='gou')gouPre(dt);else if(P.cls==='her')herPre(dt);else if(P.cls==='tis')tisPre(dt);
 const [mx,my]=moveInput();const obs=isObscur();
 if(P.dashT>0){
  P.dashT-=dt;P.x+=P.dashVx*dt;P.y+=P.dashVy*dt;
  P.ghostT=(P.ghostT||0)-dt;if(P.ghostT<=0){P.ghostT=0.03;fx.push({k:'ghost',x:P.x,y:P.y,cls:P.cls,sc:P.cls==='gou'?gouScale():1,t:0.26,max:0.26,col:P.cls==='gou'?'150,225,110':P.cls==='her'?'140,190,255':P.cls==='tis'?'255,110,150':obs?'170,130,255':'255,200,120'});}if(P.cls==='gou'&&Math.random()<0.6)parts.push({x:P.x+rand(-8,8),y:P.y+12,vx:rand(-40,40),vy:rand(-30,0),life:0.4,max:0.4,size:rand(4,8),col:'#3a3a30',layer:'pre',drag:3,grow:1,a:0.6});
  if(P.cls==='gou'||s.pasOmbre||P.macDash){for(const e of enemies){if(e.dead||P.dashHit.has(e))continue;if(hyp(e.x-P.x,e.y-P.y)<e.r+P.r+6){P.dashHit.add(e);if(P.cls==='gou')hitEnemy(e,14*s.dashDmg,{kb:300*Math.min(2,s.dashDmg),sx:P.x-P.dashVx,sy:P.y-P.dashVy,color:'#c8f08a'});else if(P.macDash)hitEnemy(e,14+3*P.cad,{kb:120,sx:P.x,sy:P.y,color:'#bcd8ff'});else hitEnemy(e,18,{mark:4,kb:80,sx:P.x,sy:P.y,color:'#c9b4ff'});}}}
 }else{
  let sp=s.speed*(1+0.15*P.elan/100);
  if(P.cls==='lum'){sp*=obs?1+s.obscurSpeed:1;if(P.beam&&P.lan.state==='held')sp*=0.55;}
  else if(P.cls==='gou'){sp*=[1,0.94,0.9][gouTier()];if(P.mut&&P.mut.id==='fievre')sp*=1.3;if(P.devour)sp*=0.6;if(P.absT>0)sp*=0.3;}
  const l=hyp(mx,my);const tvx=l?mx/l*sp:0,tvy=l?my/l*sp:0;const k=Math.min(1,dt*16);
  P.vx+=(tvx-P.vx)*k;P.vy+=(tvy-P.vy)*k;P.x+=P.vx*dt;P.y+=P.vy*dt;
 }
 collidePlayer();
 P.walk=(P.walk||0)+dt*hyp(P.vx,P.vy)/16;
 P.face=Math.atan2(mouse.y-P.y,mouse.x-P.x);
 P.invisible=P.cls==='lum'&&(P.nightT>0||P.dashInvisT>0||(s.silhouette>0&&obs&&RUN.time-P.lastAtk>1.0));
 if(P.cls==='lum'){
  P.lueur=Math.min(100,P.lueur+(s.lueurRegen+(P.lan.state==='ground'?s.regenGround:0))*dt);
  if(s.surcharge&&P.lueur>=99.9&&P.surT<=0&&P.blindT<=0){P.surT=5;toast('Surcharge ! Compétences gratuites pendant 5 s');sfx('nova');}
 }
 if(P.cls==='her')herInput();else if(mouse.l&&P.atkT<=0&&P.dashT<=0&&P.absT<=0){if(P.cls==='tis')tisShoot();else swing();}
 if(P.cls==='lum')updateBeam(dt);else if(P.cls==='gou')gouPost(dt);
 for(const d of P.delayed){d.t-=dt;if(d.t<=0){doSwing(d.a,d.mult,true);d.done=true;}}
 P.delayed=P.delayed.filter(d=>!d.done);
 if(s.couronne)updateCrown(dt);
 if(P.zenithT>0)updateZenith(dt);
 if(room.cleared&&room.doors.length&&!trans&&overlayEl.hidden){for(const d of room.doors){if(d.open<0.6)continue;if(P.y<=AR.y0+P.r+4&&Math.abs(P.x-d.x)<34){trans={phase:'out',t:0,type:d.type};sfx('door');break;}}}
}
function tryDash(){const s=P.s;if(P.cls==='gou'&&s.colosse){stomp();return;}if(P.dashCh<=0||P.dashT>0)return;let [dx,dy]=moveInput();
 if(!dx&&!dy){dx=Math.cos(P.face);dy=Math.sin(P.face);}const l=hyp(dx,dy);const v=P.cls==='gou'?760:860;
 P.dashT=P.cls==='gou'?0.18:0.16;P.dashVx=dx/l*v;P.dashVy=dy/l*v;P.dashCh--;P.iT=Math.max(P.iT,0.22);P.dashHit=new Set();
 if(s.sub==='omb')P.dashInvisT=1.0;if(P.cls==='her')herDash();sfx('dash');}

function atkCooldown(){const s=P.s;if(P.cls==='lum')return s.atkCd/s.atkSpeed*(isObscur()?0.85:1);let sp=s.atkSpeed;if(s.frenesie&&gouTier()===2)sp*=1+(s.frenesie>=2?0.7:0.4);return s.atkCd/sp;}
function swing(){
 const s=P.s,obs=isObscur();
 P.atkT=atkCooldown();
 if(P.invisible&&s.silhouette>=2)P.ambushT=0.12;

 if(P.cls==='lum'){
  if(s.jumeaux){const n=s.jumeaux>=2?2:1,dm=16*(s.jumeaux>=2?1.3:1);for(let i=0;i<n;i++){const a=P.face+(n===2?(i?0.12:-0.12):0);pproj.push({x:P.x+Math.cos(a)*20,y:P.y+Math.sin(a)*20,vx:Math.cos(a)*720,vy:Math.sin(a)*720,r:6,dmg:dm,light:true,pierce:3,hit:new Set(),life:0.7,col:'255,150,90',kind:'ray'});}}
  if(s.jumelles&&obs)P.delayed.push({t:0.13,a:P.face,mult:s.jumelles>=2?0.8:0.5});
 }else if(s.tentacules)P.delayed.push({t:0.15,a:P.face,mult:s.tentacules>=2?0.9:0.6});
 if(s.bell){P.swingCount++;if(P.swingCount%5===0)later(0.05,()=>explosion(P.x,P.y,125,0,30,{col:'rgba(200,210,255,',spark:'#dfe5ff',light:'cold'}));}
 sfx(P.cls==='gou'?'chomp':'swing');
}
function swingShape(){const s=P.s;if(P.cls==='lum')return{arc:s.atkArc,range:s.atkRange};const full=P.metaT>0||(s.bras&&gouTier()>=1);let range=(s.atkRange+(s.bras>=2?18:0))*Math.sqrt(gouScale());if(P.mut&&P.mut.id==='membres')range*=1.35;return{arc:full?TAU:s.atkArc,range};}
function doSwing(a,mult,shadow){
 const s=P.s,obs=isObscur(),{arc,range}=swingShape();let hits=0;
 for(const e of enemies){if(e.dead)continue;const d=hyp(e.x-P.x,e.y-P.y);if(d>range+e.r)continue;if(arc<TAU&&d>e.r&&angDiff(Math.atan2(e.y-P.y,e.x-P.x),a)>arc/2)continue;
  const wasExp=e.exposed;hitEnemy(e,s.atkDmg*mult,{kb:shadow?60:(P.cls==='gou'?190:150),sx:P.x,sy:P.y,color:P.cls==='gou'?'#c8f08a':obs?'#c9b4ff':'#ffd98a'});hits++;
  if(!shadow){if(wasExp)gainLueur(s.lueurPerHit);if(P.cls==='gou')corAdd(5);}}
 if(!shadow)for(const p of eproj){if(p.boss)continue;const d=hyp(p.x-P.x,p.y-P.y);if(d<range+6&&(arc>=TAU||angDiff(Math.atan2(p.y-P.y,p.x-P.x),a)<arc/2)){p.dead=true;sparks(p.x,p.y,5,'#e9d9ff');}}
 let col;if(P.cls==='gou')col=shadow?'rgba(190,90,220,':['rgba(150,225,110,','rgba(220,215,90,','rgba(255,120,80,'][gouTier()];else col=shadow?'rgba(110,80,220,':(obs?'rgba(185,155,255,':'rgba(255,200,115,');
 if(P.cls==='gou'){if(arc>=TAU)fx.push({k:'ring',x:P.x,y:P.y,r0:range*0.4,r1:range,w:12,t:0.22,max:0.22,col});else fx.push({k:'bite',x:P.x,y:P.y,a,r:range,t:0.18,max:0.18,col:shadow?'200,110,230':TIERCOL[gouTier()]});}
 else{if(!shadow){P.swingDir=-(P.swingDir||1);P.swA=a;}const dir=shadow?-(P.swingDir||1):(P.swingDir||1);fx.push({k:'slash',x:P.x,y:P.y-4,a,r:range*0.92,arc:Math.min(arc,TAU-0.01),dir,style:shadow?'shadow':obs?'obs':P.s.sub==='sol'?'sol':'lum',t:0.2,max:0.2});
  if(!shadow)for(let i=0;i<6;i++){const an=a+rand(-arc/2,arc/2),d=range*rand(0.6,0.95),tg=an+dir*Math.PI/2,v=rand(120,260);parts.push({shape:'streak',x:P.x+Math.cos(an)*d,y:P.y-4+Math.sin(an)*d,vx:Math.cos(tg)*v,vy:Math.sin(tg)*v,life:0.3,max:0.3,size:1.6,col:obs?'#c9b4ff':'#ffd98a',layer:'post',drag:4});}}
 return hits;
}
function ult(){const s=P.s;if(P.ultCd>0)return;
 if(s.zenith){P.zenithT=5;P.zenithTick=0;P.ultCd=24;toast('Zénith');sfx('nova');}
 else if(s.nuit){P.nightT=6;P.ultCd=26;toast('Nuit Éternelle');sfx('boss');}

function beamOrigin(){const L=P.lan;if(L.state==='held')return{x:P.x+Math.cos(P.face)*14,y:P.y+Math.sin(P.face)*14};if(L.state==='ground'||L.state==='orbit')return{x:L.x,y:L.y};return null;}
function updateBeam(dt){
 const s=P.s,o=beamOrigin();
 const can=mouse.r&&o&&P.dashT<=0&&P.blindT<=0&&(P.lueur>0.5||P.surT>0);
 if(!can){P.beam=null;return;}
 const a=Math.atan2(mouse.y-o.y,mouse.x-o.x);const rays=s.prism?[-0.2,0,0.2]:[0];const per=s.beamDps*(s.prism?0.62*(s.prism>=2?1.35:1):1);
 P.beam={x:o.x,y:o.y,a,rays,len:s.beamLen,kind:'light'};
 if(P.surT<=0)P.lueur=Math.max(0,P.lueur-s.beamCost*dt);
 P.lastAtk=RUN.time;P.dashInvisT=0;
 P.beamTick-=dt;if(P.beamTick<=0){P.beamTick=0.1;for(const r of rays){const ex=o.x+Math.cos(a+r)*s.beamLen,ey=o.y+Math.sin(a+r)*s.beamLen;for(const e of enemies){if(e.dead)continue;if(segDist(e.x,e.y,o.x,o.y,ex,ey)<12+e.r){hitEnemy(e,per*0.1,{light:true,dot:true});if(Math.random()<0.25)impactFx(e.x+rand(-6,6),e.y+rand(-6,6),false,P.s.sub==='sol'?'255,120,80':'255,215,140');e.flash=Math.max(e.flash,0.03);if(s.oil){e.burnT=3;e.burnDps=12;}}}}}
 if(Math.random()<dt*20){const r=pick(rays),d=rand(30,s.beamLen);parts.push({x:o.x+Math.cos(a+r)*d,y:o.y+Math.sin(a+r)*d,vx:rand(-40,40),vy:rand(-60,-10),life:0.35,max:0.35,size:2,col:s.sub==='sol'?'#ff8a5c':'#ffd27a',layer:'post',drag:3});}
}
function nova(){const s=P.s;if(!s.nova)return;if(P.aCd>0)return;if(P.lueur<35&&P.surT<=0){toast('Pas assez de Lueur (35)');return;}
 if(P.surT<=0)P.lueur-=35;P.aCd=3.5;P.lastAtk=RUN.time;const R=160,dmg=60*(s.nova>=2?1.5:1);
 for(const e of enemies){if(e.dead)continue;if(hyp(e.x-P.x,e.y-P.y)<R+e.r)hitEnemy(e,dmg,{light:true,kb:s.nova>=2?420:160,sx:P.x,sy:P.y,color:'#ffe2a0'});}
 fx.push({k:'ring',x:P.x,y:P.y,r0:20,r1:R,w:16,t:0.4,max:0.4,col:'rgba(255,214,130,',fill:true});fx.push({k:'sun',x:P.x,y:P.y,r:R,rot:rand(0,TAU),t:0.45,max:0.45,col:'255,214,130'});tlights.push({x:P.x,y:P.y,r:R*2,t:0.4,max:0.4,c:'warm'});shake(6,0.2);sfx('nova');}
function lame(){const s=P.s;if(!s.lame||P.eCd>0)return;let best=null,bd=1e9;
 for(const e of enemies){if(e.dead)continue;if(hyp(e.x-P.x,e.y-P.y)>560)continue;const d=hyp(e.x-mouse.x,e.y-mouse.y);if(d<bd){bd=d;best=e;}}
 if(!best){toast('Aucune cible à portée');return;}
 const a=Math.atan2(best.y-P.y,best.x-P.x),ox=P.x,oy=P.y;P.x=best.x+Math.cos(a)*(best.r+20);P.y=best.y+Math.sin(a)*(best.r+20);collidePlayer();
 fx.push({k:'line',x1:ox,y1:oy,x2:P.x,y2:P.y,w:8,t:0.3,max:0.3,col:'rgba(170,130,255,'});for(let i=0;i<4;i++){const u=i/4;fx.push({k:'ghost',x:ox+(P.x-ox)*u,y:oy+(P.y-oy)*u,cls:'lum',sc:1,t:0.35-u*0.1,max:0.35,col:'170,130,255'});}fx.push({k:'slash',x:best.x,y:best.y,a:Math.atan2(best.y-oy,best.x-ox)+Math.PI/2,r:best.r+18,arc:2.4,dir:1,style:'obs',t:0.22,max:0.22});
 hitEnemy(best,45*(s.lame>=2?1.3:1),{forceCrit:isObscur(),mark:4,kb:120,sx:ox,sy:oy,color:'#d8c8ff'});
 P.eCd=5*(s.lame>=2?0.6:1);P.iT=Math.max(P.iT,0.3);P.lastAtk=RUN.time;P.dashInvisT=0;sfx('lame');}
function updateZenith(dt){P.zenithT-=dt;P.zenithTick-=dt;if(P.zenithTick>0)return;P.zenithTick=0.13;const al=enemies.filter(e=>!e.dead);let x,y;if(al.length){const t=pick(al);x=t.x+rand(-10,10);y=t.y+rand(-10,10);}else{x=rand(AR.x0+40,AR.x1-40);y=rand(AR.y0+40,AR.y1-40);}
 fx.push({k:'column',x,y,len:300,w:12,t:0.3,max:0.3,col:'rgba(255,140,80,'});fx.push({k:'ring',x,y,r0:6,r1:46,w:6,t:0.25,max:0.25,col:'rgba(255,150,90,'});tlights.push({x,y,r:110,t:0.25,max:0.25,c:'sol'});
 for(const e of enemies){if(e.dead)continue;if(hyp(e.x-x,e.y-y)<46+e.r)hitEnemy(e,38,{light:true,kb:80,sx:x,sy:y-1,color:'#ffb090'});}sfx('zap');}
function updateCrown(dt){const s=P.s;P.couronneA+=dt*2.6;const n=s.couronne>=2?5:3;for(let i=0;i<n;i++){const a=P.couronneA+i*TAU/n,ox=P.x+Math.cos(a)*80,oy=P.y+Math.sin(a)*80;for(const e of enemies){if(e.dead||e.crownT>0)continue;if(hyp(e.x-ox,e.y-oy)<e.r+10){hitEnemy(e,20,{light:true,kb:90,sx:P.x,sy:P.y,color:'#ffcf8a'});e.crownT=0.5;}}}}

 if(L.state==='held'||L.state==='orbit'){const a=Math.atan2(mouse.y-P.y,mouse.x-P.x);const d=Math.min(s.throwRange,Math.max(40,hyp(mouse.x-P.x,mouse.y-P.y)));

 L.state='ground';L.pickCd=0.35;tlights.push({x:L.x,y:L.y,r:220,t:0.3,max:0.3,c:'warm'});sparks(L.x,L.y,8,'#ffd27a');

function updateLantern(dt){if(P.cls!=='lum')return;const L=P.lan,s=P.s;
 switch(L.state){
 case 'held':{let an=P.face,d=16;if(P.swingT>0&&P.swA!=null){const e=easeOut(1-P.swingT/0.16);an=P.swA-(P.swingDir||1)*s.atkArc/2+(P.swingDir||1)*s.atkArc*e;d=24;}L.x=P.x+Math.cos(an)*d;L.y=P.y+Math.sin(an)*d+4;break;}

function gouTier(){return P.cor<34?0:P.cor<67?1:2;}

function corAdd(n){if(P.cls!=='gou')return;P.cor=Math.min(corCap(),P.cor+n*P.s.corGain);}
function gouGlow(){return 105+Math.min(P.cor,100)*1.5+Math.max(0,P.cor-100)*0.4;}

 if(s.crachats){P.crachT-=dt;if(P.crachT<=0){const t2=P.cor>=5?nearestEnemy(P.x,P.y,380):null;if(t2){const a=Math.atan2(t2.y-P.y,t2.x-P.x);pproj.push({x:P.x+Math.cos(a)*P.r,y:P.y+Math.sin(a)*P.r,vx:Math.cos(a)*560,vy:Math.sin(a)*560,r:6,dmg:16,cor:true,pierce:1,hit:new Set(),life:0.8,col:'150,230,100',kind:'glob'});P.cor-=3;P.crachT=s.crachats>=2?1.0:1.6;}else P.crachT=0.3;}}
 if(P.absT>0){P.absT-=dt;for(const e of enemies){if(e.dead)continue;const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1;if(d>P.r+e.r+6){const v=(e.fixed?0:e.type==='boss'?60:320)*dt;e.x+=dx/d*v;e.y+=dy/d*v;}}if(Math.random()<0.6)parts.push({x:P.x+rand(-300,300),y:P.y+rand(-200,200),vx:0,vy:0,life:0.4,max:0.4,size:3,col:'#f6ecc8',layer:'post',drag:1});

 if(s.halo&&P.shield>0){for(const e of enemies){if(e.dead)continue;if(hyp(e.x-P.x,e.y-P.y)<100+e.r)hitEnemy(e,(s.halo>=2?25:15)*dt,{dot:true});}}

 for(let i=0;i<3;i++){if(Math.random()>dt*30)continue;const d=rand(R*0.3,R),aa=a+rand(-arc/2,arc/2);const x=P.x+Math.cos(aa)*d,y=P.y+Math.sin(aa)*d;parts.push({x,y,vx:(P.x-x)/0.35,vy:(P.y-y)/0.35,life:0.35,max:0.35,size:2.2,col:'#9be07a',layer:'post',drag:0});}

 else if(P.cls==='gou'){lights.push({x:P.x,y:P.y,r:gouGlow()*drainK(),ex:true,c:['bile','sick','rage'][gouTier()]});if(P.beam)for(let d=40;d<P.beam.len;d+=85)lights.push({x:P.beam.x+Math.cos(P.beam.a)*d,y:P.beam.y+Math.sin(P.beam.a)*d,r:70,ex:false,c:'bile'});for(const p of pools)lights.push({x:p.x,y:p.y,r:p.r*1.4,ex:true,c:'bile'});}

  if(P.zenithT>0)lights.push({x:W/2,y:H/2,r:760,ex:false,c:'none'});
 }
 for(const e of enemies)if(!e.dead&&e.type==='hurleur'&&e.state==='sing')lights.push({x:e.x,y:e.y,r:70,ex:false,c:'cold'});

 if(room&&room.candles)for(const k of room.candles)lights.push({x:k.x,y:k.y,r:k.wall?60:88,ex:false,c:'warm'});

 if(room&&room.type==='sanctuaire')for(const b of BRAZIERS)lights.push({x:b[0],y:b[1],r:210+Math.sin(T*7+b[0])*6,ex:false,c:'warm'});
 if(room){if(room.type==='halte')lights.push({x:W/2,y:H/2,r:240+Math.sin(T*7)*6,ex:false,c:'warm'});if(room.type==='autel')lights.push({x:W/2,y:H/2-14,r:180,ex:false,c:'cold'});for(const d of room.doors)if(d.open>0)lights.push({x:d.x,y:AR.y0+6,r:120*d.open,ex:false,c:'none'});}

function computeExposure(){const night=P.nightT>0,zen=P.zenithT>0;for(const e of enemies){if(e.dead)continue;if(night){e.exposed=false;continue;}if(zen||v6Expose(e)){e.exposed=true;continue;}let ex=false;for(const l of lights){if(!l.ex)continue;const dx=e.x-l.x,dy=e.y-l.y;if(dx*dx+dy*dy<l.r*l.r){ex=true;break;}}e.exposed=ex;}}
function inExposeLight(x,y){for(const l of lights)if(l.ex&&(x-l.x)**2+(y-l.y)**2<l.r*l.r)return true;return false;}

function steerAround(e,dx,dy,d){

 if(!(e.avT>0)||!e.avSide){e.avSide=Math.abs(c)<2?(Math.random()<0.5?1:-1):(c>0?-1:1);}

function genShop(){const n=4+(P.s.clef?1:0);const pool=shuffle(RELICS.filter(r=>!P.relics.includes(r.id)&&(!r.cls||r.cls===P.cls)&&relicUnlocked(r)));return{relics:pool.slice(0,n).map(r=>({id:r.id,price:price(70+randi(0,4)*5)})),sold:{},refreshN:0,freeRefresh:!!P.s.clef,line:pick(MERCHANT_LINES),items:[]};}
function renderShop(){
 const sh=room.shop,g=gold();if(!sh){closeOverlay();return;}
 const items=[];
 for(const it of sh.relics){const r=RELICS.find(x=>x.id===it.id);items.push({key:'r:'+it.id,g:icon(r.id),name:r.name,desc:r.desc,price:it.price,kind:'Relique'});}
 items.push({key:'heal',g:icon('heal'),name:'Tisane amère',desc:`Récupère ${Math.round(35*healF())} % de tes PV.`,price:price(40),kind:'Soin'});
 items.push({key:'level',g:icon('level'),name:'Parchemin de savoir',desc:'Gagne immédiatement un niveau. Son prix monte à chaque achat.',price:price(60+25*RUN.levelsBought),kind:'Talent'});
 items.push({key:'temper',g:icon('temper'),name:'Pierre à aiguiser',desc:'+6 % de dégâts jusqu’à la fin de la run.',price:price(55),kind:'Renfort'});
 items.push({key:'dice',g:icon('dice'),name:'Dés pipés',desc:'+1 relance de talents.',price:price(30),kind:'Relance'});
 sh.items=items;
 const refreshCost=sh.freeRefresh?0:price(15+10*sh.refreshN);
 overlayEl.innerHTML=`<div class="panel">${npcHead(MERCHANT,sh.line)}<div class="row" style="justify-content:space-between;margin:0 0 14px"><p class="purse"><span>Ta bourse</span><b>${g}</b><span>or</span></p><span class="k">L’or ne remonte pas au Sanctuaire. Dépense-le.</span></div><div class="shop">${items.map(it=>{const sold=!!sh.sold[it.key];const can=!sold&&g>=it.price;return `<button type="button" class="card ${sold?'sold':''}" data-k="${it.key}" ${can?'':'disabled'}><span class="meta"><span class="br">${it.kind}</span><span>${sold?'Vendu':''}</span></span><span class="gl">${it.g}</span><h3>${esc(it.name)}</h3><p>${esc(it.desc)}</p><span class="price">${sold?'Vendu':it.price+' or'}</span></button>`;}).join('')}</div><div class="row"><button type="button" class="btn" id="refresh" ${g>=refreshCost?'':'disabled'}>Renouveler les reliques · ${refreshCost?refreshCost+' or':'gratuit'}</button><button type="button" class="btn primary" id="leave">Partir</button><span class="k">Échap pour partir. Reviens vers la charrette pour rouvrir l’étal.</span></div></div>`;
 overlayEl.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>buyItem(b.dataset.k)));
 $('#refresh').addEventListener('click',()=>{const cost=sh.freeRefresh?0:price(15+10*sh.refreshN);if(gold()<cost)return;RUN.goldF-=cost;if(sh.freeRefresh)sh.freeRefresh=false;else sh.refreshN++;const n=4+(P.s.clef?1:0);const pool=shuffle(RELICS.filter(r=>!P.relics.includes(r.id)&&(!r.cls||r.cls===P.cls)&&relicUnlocked(r)));for(const k in sh.sold)if(k.startsWith('r:'))delete sh.sold[k];sh.relics=pool.slice(0,n).map(r=>({id:r.id,price:price(70+randi(0,4)*5)}));sfx('pick');renderShop();});
 $('#leave').addEventListener('click',closeOverlay);overlayKeys=escKeys;
}
function buyItem(key){
 const sh=room.shop,it=sh.items.find(i=>i.key===key);if(!it||sh.sold[key]||gold()<it.price)return;
 RUN.goldF-=it.price;
 if(key.startsWith('r:')){applyRelic(RELICS.find(r=>r.id===key.slice(2)));sh.sold[key]=1;}
 else if(key==='heal'){heal(P.s.maxHp*0.35*healF(),'halte');sh.sold[key]=1;toast('Tisane amère bue');}
 else if(key==='level'){RUN.levelsBought++;gainXp(xpNeed(P.level)-P.xp);toast('Le savoir t’attend à la sortie de l’étal');}
 else if(key==='temper'){P.s.dmg+=0.06;sh.sold[key]=1;toast('+6 % de dégâts');}
 else if(key==='dice'){RUN.rerolls++;sh.sold[key]=1;toast('+1 relance de talents');}
 sfx('buy');renderShop();
}

 const c=e.code;musicKick();

 if(c==='KeyT'&&e.shiftKey&&RUN&&!RUN.hub&&!e.repeat){const ks=[null,...Object.keys(WTHEMES)];RUN.forceTheme=ks[(ks.indexOf(RUN.forceTheme||null)+1)%ks.length];toast(RUN.forceTheme?`Test : prochain thème forcé · ${WTHEMES[RUN.forceTheme].n}`:'Test : thèmes aléatoires rétablis',2.2);return;}
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();
 keys.add(c);if(e.repeat||P.dead||trans)return;
 const K=CLASSKEYS[P.cls];
 switch(c){case 'Space':{const ch0=P.dashCh;tryDash();if(P.dashT>0||P.dashCh<ch0||(P.cls==='gou'&&P.s.colosse))P.dashBuf=0;else P.dashBuf=0.18;}break;case 'KeyQ':K.q();break;case 'KeyE':K.e();break;case 'KeyR':K.r();break;case 'KeyF':ult();break;case 'Escape':case 'KeyP':openPause();break;case 'KeyM':muted=!muted;toast(muted?'Son coupé':'Son activé');break;}

const INK='rgba(4,5,9,.95)';
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);}
function shadowAt(c,x,y,rx,ry,a){c.fillStyle=`rgba(0,0,0,${a==null?0.42:a})`;ell(c,x,y,rx,ry);c.fill();}
function inkFill(c,fill,w){c.fillStyle=fill;c.fill();c.strokeStyle=INK;c.lineWidth=w||2;c.stroke();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function radial(c,x,y,r,a,b){const g=c.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r*1.05);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function lin3(c,x0,x1,a,b){const g=c.createLinearGradient(x0,0,x1,0);g.addColorStop(0,a);g.addColorStop(0.5,b);g.addColorStop(1,a);return g;}
function glow(c,x,y,r,col,a){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}

function floorCobbles(g,p){const rh=24;for(let y=AR.y0-4,row=0;y<AR.y1+rh;y+=rh,row++){let x=AR.x0-(row%2?14:0)-randi(0,10);while(x<AR.x1+20){const w=randi(22,38);g.fillStyle=`hsl(${p.h+rand(-6,6)},${p.s+rand(-3,3)}%,${p.l+rand(-3.5,3)}%)`;rr(g,x+1.5,y+1.5,w-3,rh-3,6);g.fill();g.fillStyle='rgba(255,255,255,.05)';rr(g,x+3,y+2.5,w-7,4,2);g.fill();g.fillStyle='rgba(0,0,0,.22)';rr(g,x+2,y+rh-6,w-4,3.5,1.5);g.fill();x+=w;}}}
function floorSlabs(g,p,rm){const sw=112,sh=72;for(let y=AR.y0,row=0;y<AR.y1;y+=sh,row++){for(let x=AR.x0-(row%2?sw/2:0);x<AR.x1;x+=sw){g.fillStyle=`hsl(${p.h+rand(-5,5)},${p.s}%,${p.l+rand(-2.5,2.5)}%)`;g.fillRect(x+2,y+2,sw-4,sh-4);g.fillStyle='rgba(255,255,255,.035)';g.fillRect(x+2,y+2,sw-4,3);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+2,y+sh-5,sw-4,3);g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=1;g.strokeRect(x+7.5,y+7.5,sw-15,sh-15);

 if(room.type==='halte'){c.save();c.globalCompositeOperation='lighter';for(let i=0;i<5;i++){const h=20+Math.sin(T*9+i*1.7)*6,w=8+i%3*2,x=W/2+(i-2)*6;const g=c.createLinearGradient(0,H/2-h,0,H/2+4);g.addColorStop(0,'rgba(255,120,40,0)');g.addColorStop(1,'rgba(255,190,90,.75)');c.fillStyle=g;c.beginPath();c.ellipse(x,H/2-h/2+2,w/2,h/2,0,0,TAU);c.fill();}c.restore();if(Math.random()<0.15)parts.push({x:W/2+rand(-10,10),y:H/2-10,vx:rand(-10,10),vy:rand(-60,-30),life:0.9,max:0.9,size:1.8,col:'#ffb35c',layer:'post',drag:0.5});}
 if(room.type==='autel'){const y=H/2-40+Math.sin(T*2)*5;c.save();c.globalCompositeOperation='lighter';glow(c,W/2,y,44,'160,190,255',0.6);c.strokeStyle=`rgba(${THEMES[room.theme].acc},${0.25+0.15*Math.sin(T*2)})`;c.lineWidth=2;c.beginPath();c.arc(W/2,H/2+10,86,0,TAU);c.stroke();c.fillStyle='rgba(220,232,255,.95)';c.beginPath();c.moveTo(W/2,y-14);c.lineTo(W/2+8,y);c.lineTo(W/2,y+14);c.lineTo(W/2-8,y);c.closePath();c.fill();c.restore();}
 if(room.windows&&room.windows.length){c.save();c.globalCompositeOperation='lighter';for(const x of room.windows){const g=c.createLinearGradient(0,AR.y0-70,0,AR.y0-14);g.addColorStop(0,'rgba(150,120,230,.32)');g.addColorStop(1,'rgba(150,120,230,.06)');c.fillStyle=g;archPath(c,x,AR.y0-14,22,54);c.fill();}c.restore();}

// ───────────────────────── Musique : pistes par lieu, fondu enchaîné
// Dépose les fichiers dans le dossier publié « music/ » puis renseigne leurs chemins ici.
const MUSIC={files:{titre:'music/titre.mp3',sanctuaire:'music/sanctuaire.mp3',acte1:'music/acte1.mp3',acte2:'music/acte2.mp3',acte3:'music/acte3.mp3',boss3:'music/boss3.mp3',boss1:'music/boss1.mp3',boss2:'music/boss2.mp3',colporteur:'music/colporteur.mp3',victoire:'music/victoire.mp3',fin:'music/fin.mp3'},tracks:[],cur:null,vol:0.55,blocked:false};
const ONE_SHOT=['victoire','fin'];
function newTrack(key){const el=new Audio(MUSIC.files[key]);el.loop=false;el.preload='auto';el.volume=0;const t={key,el,v:0,target:1};el.addEventListener('error',()=>{t.dead=true;});MUSIC.tracks.push(t);return t;}
try{const v=localStorage.getItem('la-brume-music');if(v!==null&&!isNaN(+v))MUSIC.vol=clamp(+v,0,1);}catch(e){}
function musicKey(){if(state==='title')return 'titre';if(state==='over')return RUN&&RUN.final&&RUN.final.win?'victoire':'fin';if(!RUN||!room)return null;if(RUN.hub)return 'sanctuaire';if(room.type==='boss')return 'boss'+RUN.act;if(room.type==='marchand')return 'colporteur';return 'acte'+RUN.act;}
function updateMusic(dt){
 let k=musicKey();if(k&&!MUSIC.files[k])k={acte3:'acte2',boss3:'boss2'}[k]||k;const want=k&&MUSIC.files[k]?k:null;
 if(want!==MUSIC.cur){MUSIC.cur=want;for(const t of MUSIC.tracks)t.target=0;if(want){let t=MUSIC.tracks.filter(x=>x.key===want&&!x.handoff).pop();if(!t)t=newTrack(want);t.target=1;if(t.el.paused){if(ONE_SHOT.includes(want)||t.el.ended)try{t.el.currentTime=0;}catch(e){}t.el.play().catch(()=>{MUSIC.blocked=true;});}}}
 // boucle douce : à 2,5 s de la fin, une nouvelle lecture démarre en fondu
 for(const t of MUSIC.tracks.slice()){if(t.handoff||t.target!==1||ONE_SHOT.includes(t.key))continue;const d=t.el.duration;if(d&&isFinite(d)&&t.el.currentTime>d-2.5){t.handoff=true;t.target=0;const n=newTrack(t.key);n.el.play().catch(()=>{MUSIC.blocked=true;});}}
 const master=muted?0:MUSIC.vol*((paused&&state==='play')?0.5:1);
 for(const t of MUSIC.tracks){const rate=dt/1.6;t.v+=clamp(t.target-t.v,-rate,rate);try{t.el.volume=clamp(t.v*master,0,1);}catch(e){}if(t.v<=0.001&&t.target===0&&!t.el.paused){t.el.pause();if(t.handoff)t.dead=true;}}
 MUSIC.tracks=MUSIC.tracks.filter(t=>!t.dead);
}
function musicKick(){if(!MUSIC.blocked)return;MUSIC.blocked=false;const t=MUSIC.tracks.find(x=>x.key===MUSIC.cur);if(t&&t.el.paused)t.el.play().catch(()=>{MUSIC.blocked=true;});}

const easeOut=k=>1-Math.pow(1-k,3);

function impactFx(x,y,crit,col){fx.push({k:'star',x,y,s:crit?22:12,t:crit?0.2:0.13,max:crit?0.2:0.13,col:col||'255,225,160',crit,rot:rand(0,TAU)});}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(120,340),l=rand(0.18,0.4);parts.push({shape:'streak',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,size:rand(1.2,2.2),col,layer:'post',drag:5});}}
function heroGhost(c,x,y,cls,sc){if(cls==='gou'){c.save();c.translate(x,y);c.scale(sc,sc);blobPath(c,16,T*1.4);c.fill();c.restore();return;}c.beginPath();c.moveTo(x-9,y-8);c.bezierCurveTo(x-11,y-18,x-5,y-25,x,y-27);c.bezierCurveTo(x+5,y-25,x+11,y-18,x+9,y-8);c.bezierCurveTo(x+13,y-3,x+15,y+6,x+14,y+15);c.lineTo(x-14,y+15);c.bezierCurveTo(x-15,y+6,x-13,y-3,x-9,y-8);c.closePath();c.fill();}
function spitFx(sx,sy,a,arc,L){
 for(let i=0;i<20;i++){const ang=a+rand(-arc/2,arc/2),v=rand(260,640);parts.push({shape:'glob',x:sx,y:sy,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,life:0.42,max:0.42,size:rand(3,6.5),col:i%4?'#9be07a':'#e1d75a',layer:'post',drag:3.2});}
 for(let i=0;i<5;i++){const ang=a+rand(-arc/2,arc/2)*0.8,d=rand(L*0.35,L*0.95);decals.push({x:clamp(sx+Math.cos(ang)*d,AR.x0+8,AR.x1-8),y:clamp(sy+Math.sin(ang)*d,AR.y0+8,AR.y1-8),r:rand(10,22),t:5,max:5,col:'72,118,40',seed:Math.random()*10});}
 fx.push({k:'wave',x:sx,y:sy,a,arc:Math.max(arc,0.3),r:L,t:0.32,max:0.32,col:'160,235,110'});}
function updateDecals(dt){for(const d of decals)d.t-=dt;decals=decals.filter(d=>d.t>0);if(decals.length>70)decals.splice(0,decals.length-70);}
function drawDecals(){if(!decals.length)return;const c=ctx;for(const d of decals){const k=Math.min(1,d.t/d.max*1.6);c.fillStyle=`rgba(${d.col},${0.55*k})`;c.beginPath();for(let i=0;i<=10;i++){const a=i/10*TAU,rr2=d.r*(0.7+0.3*Math.sin(a*3+d.seed));const px=d.x+Math.cos(a)*rr2,py=d.y+Math.sin(a)*rr2*0.7;if(i)c.lineTo(px,py);else c.moveTo(px,py);}c.closePath();c.fill();for(let i=0;i<3;i++){const a=d.seed+i*2.1;ell(c,d.x+Math.cos(a)*d.r*1.25,d.y+Math.sin(a)*d.r*0.85,d.r*0.16,d.r*0.12);c.fill();}}}

const CHAP_OK=[()=>true,()=>RUN.act>=2,()=>RUN.act>=2&&!!SAVE.flags.heraut,()=>RUN.act>=3,()=>SAVE.wins>=1];
const CHAP=[null,...HI_D.chapitres.map((o,i)=>Object.assign({},o,{ok:CHAP_OK[i]}))];

const FRAGS=HI_D.fragments.map(({id,ch,col,name,glyph,text})=>({id,ch,col,row:5-ch,name,glyph,text}));

function giveFrag(src,x,y,delay){
 const m=M(),R=RUN.mem;if(!R||RUN.hub)return null;
 const capN=2+(R.won?1:0);if(R.frags.length>=capN&&src!=='first')return null;

 m.frags.push(f.id);m.fragNew.push(f.id);R.frags.push(f.id);
 let truth=null;if(chapDone(f.ch)&&!m.truths.includes(f.ch)){m.truths.push(f.ch);m.truthNew.push(f.ch);truth=CHAP[f.ch];R.truths.push(f.ch);}
 persist();

 for(let i=0;i<10;i++){const a=rand(0,TAU),v=rand(30,90);parts.push({shape:'star',x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:1.2,max:1.2,size:2.6,col:'#f0dca8',layer:'post',drag:1});}
 addNum(px,py-40,'fragment de carte','echo');sfx('buy');
 toast(truth?`Carte du Glas · ${f.name}. Chapitre ${truth.n} complet : la Vérité « ${truth.truth} » est révélée chez l’Archiviste.`:`Fragment de la Carte du Glas · ${f.name} (${m.frags.length} / ${FRAGS.length})`,truth?5:3.2);};
 if(delay)later(delay,show);else show();
 return f;}

const RZ_D=window.BRUME_DATA.resonances;

  const idx=n=>+n.id.slice(1);
  for(const n of mine){

   const i=idx(n);
   if(i===1)slot=1;else if(i===2)slot=2;else if(i===3)slot=3;else if(i===7)slot=7;
   else if(n.k==='m')slot=4;                                  // 4e mineur

 }
 const ang=z=>rzZoneAng(z);
 for(const n of Object.values(RZN)){

  const [a,b]=n.zones,ia=RZ_ORDER.indexOf(a),ib=RZ_ORDER.indexOf(b);

// ───────────────────────── hitEnemy : multiplicateurs, compensation corps à corps, effets sur coup
const _hit10=hitEnemy;
hitEnemy=function(e,base,o){
 o=o||{};
 const s=P&&P.s;
 if(!s||e.dead||e.puppet>0)return _hit10(e,base,o);
 const f=s.v10,cls=P.cls;
 if(!f&&!(MEL>0&&isBoss(e)))return _hit10(e,base,o);
 const v=pv();let m=1;
 // compensation : les gardiens laissent peu de fenêtres au corps à corps
 if(MEL>0&&isBoss(e)){
  m*=cls==='lum'?1.2:1.3;
  if(RUN&&RUN.time-v.lastRef>0.25){v.lastRef=RUN.time;if(P.dashCh<s.dashCharges)P.dashRecT-=0.3;}
  if(RUN&&!RUN.mel10&&!o.dot){RUN.mel10=1;later(0.2,()=>toast('Corps à corps contre un gardien : +'+(cls==='lum'?20:30)+' % de dégâts et esquive rechargée plus vite',3.2));}
 }
 if(f){
  if(cls==='lum'){
   if(f.charge&&o.light&&o.dot&&P.beam)m*=1+[0.17,0.33,0.5][f.charge-1]*Math.min(1,v.beamOn/2);
   if(f.plein&&o.light&&P.lueur>=70)m*=1+0.08*f.plein;
   if(v.inNova&&e.embraseT>RUN.time)m*=1.4;
   if(MEL>0&&f.ray3B)m*=1.3;
   if(f.fan2B&&e.exposed&&P.lan.state==='ground'&&hyp(e.x-P.lan.x,e.y-P.lan.y)<s.groundLight*1.5)m*=1.25;
   if(v.fcrit&&!o.dot&&o.crit!==false&&!o.forceCrit)o=Object.assign({},o,{forceCrit:true});
  }else if(cls==='gou'){
   if(f.acidite&&inPool10(e))m*=1+0.12*f.acidite;
   if(v.inSpit){if(f.vor1B&&e.held>RUN.time)m*=1.4;if(f.dif2B&&RUN.time<v.crushT)m*=1.3;}
   if(MEL>0&&f.dif3A&&P.carapT>0)m*=1.3;
  }else if(cls==='tis'){
   if(f.tension&&e.tethered){const th=P.threads.find(t=>t.e===e);m*=1+Math.min(0.3,0.03*f.tension*((th&&th.age)||0));}
   if(e.chainVuln>RUN.time)m*=1.2;
   if(f.pnt3B&&e.tangled)m*=1.25;
  }
 }
 CRIT10=false;
 const d=_hit10(e,base*m,o);
 if(!f)return d;
 const crit=CRIT10;
 if(cls==='lum'){
  if(o.light&&o.dot&&P.beam){e.beamAt=RUN.time;if(f.ray1B)e.lastBeamT=RUN.time;
   if(f.ray1A){if(e._bt===RUN.time)e._bn++;else{e._bt=RUN.time;e._bn=1;}if(e._bn>=2)e.embraseT=RUN.time+4;}}
  if(MEL>0&&e.exposed&&!o.dot){if(f.vive&&!e.dead){e.burnT=Math.max(e.burnT||0,2);e.burnDps=Math.max(e.burnDps||0,8*f.vive);}if(f.aplomb)gainLueur(1.5*f.aplomb,true);}
  if(crit){if(f.souffle)P.dashInvisT=Math.max(P.dashInvisT,[0.5,0.9,1.3][f.souffle-1]);
   if(f.pen1A&&MEL>0&&RUN.time-v.lastCd>0.12){v.lastCd=RUN.time;P.eCd-=0.8;}}
 }else if(cls==='gou'){
  if(v.biteBurn&&!o.dot&&!e.dead){e.burnT=3;e.burnDps=Math.max(e.burnDps||0,12);}
  if(v.inSpit&&o.cor&&!o.dot&&v.spitHits)v.spitHits.push([e,d]);
  if(v.inDev&&o.dot&&f.vor3B&&d>0){P.shield=Math.min(s.maxHp*0.4,P.shield+d*0.3);P.shieldT=3;}
 }
 return d;
};

  const ri=wi/2,ro=ri+t,ks=5,half=ro+9,top=hi-ri+ro+ks+3,bot=4;

  const cy=-(hi-ri);

  // jambages en harpe
  const jh=-cy,nj=Math.max(3,Math.round((jh-7)/13)),bh=(jh-7)/nj;
  for(const s of[-1,1]){
   for(let j=0;j<nj;j++){const y1=-7-j*bh,y0=y1-bh+0.8,out=ro+(j%2?3.5:0)+(R()-0.5);const x0=s<0?-out:ri,x1=s<0?-ri:out;const p=new Path2D();p.rect(x0+0.4,y0,x1-x0-0.8,y1-y0);stone(g,p,[x0,y0,x1,y1],base,R,o);}
   const x0=s<0?-ro-6:ri-2,x1=s<0?-ri+2:ro+6;const p=new Path2D();p.rect(x0,-7,x1-x0,9);stone(g,p,[x0,-7,x1,2],[base[0],base[1],base[2]-4],R,o);}

   const p=new Path2D();p.arc(0,cy,oo,a0,a1);p.arc(0,cy,ri,a1,a0,true);p.closePath();
   const am=(a0+a1)/2,mx=Math.cos(am)*(ri+oo)/2,my=cy+Math.sin(am)*(ri+oo)/2;

   geo.push({x:mx,y:my,a:am,key});
   if(runes&&!key)rune(g,mx,my,am,R);}
  // intrados : arête ombrée côté ouverture
  g.beginPath();g.moveTo(-ri,0);g.lineTo(-ri,cy);g.arc(0,cy,ri,Math.PI,0);g.lineTo(ri,0);g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=2.4;g.stroke();

 // ── Sigil : médaillon de bronze/pierre, émail sombre, icône en relief

  c.save();
  c.fillStyle='rgba(0,0,0,.55)';c.beginPath();c.ellipse(x+1,y+r*0.9,r*0.95,r*0.35,0,0,TAU);c.fill();

  c.beginPath();c.arc(x,y,r+3.2,0,TAU);c.fillStyle=rg;c.fill();c.strokeStyle=INK;c.lineWidth=1.4;c.stroke();
  for(let i=0;i<8;i++){const a=i/8*TAU+Math.PI/8,px=x+Math.cos(a)*(r+1.6),py=y+Math.sin(a)*(r+1.6);c.fillStyle='rgba(0,0,0,.6)';c.beginPath();c.arc(px+0.4,py+0.5,0.95,0,TAU);c.fill();c.fillStyle='rgba(235,225,250,.55)';c.beginPath();c.arc(px-0.2,py-0.2,0.6,0,TAU);c.fill();}
  // émail
  const eg=c.createRadialGradient(x,y-r*0.25,1,x,y,r);eg.addColorStop(0,`rgba(${col},${0.10+0.22*k})`);eg.addColorStop(0.7,'rgba(10,10,16,.96)');eg.addColorStop(1,'rgba(3,3,6,1)');
  c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=eg;c.fill();c.strokeStyle='rgba(0,0,0,.9)';c.lineWidth=1.2;c.stroke();
  c.save();c.beginPath();c.arc(x,y,r,0,TAU);c.clip();c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=0.6;for(let i=-r;i<r;i+=2.4){c.beginPath();c.moveTo(x-r,y+i);c.lineTo(x+r,y+i+r*0.6);c.stroke();}c.restore();
  // halo
  if(k>0){c.save();c.globalCompositeOperation='lighter';glow(c,x,y,r*1.1,col,(0.18+0.08*Math.sin(T*3))*k);c.restore();}
  // icône : ombre gravée, remplissage translucide, trait, reflet

  c.restore();}

   const k=rm.cm,c=CMS[k],sc=score(dmg,t,b),v=sc>=EF.seuilEfficace/100?'ok':sc<=EF.seuilDejouee/100?'ko':'nul';
   S.eff=S.eff||{};const e=S.eff[k]||{n:0,s:0};e.s=e.n?e.s*(1-EF.memoire)+sc*EF.memoire:sc;e.n++;S.eff[k]=e;
   R.cmv=R.cmv||{};R.cmv[k]=v;R.cmLog=R.cmLog||[];R.cmLog.push({k,v,sc:Math.round(sc*100),dmg:Math.round(dmg*100),t:Math.round(t)});

    else{chron('cmko',{k});later(0.6,()=>murmur(`Le Brumeux · ${c.n}`,'Tu l’as déjouée. Il cherchera autre chose.',3.4));}}
   persist();}catch(err){console.error(err);}};

 // ── Aperçu de gameplay : le vrai moteur du jeu, rejoué par un bot dans un cadre isolé (?demo=classe)
 const PV=(()=>{
  function mount(host,cls){
   const steps=FO_D.apercus&&FO_D.apercus[cls];if(!steps)return;
   const col=CLS[cls].color,F=FO_D.fiches[cls];
   host.innerHTML=`<div class="pv" style="--c:${col}"><div class="pvhead"><p class="h-sec">Aperçu · ${esc(CLS[cls].short)}</p><span class="pvdiff">${esc(F.mech)} · ${esc(F.difficulte)}</span></div><div class="pvstage"><iframe title="Aperçu du gameplay : ${esc(CLS[cls].short)}" src="${location.pathname}?demo=${cls}" tabindex="-1" scrolling="no" loading="eager"></iframe></div><ol class="pvsteps">${steps.map((s,i)=>`<li><button type="button" data-ph="${i}"><i>${i+1}</i><span>${esc(keyTok(s[0]))}</span></button></li>`).join('')}</ol><p class="pvdesc" aria-live="off"></p></div>`;
   const fr=host.querySelector('iframe'),desc=host.querySelector('.pvdesc'),btns=[...host.querySelectorAll('.pvsteps button')];
   let lock=-1,cur=-1;
   const show=i=>{if(i===cur)return;cur=i;btns.forEach((b,j)=>b.classList.toggle('on',j===i));desc.textContent=keyTok(steps[i][1]);};
   show(0);
   const onMsg=e=>{if(!fr.isConnected){removeEventListener('message',onMsg);return;}if(e.source!==fr.contentWindow||!e.data||e.data.pvPh==null)return;show(e.data.pvPh);};
   addEventListener('message',onMsg);
   btns.forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.ph;lock=lock===i?-1:i;btns.forEach((x,j)=>x.classList.toggle('lock',j===lock));try{fr.contentWindow.postMessage({pvLock:lock},'*');}catch(err){}if(lock>=0)show(lock);}));
  }
  return{mount};
 })();

(function(){const T=T_D.noeuds;

// ── Mode démonstration (?demo=classe) : le vrai moteur, rejoué par un bot, dans un cadre isolé (aucune sauvegarde, aucun son)
function demoBoot(cls){
 document.documentElement.classList.add('demo');
 const st=document.createElement('style');st.textContent='.demo #hud,.demo #toast,.demo #banner,.demo #overlay,.demo #assist,.demo .hint,.demo [id^=mur]{display:none!important}.demo,.demo body{background:#05060a;overflow:hidden}.demo #game{transform:scale(1.5);transform-origin:40% 58%}';document.head.appendChild(st);
 initAudio=function(){};musicKick=function(){};updateMusic=function(){};muted=true;
 resize();chosenCls=cls;startRun();arrowShow=function(){};
 const PHD=4.4;let ph=-1,t0=0,lock=-1,cyc=0,lastMsg=-1,tick=0,pressAt={};
 const press=code=>{dispatchEvent(new KeyboardEvent('keydown',{code,bubbles:true}));dispatchEvent(new KeyboardEvent('keyup',{code,bubbles:true}));};
 const clickL=()=>{mouse.l=true;if(P){P.clickQ=1;P.clickT=0.16;}};
 const clickR=()=>{mouse.r=true;if(P){P.rclickQ=1;P.rclickT=0.16;}};
 const once=(k,tt,at,fn)=>{if(tt>=at&&!pressAt[k]){pressAt[k]=1;fn();}};
 // remet la scène à zéro : nouvelle salle, nouveaux ennemis qui réapparaissent, état de la classe réinitialisé
 const POS={lum:[[200,-60],[270,40],[330,-30],[210,100]],gou:[[120,-40],[150,45],[205,0],[250,-70]],gou3:[[[115,-38],[145,8],[175,-16],[125,48],[180,42],[150,-60]],[[58,-8],[78,38],[74,-42]],[[130,-34],[180,18],[235,-8],[150,62],[260,42]]],her:[[105,-45],[130,50],[95,5],[160,-75]],tis:[[220,-70],[270,60],[340,-5]]};
 function reset(){
  mouse.l=mouse.r=false;pressAt={};
  enemies=[];eproj=[];pproj=[];spectrals=[];parts=[];fx=[];nums=[];tlights=[];deferred=[];timers=[];rings=[];pools=[];coins=[];decals=[];queue.length=0;
  room=makeRoom('combat');room.waves=[];room.spawning=[];room.sinceWave=0;room.rule=null;room.bl=null;room.cleared=false;
  P.x=W*0.4;P.y=H*0.58;P.vx=P.vy=0;P.dashT=0;P.delayed=[];P.roomMut=0;P.feast=0;P.hp=P.s.maxHp;if(cls==='gou')P.cor=[0,45,70][ph]||0;
  resetLantern();v6Reset();
  for(const [dx,dy] of (cls==='gou'?POS.gou3[ph]:POS[cls])){const e=createEnemy('rampant',P.x+dx,P.y+dy);e.dmg=0;e.spd=0;e.maxHp=e.hp=3000;e.state='walk';e.t=e.cd=999;e.ang=Math.PI;}
 }
 addEventListener('message',e=>{if(e.data&&e.data.pvLock!==undefined){lock=e.data.pvLock;if(lock>=0)ph=lock;t0=performance.now()/1000;lastMsg=-1;reset();}});
 function bot(){
  if(!P||state!=='play')return;
  if(!overlayEl.hidden)closeOverlay();queue.length=0;P.pendingLv=0;MSGQ.length=0;hintPaused=false;msgCur=null;paused=false;freezeT=0;
  P.hp=P.s.maxHp;P.dead=false;P.hurtFlash=0;
  const live=enemies.filter(e=>!e.dead&&!e.fixed);
  for(const e of live){e.dmg=0;e.maxHp=3000;e.hp=3000;e.spd=0;e.state='walk';e.t=e.cd=999;}
  if(RUN){RUN.fogBoost=-0.42;if(RUN.as)RUN.as.busy=true;}if(room){room.doors=[];room.rule=null;room.bl=null;room.waves=[];room.spawning=[];}
  const now=performance.now()/1000;
  if(ph<0){ph=0;t0=now;trans=null;fade=0;reset();}
  let tt=now-t0;
  if(tt>=PHD){if(lock<0)ph=(ph+1)%3;t0=now;tt=0;reset();return;}
  if(ph!==lastMsg){lastMsg=ph;try{parent.postMessage({pvPh:ph},'*');}catch(e){}}
  if(!live.length&&!trans)reset();
  let tg=null,bd=1e9;for(const e of live){const d=hyp(e.x-P.x,e.y-P.y);if(d<bd){bd=d;tg=e;}}
  const far=live.length?live.slice().sort((a,b)=>hyp(b.x-P.x,b.y-P.y)-hyp(a.x-P.x,a.y-P.y))[0]:null;
  if(tg){mouse.x=tg.x;mouse.y=tg.y;}else{mouse.x=P.x+200;mouse.y=P.y-60;}
  // déplacement : reste vers le centre-bas, avec un va-et-vient
  const ax=W*0.4+(cls==='lum'&&ph===0?130*Math.sin(now*0.9):0),ay=H*0.58;
  for(const k of ['KeyW','KeyA','KeyS','KeyD'])keys.delete(k);
  if(cls==='lum'&&ph===0){if(P.x<ax-14)keys.add('KeyD');else if(P.x>ax+14)keys.add('KeyA');}else{if(P.x<ax-30)keys.add('KeyD');else if(P.x>ax+30)keys.add('KeyA');if(P.y<ay-30)keys.add('KeyS');else if(P.y>ay+30)keys.add('KeyW');}
  const beat=P.beatPh!=null&&(P.beatPh<0.05||P.beatPh>0.95);
  if(cls==='lum'){
   if(ph===1)mouse.r=true;
   if(ph===2){once('r1',tt,0.3,()=>press('KeyR'));if(tt>0.9)mouse.l=true;once('r2',tt,3.4,()=>{mouse.l=false;press('KeyR');});}
  }else if(cls==='gou'){
   if(ph===0)mouse.r=true;
   if(ph===1){P.cor=Math.max(P.cor,45);mouse.l=true;}
   if(ph===2){if(tt<0.9)P.cor=Math.max(P.cor,70);once('r',tt,0.9,()=>press('KeyR'));}
  }else if(cls==='her'){
   if(ph>=1&&beat&&!pressAt['b'+Math.floor(P.beatN||0)]){pressAt['b'+Math.floor(P.beatN||0)]=1;clickL();setTimeout(()=>{mouse.l=false;},90);}
  }else if(cls==='tis'){
   if(ph===0)mouse.l=true;
   if(ph===1){const k=Math.floor(tt/0.8);once('f'+k,tt,k*0.8,()=>{clickR();setTimeout(()=>{mouse.r=false;},90);});}
   if(ph===2){const k=Math.floor(tt/0.8);if(tt<1.8)once('f'+k,tt,k*0.8,()=>{clickR();setTimeout(()=>{mouse.r=false;},90);});once('r',tt,2.3,()=>press('KeyR'));}
  }
 }
 setInterval(bot,33);
 requestAnimationFrame(frame);
}
const DEMO_CLS=(/[?&]demo=([a-z]+)/.exec(location.search)||[])[1];
if(DEMO_CLS&&CLS[DEMO_CLS])demoBoot(DEMO_CLS);
