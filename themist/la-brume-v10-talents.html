<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>La Brume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout : arène plein écran sur canvas, HUD épinglé aux coins, menus en panneaux sombres centrés. Un seul thème, nocturne, par choix. */
:root{
  --night:#07080d; --deep:#0f121b; --panel:rgba(14,17,26,.95); --card:#121521; --line:#2a2f43; --line-hi:#454b66;
  --bone:#ece4ce; --ash:#9c99a9; --mute:#6c6a7a;
  --flame:#f3b94d; --umbra:#a387ec; --ember:#ea7a43; --blood:#dc4a55; --bile:#8fd46e;
  --f-display:"Grenze Gotisch","UnifrakturMaguntia",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.hud-tl{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:3px}
.act{font-family:var(--f-display);font-size:23px;line-height:1.1;margin:0;color:var(--bone);text-shadow:0 2px 10px #000}
.roomline{margin:0;color:var(--ash);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.path{display:flex;gap:4px;margin-top:4px}
.path span{min-width:22px;height:22px;padding:0 4px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--ash);background:rgba(8,10,16,.75);border-radius:3px}
.path span.cur{border-color:var(--flame);color:var(--flame)}
.hud-tr{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;width:min(230px,30vw);pointer-events:auto}
.relic{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line-hi);background:rgba(14,17,26,.88);border-radius:4px;color:var(--flame);font-size:16px;cursor:help}
.pausebtn{font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;height:32px;padding:0 12px;border:1px solid var(--line-hi);background:rgba(14,17,26,.88);color:var(--ash);border-radius:4px;cursor:pointer}
.pausebtn:hover{color:var(--bone);border-color:var(--flame)}
.hud-boss{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,46vw);text-align:center}
.hud-boss p{font-family:var(--f-display);font-size:26px;margin:0 0 4px;color:#ffd8cf;text-shadow:0 2px 12px #000}
.bossbar{position:relative;height:11px;border:1px solid #6b2a33;background:rgba(0,0,0,.65);border-radius:2px;overflow:hidden}
.bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7e1a29,#e0434f)}
.bossbar::before,.bossbar::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);z-index:1}
.bossbar::before{left:33.3%}.bossbar::after{left:66.6%}
.hud-bl{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;width:min(320px,34vw)}
.stat{display:grid;grid-template-columns:84px minmax(0,1fr) 64px;align-items:center;gap:8px}
.stat .lab{color:var(--ash);text-transform:uppercase;letter-spacing:.1em;font-size:11px;white-space:nowrap}
.stat .val{color:var(--bone);font-size:12px;text-align:right;white-space:nowrap}
.bar{position:relative;height:11px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
.bar.hp i{background:linear-gradient(90deg,#97283a,#e04f5b)}
.bar.lu i{background:linear-gradient(90deg,#b0761c,#f6c766)}
.bar.cor::before,.bar.cor::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45);z-index:1}
.bar.cor::before{left:var(--t1,33.3%)}.bar.cor::after{left:var(--t2,66.6%)}
.bar.cor.t0 i{background:linear-gradient(90deg,#3d7a33,#8fdc6c)}
.bar.cor.t1 i{background:linear-gradient(90deg,#7d8a2a,#e1d75a)}
.bar.cor.t2 i{background:linear-gradient(90deg,#8a2f22,#ff7a4d)}
.bar.xp,.bar.el{height:6px}
.bar.xp i{background:linear-gradient(90deg,#6c5bb3,#b6a3f2)}
.bar.el i{background:linear-gradient(90deg,#b4462b,#ffb15c)}
.bar.res i{background:linear-gradient(90deg,#34558c,#a6d4ff)}
.bar.bob i{background:linear-gradient(90deg,#7a1c34,#ff6b8a)}
.hud-skills{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px}
.slot{position:relative;width:68px;height:60px;border:1px solid var(--line-hi);background:rgba(11,13,20,.9);border-radius:4px;overflow:hidden;display:grid;align-content:space-between;padding:5px 7px}
.slot b{font-size:11px;color:var(--flame);font-weight:700;letter-spacing:.05em;position:relative;z-index:1}
.slot span{font-size:11.5px;color:var(--bone);line-height:1.1;position:relative;z-index:1}
.slot .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.66)}
.slot .badge{position:absolute;right:6px;top:4px;font-size:11px;color:var(--bone);font-style:normal;z-index:1}
.slot.locked{opacity:.28}
.slot.dim span{color:var(--mute)}
.hud-state{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:7px 12px;border:1px solid var(--line-hi);background:rgba(11,13,20,.9);border-radius:999px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--flame)}
.hud-state.obscur{color:var(--umbra);border-color:#4a3d74}
.hud-state.inv{color:#c9d2ff;border-color:#3d4a7a}
.hud-state.sur{color:#fff1c2;border-color:var(--flame);background:rgba(80,55,10,.85)}
.hud-state.blind{color:var(--mute)}
.hud-state.g0{color:var(--bile);border-color:#3b5a33}
.hud-state.g1{color:#e3d860;border-color:#6a6328}
.hud-state.h0{color:#9fb7d8;border-color:#34445e}
.hud-state.h1{color:#c4e2ff;border-color:#4a6a96}
.hud-state.h2{color:#fff6dc;border-color:#e0b468;background:rgba(40,32,14,.88)}
.hud-state.t0{color:#ff9ec0;border-color:#6a2a44}
.hud-state.g2{color:#ff8462;border-color:#7a3226;background:rgba(60,14,10,.88)}
.hint{position:absolute;left:50%;top:calc(126px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(780px,calc(100% - 32px));text-align:center;font-size:13.5px;color:#d9d1bd;background:rgba(8,10,16,.82);border:1px solid var(--line);border-radius:4px;padding:8px 14px}
.hint kbd{font:700 11px var(--f-body);color:var(--flame);border:1px solid var(--line-hi);border-radius:3px;padding:1px 5px;margin:0 2px}
#toast{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);max-width:min(640px,calc(100% - 32px));padding:8px 16px;background:rgba(10,12,19,.92);border:1px solid var(--line-hi);border-radius:4px;font-size:14px;color:var(--bone);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;width:calc(100% - 32px)}
#banner.show{opacity:1}
#banner p{margin:0;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
#banner h2{font-family:var(--f-display);font-weight:500;font-size:clamp(44px,7vw,92px);line-height:1;margin:6px 0 0;color:#f4e3c0;text-shadow:0 0 40px rgba(243,185,77,.35),0 4px 18px #000}
#banner.boss h2{color:#ffd2c8;text-shadow:0 0 44px rgba(255,64,87,.45),0 4px 18px #000}

/* Overlays */
#overlay{position:absolute;inset:0;overflow-y:auto;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(120% 90% at 50% 35%,rgba(10,12,20,.72),rgba(3,4,8,.95));backdrop-filter:blur(2px)}
#overlay.see{background:linear-gradient(90deg,rgba(4,5,9,.93) 0%,rgba(4,5,9,.78) 46%,rgba(4,5,9,.45) 100%);backdrop-filter:none}
.panel{width:min(1140px,100%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px clamp(16px,3vw,40px);box-shadow:0 30px 90px rgba(0,0,0,.65)}
.eyebrow{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;color:var(--bone)}
h2{font-size:clamp(32px,4.2vw,46px);line-height:1.02;margin-top:4px}
.sub{color:#cfc7b3;margin:8px 0 18px;max-width:58ch}
.h-sec{margin:22px 0 10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
.btn{font:inherit;font-weight:700;letter-spacing:.05em;padding:11px 18px;border-radius:4px;border:1px solid var(--line-hi);background:#1a1e2c;color:var(--bone);cursor:pointer}
.btn:hover{border-color:var(--flame)}
.btn.primary{background:var(--flame);color:#1d1405;border-color:var(--flame)}
.btn.primary:hover{background:#ffc965}
.btn.big{font-size:17px;padding:14px 26px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,.tn:focus-visible,.pausebtn:focus-visible,.cls:focus-visible{outline:2px solid var(--flame);outline-offset:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.k{font-size:12px;color:var(--mute)}
.muted{color:var(--mute)}

/* Écran titre */
.title-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;width:min(1180px,100%)}
@media (max-width:900px){.title-wrap{grid-template-columns:1fr}}
.title-main h1{font-size:clamp(76px,12vw,150px);line-height:.86;color:#f6e7c4;text-shadow:0 0 60px rgba(243,185,77,.32),0 6px 24px #000;margin:10px 0 18px}
.lede{font-size:18px;color:#d8d0bb;max-width:44ch;margin:0 0 26px}
.coarse-note{display:none;margin:14px 0 0;color:var(--ember)}
@media (pointer:coarse){.coarse-note{display:block}}
.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.classes{grid-template-columns:1fr}}
.cls{appearance:none;font:inherit;color:inherit;text-align:left;border:1px solid var(--line);background:rgba(14,17,26,.88);border-radius:4px;padding:12px 14px;display:grid;gap:4px;align-content:start}
button.cls{cursor:pointer}
button.cls:hover{border-color:var(--line-hi)}
.cls.sel{border-color:var(--c,var(--flame));box-shadow:inset 0 0 0 1px var(--c,var(--flame))}
.cls.off{opacity:.5}
.cls .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cls h3{font-size:24px;line-height:1}
.cls .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);border:1px solid var(--line-hi);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cls.sel .tag{color:var(--c,var(--flame));border-color:var(--c,var(--flame))}
.cls p{margin:0;font-size:13.5px;color:#cbc3af}
.cls .mech{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:14px}
.keys dt{text-align:right;white-space:nowrap}
.keys dd{margin:0;color:#cfc7b3}
kbd{font:700 12px var(--f-body);color:var(--flame);border:1px solid var(--line-hi);border-bottom-width:2px;border-radius:3px;padding:2px 7px;background:#11141e}
.tip{margin:14px 0 0;font-size:13.5px;color:var(--ash);max-width:56ch}

/* Montée de niveau, arbre */
.lv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
@media (max-width:880px){.lv{grid-template-columns:1fr}}
.tree-wrap{position:relative;border:1px solid var(--line);border-radius:4px;background:radial-gradient(circle at 50% 50%,#131726 0%,#0b0d14 70%)}
.tree{width:100%;height:auto;display:block;max-height:min(68vh,620px);margin:0 auto}
.tree .ring{fill:none;stroke:#191d2b;stroke-width:1}
.tree .edge{stroke:#232839;stroke-width:2}
.tree .edge.av{stroke:#3b4159;stroke-dasharray:3 5}
.tree .edge.on{stroke:var(--c);stroke-width:3.2;opacity:.9}
.tree .edge.sealed{opacity:.2}
.tn{cursor:pointer;outline:none}
.tn .sh{fill:#10131c;stroke:#2e3347;stroke-width:1.6}
.tn .in{fill:#262b3d}
.tn.av .sh{stroke:var(--c);fill:#161a27}
.tn.av .in{fill:var(--c);opacity:.45}
.tn.own .sh{fill:var(--c);stroke:var(--c)}
.tn.own .in{fill:#0c0e15;opacity:1}
.tn.sealed{opacity:.26}
.tn.excl .sh{stroke:#6e3a44;stroke-dasharray:3 3}
.tn .halo{fill:none;stroke:#fff;stroke-width:2;opacity:0}
.tn.offer .halo{opacity:.9;stroke:var(--c);animation:pulse 1.15s ease-in-out infinite}
.tn.hl .halo{opacity:1;stroke:#fff;stroke-width:3;animation:none}
.tn:hover .sh,.tn:focus .sh{stroke:#fff}
.tree .rk{font:700 13px var(--f-body);fill:#cfc7b3}
.tree .bl{font-family:var(--f-display);font-size:30px;fill:var(--c)}
.tree .bls{font:500 13px var(--f-body);letter-spacing:.14em;text-transform:uppercase;fill:var(--mute)}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.tree-cap{min-height:4.4em;margin:10px 2px 0;font-size:14px;color:#cfc7b3}
.tree-cap strong{font-family:var(--f-display);font-weight:500;font-size:19px}
.tree-cap em{color:var(--ash)}
.tree-cap .up{color:var(--ash)}
.cards{display:grid;gap:10px}
.card{appearance:none;font:inherit;color:inherit;text-align:left;display:grid;gap:6px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.card:hover,.card.hl{border-color:var(--c,var(--flame));background:#181c2a;transform:translateY(-1px)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.card .meta .br{color:var(--c,var(--flame))}
.card h3{font-size:27px;line-height:1.02}
.card p{margin:0;color:#d2cab6;font-size:14.5px}
.card.key{border-color:#7a6232;background:linear-gradient(180deg,rgba(243,185,77,.1),rgba(243,185,77,0) 65%),var(--card)}
.card.key h3{color:#ffdf9a}
.card .gl{font-size:22px;color:var(--flame);line-height:1}
.arming .card{opacity:.6;pointer-events:none}
.asc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.asc-grid{grid-template-columns:1fr}}
.card.asc h3{font-size:40px}
.card.asc ul{margin:6px 0 0;padding:0 0 0 18px;color:#cfc7b3;font-size:14px;display:grid;gap:3px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.three{grid-template-columns:1fr}}
.narrow{width:min(980px,100%)}

/* Pause, fin */
.stats{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.stats dt{color:var(--ash)}
.stats dd{margin:0;text-align:right;color:var(--bone)}
.rl{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px;color:#cfc7b3}
.rl .g{color:var(--flame);font-size:18px;text-align:center}
.rl strong{color:var(--bone)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:20px}
.tile{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--card)}
.tile span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.tile b{display:block;font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--c,var(--line-hi));color:var(--bone);border-radius:999px;padding:3px 10px;background:#11141e}
/* Monnaies, Sanctuaire, Colporteur */
.cur{margin:3px 0 0;font-size:13px;color:var(--ash);display:flex;gap:14px;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px #000}
.cur b{color:var(--flame);font-weight:700}
.cur .sh b{color:#b9c7ff}
#hud.hub .run-only{display:none!important}
#hud.hub .hint{top:auto;bottom:96px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.npc-head{display:grid;gap:4px;margin-bottom:18px}
.quote{margin:8px 0 0;font-style:italic;color:#d8cfb8;max-width:64ch;border-left:2px solid var(--line-hi);padding-left:12px}
.purse{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--ash);margin:0}
.purse b{font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1;color:var(--flame)}
.purse.sh b{color:#b9c7ff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card .price{justify-self:start;font-weight:700;font-size:13px;letter-spacing:.04em;color:#1d1405;background:var(--flame);border-radius:999px;padding:2px 10px}
.card[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.card.sold{opacity:.28}
.meta{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:4px}
.mrow h3{font-size:22px;line-height:1.05}
.mrow p{margin:3px 0 0;font-size:13.5px;color:#cfc7b3}
.pips{display:flex;gap:4px;margin-top:7px}
.pips i{width:16px;height:5px;border-radius:1px;background:#2a2f43}
.pips i.on{background:#b9c7ff}
.mrow .btn{white-space:nowrap}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.lore{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lore li{padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:4px}
.lore h3{font-size:21px}
.lore p{margin:4px 0 0;font-size:14px;color:#cfc7b3;max-width:70ch}
.lore li.locked h3,.lore li.locked p{color:var(--mute)}
.new{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#111526;background:#b9c7ff;border-radius:999px;padding:2px 8px;margin-left:10px;vertical-align:middle}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.pal{display:grid;gap:6px}
.palbtn{appearance:none;font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:4px;cursor:pointer}

<script>
(()=>{
'use strict';
// ───────────────────────── Constantes & utilitaires
const W=1280,H=720,TAU=Math.PI*2;
const AR={x0:56,y0:92,x1:W-56,y1:H-44};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hyp=Math.hypot;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;return Math.abs(d);}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);return hyp(px-ax-t*dx,py-ay-t*dy);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const pct=n=>Math.round(n*100)+' %';

const cv=$('#game'),ctx=cv.getContext('2d');
const FS=0.5,fogCv=document.createElement('canvas');fogCv.width=W*FS;fogCv.height=H*FS;const fctx=fogCv.getContext('2d');
const overlayEl=$('#overlay'),hudEl=$('#hud'),toastEl=$('#toast');
let scale=1,offX=0,offY=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth||innerWidth,h=cv.clientHeight||innerHeight;cv.width=Math.max(1,Math.round(w*dpr));cv.height=Math.max(1,Math.round(h*dpr));scale=Math.min(cv.width/W,cv.height/H);offX=(cv.width-W*scale)/2;offY=(cv.height-H*scale)/2;}
addEventListener('resize',resize);

// Libellés de touches selon la disposition (AZERTY par défaut)
const KL={KeyW:'Z',KeyA:'Q',KeyS:'S',KeyD:'D',KeyQ:'A',KeyE:'E',KeyR:'R',KeyF:'F'};
try{if(navigator.keyboard&&navigator.keyboard.getLayoutMap){navigator.keyboard.getLayoutMap().then(m=>{for(const k in KL){const v=m.get(k);if(v&&v.length===1)KL[k]=v.toUpperCase();}if(P)buildSlots();if(state==='title'&&!overlayEl.hidden)openTitle();setHint();}).catch(()=>{});}}catch(e){}
const MOVE=()=>KL.KeyW+KL.KeyA+KL.KeyS+KL.KeyD;

let AC=null,muted=false,lastHitSfx=0,noiseBuf=null;
function initAudio(){musicKick();if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();const g=AC.createGain();g.gain.value=0.45;g.connect(AC.destination);AC.master=g;}catch(e){AC=null;}}
function getNoise(){if(!noiseBuf){noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return noiseBuf;}

function sfx(k){if(!AC||muted)return;switch(k){

 case 'howl':tone(300,0.6,'sine',0.07,520);tone(310,0.6,'sine',0.05,540);break;

 case 'boss':tone(55,1.3,'sawtooth',0.1,45);tone(82,1.3,'sine',0.12,70);break;

function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const o=JSON.parse(raw);const d=defaultSave();return Object.assign(d,o,{meta:Object.assign({},o.meta),flags:Object.assign({},o.flags),relics:Array.isArray(o.relics)?o.relics:[],loreSeen:Array.isArray(o.loreSeen)?o.loreSeen:[]});}}catch(e){}return defaultSave();}

function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}

function dmgMul(){return (1+0.03*(G()-1))*(PAL()>=3?1.2:1);}
function spdMul(){return 1+0.012*(G()-1);}
function budget(){return (4.5+1.5*(G()-1))*(PAL()>=2?1.2:1);}
function allowedTypes(){const g=G();const t=['rampant','rampant'];for(const k in UNLOCK)if(g>=UNLOCK[k])t.push(k);if(g>=8)t.push('spectre','brute');if(g>=14)t.push('voile','hurleur','brute');return t;}
function genWave(b,allowed){const list=[];let guard=0;while(b>0.9&&guard++<80){const t=pick(allowed);const c=ED[t].cost;if(c>b+0.5){if(allowed.every(a=>ED[a].cost>b+0.5))break;continue;}list.push({type:t});b-=c;}if(!list.length)list.push({type:'rampant'});return list;}

function chooseTheme(al){
 const set=new Set(al),g=G();
 const elig=Object.keys(WTHEMES).filter(k=>WTHEMES[k].need.every(t=>set.has(t)));
 let pool=elig.filter(k=>k!==RUN.lastTheme);if(!pool.length)pool=elig;
 const tot=pool.reduce((a,k)=>a+WTHEMES[k].w(g),0);let r=Math.random()*tot;
 for(const k of pool){r-=WTHEMES[k].w(g);if(r<=0)return k;}
 return pool[pool.length-1];
}
function planRoom(type){
 const B=budget(),al=allowedTypes(),waves=[];
 const forced=RUN.forceTheme&&WTHEMES[RUN.forceTheme]?RUN.forceTheme:null;
 const newT=forced?null:al.find(t=>t!=='rampant'&&!RUN.seen.has(t));
 if(type==='combat'){
  const theme=forced||chooseTheme(al);room.wtheme=theme;RUN.lastTheme=theme;
  const shape=G()<=2?[0.75,1.15]:[0.6,1.0,1.35];
  shape.forEach((f,i)=>{if(i===0&&newT){const n=(newT==='brute'||newT==='hurleur')?1:2;const w=[];for(let k=0;k<n;k++)w.push({type:newT});w.push({type:'rampant'},{type:'rampant'});waves.push(w);}else waves.push(WTHEMES[theme].build(B*f));});
 }else if(type==='elite'){
  const et=pick(G()>=14?['voile','nourrice','brute','hurleur']:G()>=8?['brute','spectre','hurleur']:['brute','spectre']);
  waves.push(genWave(B*0.6,al));waves.push([{type:et,elite:true},...genWave(B*0.55,al)]);
 }
 for(const w of waves)for(const x of w)RUN.seen.add(x.type);
 return waves;
}
function findSpawn(minD=230){for(let i=0;i<50;i++){const x=rand(AR.x0+40,AR.x1-40),y=rand(AR.y0+40,AR.y1-40);if(hyp(x-P.x,y-P.y)<minD)continue;if(room.pillars.some(p=>hyp(x-p.x,y-p.y)<p.r+30))continue;return{x,y};}return{x:rand(AR.x0+40,AR.x1-40),y:AR.y0+60};}
function themePos(sp,pc){
 let x,y;const fr=((sp.gi||0)+0.5)/(sp.gn||1);
 if(sp.x!=null){x=sp.x;y=sp.y;}
 else if(sp.at==='back'){x=AR.x0+170+(AR.x1-AR.x0-340)*fr+rand(-25,25);y=AR.y0+58+rand(0,28);}
 else if(sp.at==='screen'){x=AR.x0+120+(AR.x1-AR.x0-240)*fr+rand(-20,20);y=AR.y0+190+rand(-16,16);}
 else if(sp.at==='pack'&&pc){x=clamp(pc.x+rand(-95,95),AR.x0+30,AR.x1-30);y=clamp(pc.y+rand(-70,70),AR.y0+30,AR.y1-30);}
 else return findSpawn();
 if(hyp(x-P.x,y-P.y)<200||room.pillars.some(q=>hyp(x-q.x,y-q.y)<q.r+30))return findSpawn();
 return{x,y};

 else if(e.state==='wind'){e.t-=dt;if(e.t>e.windTot*0.45)e.ang=Math.atan2(P.y-e.y,P.x-e.x);if(e.t<=0){e.state='charge';e.t=0.42;e.hitSet=new Set();}}

function bossGap(e){return [0,1.7,1.35,1.0][e.phase]*(PAL()>=5?0.85:1);}
function bossPhase(e){return e.hp>e.maxHp*0.66?1:e.hp>e.maxHp*0.33?2:3;}

 if(ph>e.phase){e.phase=ph;e.queue=[];toast(ph===2?`${e.name} se déchaîne`:`${e.name} entre en furie`,2.2);bossRing(e,Math.random());shake(10,0.4);sfx('phase');tlights.push({x:e.x,y:e.y,r:420,t:0.5,max:0.5,c:'rage'});if(e.state==='idle')e.patT=0.8;}

 if(e.state==='wind'){e.t-=dt;if(e.t>0.3)e.ang=Math.atan2(P.y-e.y,P.x-e.x);if(e.t<=0){e.state='charge';e.t=0.62;}}
 else if(e.state==='charge'){e.x+=Math.cos(e.ang)*680*dt;e.y+=Math.sin(e.ang)*680*dt;e.t-=dt;if(touching)contact(e,e.dmg*1.4);

  if(e.phase===3){e.ringT-=dt;if(e.ringT<=0){e.ringT=1.1;bossRing(e,Math.random(),10);}}

 else if(e.state==='ring'){e.t-=dt;if(e.t<=0){bossRing(e,Math.random());if(e.phase>=2)later(0.4,()=>{if(!e.dead)bossRing(e,Math.random());});e.state='idle';e.patT=gap;}}
 else if(e.state==='chant'){e.t-=dt;if(e.t<=0&&e.chantN>0){e.chantN--;e.t=0.45;rings.push({x:e.x,y:e.y,r:e.r,v:230,max:560,dmg:e.dmg*0.9,hit:false,boss:true});sfx('howl');}if(e.chantN<=0&&e.t<=0){e.state='idle';e.patT=gap;}
  if(e.phase===3){e.shotT-=dt;if(e.shotT<=0){e.shotT=0.16;bossShot(e,e.spinA,160);e.spinA+=0.5;}}}
 else{const want=250;if(dP>want+40)moveTo(e,P.x,P.y,e.spd*slow,dt);else if(dP<want-70)moveTo(e,2*e.x-P.x,2*e.y-P.y,e.spd*slow*0.8,dt);e.patT-=dt;if(e.patT<=0)bossPattern(e);}

function bossPattern(e){

 if(!e.queue.length)e.queue=shuffle(pools1[e.phase].slice());const p=e.queue.shift();const gap=bossGap(e);

 else if(p==='spiral'){e.state='spiral';e.t=e.phase===3?3:2.4;e.shotT=0;e.ringT=0.6;e.spinA=rand(0,TAU);e.spinDir=Math.random()<0.5?1:-1;}

function hitEnemy(e,base,o={}){
 if(e.dead||e.puppet>0)return 0;const s=P.s,obs=isObscur();
 let m=s.dmg*(1+0.2*P.elan/100);
 if(o.light)m*=s.lightDmg;
 if(o.cor)m*=s.corDmg;
 if(e.exposed)m*=1+s.exposedBonus;
 if(e.marked>0)m*=1.3;
 if(obs)m*=1+s.obscurDmg;
 if(P.surT>0)m*=1.3;
 if(e.vuln>0)m*=1.5;
 if(P.ambushT>0&&!o.dot)m*=2;
 if(e.type==='voile'&&!e.exposed)m*=0.2;
 if(e.siege&&shielded(e))m*=0.3;
 m*=v6DmgMul(e,o);
 if(s.bourse)m*=1+Math.min(0.3,Math.floor(gold()/15)*0.01);
 if(P.cls==='gou'){const t=gouTier();m*=[1,1.25,1.55][t]+s.tierBonus*t;m*=1+P.feast;m*=1+0.06*P.roomMut;if(P.metaT>0)m*=1.5;if(P.mut&&P.mut.id==='griffes')m*=1.4;}
 let crit=false;
 if(!o.dot&&o.crit!==false){let c=s.crit+(o.critAdd||0)+(obs?s.obscurCrit:0)+(s.oeil?P.roomMut*(s.oeil>=2?0.12:0.08):0);if(P.nightT>0||o.forceCrit)c=1;if(Math.random()<c){crit=true;m*=(s.enfant&&obs)?s.critMult+1.2:s.critMult;}}
 const dmg=base*m;e.hp-=dmg;RUN.dmg+=dmg;e.lastHit=RUN.time;if(e.fixed)e.dmgLog.push([RUN.time,dmg]);
 v6AfterHit(e,dmg,o);
 if(s.lifesteal)heal(dmg*s.lifesteal,'steal');
 if(o.dot)e.dotAcc+=dmg;
 else{e.flash=0.09;addNum(e.x+rand(-6,6),e.y-e.r-6,Math.round(dmg),crit?'crit':(o.light?'light':o.cor?'cor':'n'));
  if(crit){if(s.danse)danseReduce();if(!RM)freezeT=Math.max(freezeT,0.035);sfx('crit');}else sfx('hit');
  sparks(e.x,e.y,crit?8:4,crit?'#ffd36b':(o.color||'#f6d38a'));impactFx(e.x+rand(-4,4),e.y-4+rand(-4,4),crit,crit?'255,200,90':P.cls==='gou'?'190,240,140':P.cls==='her'?'175,212,255':P.cls==='tis'?'255,150,180':isObscur()?'200,170,255':'255,225,160');}
 if(o.kb&&e.type!=='boss'&&!e.fixed){const a=Math.atan2(e.y-o.sy,e.x-o.sx),k=o.kb*(e.elite?0.4:1);e.kbx+=Math.cos(a)*k;e.kby+=Math.sin(a)*k;}
 if(o.stun)e.stun=Math.max(e.stun,e.type==='boss'?o.stun*0.25:o.stun*(e.elite?0.6:1));
 if(o.mark)e.marked=Math.max(e.marked,o.mark);
 if(e.hp<=0){if(e.fixed)e.hp=e.maxHp;else killEnemy(e);}
 return dmg;
}
function killEnemy(e){

 if(e.type==='boss'){bossDefeated(e);return;}
 if(e.type==='hurleur'&&e.key&&!enemies.some(o=>!o.dead&&o.type==='hurleur'&&o.key))choirBreak(e.x,e.y);

 if(P.cls==='her'||P.cls==='tis')v6OnKill(e);
 mist(e.x,e.y,e.r);sfx('kill');decals.push({x:e.x,y:e.y+e.r*0.4,r:e.r*1.2,t:6,max:6,col:'14,10,24',seed:Math.random()*10});parts.push({shape:'star',x:e.x,y:e.y-6,vx:rand(-10,10),vy:-45,life:1.1,max:1.1,size:2.4,col:'#c9b4ff',layer:'post',drag:0.6});
 if(e.type==='bouffi'){const x=e.x,y=e.y;deferred.push(()=>explosion(x,y,82,0,40,{}));}
 if(s.crepuscule&&isObscur()){const x=e.x,y=e.y;deferred.push(()=>explosion(x,y,95,0,35,{mark:4,col:'rgba(160,110,255,',spark:'#c9b4ff',light:'violet'}));}

}

function hurtPlayer(dmg,src){
 if(P.iT>0||P.dashT>0||P.dead||state!=='play')return;
 const s=P.s;dmg*=s.dmgTaken;
 if(P.cls==='gou'){if(P.carapT>0)dmg*=s.carapace>=2?0.25:0.4;if(P.mut&&P.mut.id==='pierre')dmg*=0.6;if(P.metaT>0)dmg*=0.7;
  if(P.carapT>0&&P.carapFx<=0){P.carapFx=0.4;later(0,()=>explosion(P.x,P.y,95,0,30,{col:'rgba(200,200,190,',spark:'#e0ddd0',light:'none'}));}

function updateRings(dt){for(const g of rings){g.r+=g.v*dt;if(!g.hit&&!P.dead){const d=hyp(P.x-g.x,P.y-g.y);if(Math.abs(d-g.r)<10+P.r*0.6&&P.dashT<=0&&P.iT<=0){g.hit=true;hurtPlayer(g.dmg);}}}rings=rings.filter(g=>g.r<g.max);}

  if(p.from&&!p.boss){for(const o of enemies){if(o.dead||o===p.from||o.type==='spectre'||o.type==='boss'||o.fixed)continue;if(hyp(o.x-p.x,o.y-p.y)<o.r+p.r*0.6){p.dead=true;friendlyHit(o,p.dmg*0.6,Math.atan2(p.vy,p.vx),0,0);break;}}if(p.dead)continue;}

  for(const e of enemies){if(e.dead||e.puppet>0||p.hit.has(e))continue;if(hyp(e.x-p.x,e.y-p.y)<e.r+p.r){p.hit.add(e);if(p.v6)projHit(p,e);else hitEnemy(e,p.dmg,{light:p.light,cor:p.cor,kb:70,sx:p.x-p.vx,sy:p.y-p.vy});p.pierce--;if(p.pierce<=0){p.dead=true;break;}}}}
 pproj=pproj.filter(p=>!p.dead);
}

function step(dt){
 RUN.time+=dt;
 if(trans){trans.t+=dt;if(trans.phase==='out'){fade=Math.min(1,trans.t/0.32);if(trans.t>=0.32){doEnter(trans.type);trans={phase:'in',t:0};}return;}else{fade=Math.max(0,1-trans.t/0.4);if(trans.t>=0.4){trans=null;fade=0;}}}

 const w=id=>{const n=NODES[id],r=P.ranks[id]||0;if(n.kind==='k')return 0.5;if(n.kind==='s')return r?0.8:1.4;return r?0.7:1;};

 const rows=[['Salles purifiées',RUN.sh.rooms],['Champions vaincus',RUN.sh.elites],['Gardiens vaincus',RUN.sh.bosses],['Ennemis vaincus',F.kills]];if(win)rows.push(['Victoire',25]);

 ${notes.map(n=>`<p class="notice">${n}</p>`).join('')}

function applyMeta(){

 if(RUN.hub)return;

 for(let i=0;i<mr('sav');i++){P.level++;P.pendingLv++;}

}

const escKeys=c=>{if(c==='Escape')closeOverlay();};
function npcById(id){return (room&&room.npcs||[]).find(n=>n.id===id)||HUB_NPCS.find(n=>n.id===id)||MERCHANT;}
function npcHead(n,quote){return `<div class="npc-head"><p class="eyebrow">${esc(n.role)}</p><h2>${esc(n.name)}</h2><p class="quote">« ${esc(quote||lineFor(n.id))} »</p></div>`;}
function updateNpcs(){if(!overlayEl.hidden||trans||P.dead)return;for(const n of room.npcs){const d=hyp(P.x-n.tx,P.y-n.ty);if(d<n.tr){if(!n.near){n.near=true;openNpc(n.id);return;}}else if(d>n.tr+18)n.near=false;}}

function shardPurse(note){return `<div class="row" style="justify-content:space-between;margin:0 0 14px"><p class="purse sh"><span>Éclats de Mémoire</span><b>${SAVE.shards}</b></p><span class="k">${note}</span></div>`;}

 overlayEl.innerHTML=`<div class="panel narrow">${npcHead(n)}${shardPurse('Chaque descente rapporte des éclats, même ratée.')}<div class="meta">${META.map(m=>{const r=mr(m.id),maxed=r>=m.max,cost=maxed?0:m.cost[r];return `<div class="mrow"><div><h3><span class="mi">${icon(m.id)}</span>${m.name}</h3><p>${m.desc}</p><div class="pips">${Array.from({length:m.max},(_,i)=>`<i class="${i<r?'on':''}"></i>`).join('')}</div></div><button type="button" class="btn" data-m="${m.id}" ${maxed||SAVE.shards<cost?'disabled':''}>${maxed?'Complet':`Renforcer · ${cost} ✦`}</button></div>`;}).join('')}</div><div class="row"><button type="button" class="btn primary" id="close">Fermer</button><span class="k">Échap pour fermer</span></div></div>`;

function genShop(){const n=3+(P.s.clef?1:0);const pool=shuffle(RELICS.filter(r=>!P.relics.includes(r.id)&&(!r.cls||r.cls===P.cls)&&relicUnlocked(r)));return{relics:pool.slice(0,n).map(r=>({id:r.id,price:price(70+randi(0,4)*5)})),sold:{},refreshN:0,freeRefresh:!!P.s.clef,line:pick(MERCHANT_LINES),items:[]};}
function renderShop(){
 const sh=room.shop,g=gold();if(!sh){closeOverlay();return;}
 const items=[];
 for(const it of sh.relics){const r=RELICS.find(x=>x.id===it.id);items.push({key:'r:'+it.id,g:icon(r.id),name:r.name,desc:r.desc,price:it.price,kind:'Relique'});}
 items.push({key:'heal',g:icon('heal'),name:'Tisane amère',desc:`Récupère ${Math.round(35*healF())} % de tes PV.`,price:price(40),kind:'Soin'});
 items.push({key:'level',g:icon('level'),name:'Parchemin de savoir',desc:'Gagne immédiatement un niveau. Son prix monte à chaque achat.',price:price(60+25*RUN.levelsBought),kind:'Talent'});
 items.push({key:'temper',g:icon('temper'),name:'Pierre à aiguiser',desc:'+6 % de dégâts jusqu’à la fin de la run.',price:price(55),kind:'Renfort'});
 items.push({key:'dice',g:icon('dice'),name:'Dés pipés',desc:'+1 relance de talents.',price:price(30),kind:'Relance'});
 sh.items=items;
 const refreshCost=sh.freeRefresh?0:price(15+10*sh.refreshN);
 overlayEl.innerHTML=`<div class="panel">${npcHead(MERCHANT,sh.line)}<div class="row" style="justify-content:space-between;margin:0 0 14px"><p class="purse"><span>Ta bourse</span><b>${g}</b><span>or</span></p><span class="k">L’or ne remonte pas au Sanctuaire. Dépense-le.</span></div><div class="shop">${items.map(it=>{const sold=!!sh.sold[it.key];const can=!sold&&g>=it.price;return `<button type="button" class="card ${sold?'sold':''}" data-k="${it.key}" ${can?'':'disabled'}><span class="meta"><span class="br">${it.kind}</span><span>${sold?'Vendu':''}</span></span><span class="gl">${it.g}</span><h3>${esc(it.name)}</h3><p>${esc(it.desc)}</p><span class="price">${sold?'Vendu':it.price+' or'}</span></button>`;}).join('')}</div><div class="row"><button type="button" class="btn" id="refresh" ${g>=refreshCost?'':'disabled'}>Renouveler les reliques · ${refreshCost?refreshCost+' or':'gratuit'}</button><button type="button" class="btn primary" id="leave">Partir</button><span class="k">Échap pour partir. Reviens vers la charrette pour rouvrir l’étal.</span></div></div>`;
 overlayEl.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>buyItem(b.dataset.k)));
 $('#refresh').addEventListener('click',()=>{const cost=sh.freeRefresh?0:price(15+10*sh.refreshN);if(gold()<cost)return;RUN.goldF-=cost;if(sh.freeRefresh)sh.freeRefresh=false;else sh.refreshN++;const n=3+(P.s.clef?1:0);const pool=shuffle(RELICS.filter(r=>!P.relics.includes(r.id)&&(!r.cls||r.cls===P.cls)&&relicUnlocked(r)));for(const k in sh.sold)if(k.startsWith('r:'))delete sh.sold[k];sh.relics=pool.slice(0,n).map(r=>({id:r.id,price:price(70+randi(0,4)*5)}));sfx('pick');renderShop();});

}
function buyItem(key){
 const sh=room.shop,it=sh.items.find(i=>i.key===key);if(!it||sh.sold[key]||gold()<it.price)return;
 RUN.goldF-=it.price;
 if(key.startsWith('r:')){applyRelic(RELICS.find(r=>r.id===key.slice(2)));sh.sold[key]=1;}

const INK='rgba(4,5,9,.95)';
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);}
function shadowAt(c,x,y,rx,ry,a){c.fillStyle=`rgba(0,0,0,${a==null?0.42:a})`;ell(c,x,y,rx,ry);c.fill();}
function inkFill(c,fill,w){c.fillStyle=fill;c.fill();c.strokeStyle=INK;c.lineWidth=w||2;c.stroke();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function radial(c,x,y,r,a,b){const g=c.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r*1.05);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function lin3(c,x0,x1,a,b){const g=c.createLinearGradient(x0,0,x1,0);g.addColorStop(0,a);g.addColorStop(0.5,b);g.addColorStop(1,a);return g;}
function glow(c,x,y,r,col,a){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}

function renderFloor(rm){
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');

 if(th==='faub')floorCobbles(g,p);else if(th==='crypt')floorSlabs(g,p,rm);else if(th==='coeur')floorHex(g,p,rm);else floorFlags(g,p);

 gr=g.createLinearGradient(AR.x0,0,AR.x0+44,0);gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(AR.x0,AR.y0,44,AR.y1-AR.y0);
 gr=g.createLinearGradient(AR.x1,0,AR.x1-44,0);gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(AR.x1-44,AR.y0,44,AR.y1-AR.y0);

function floorCobbles(g,p){const rh=24;for(let y=AR.y0-4,row=0;y<AR.y1+rh;y+=rh,row++){let x=AR.x0-(row%2?14:0)-randi(0,10);while(x<AR.x1+20){const w=randi(22,38);g.fillStyle=`hsl(${p.h+rand(-6,6)},${p.s+rand(-3,3)}%,${p.l+rand(-3.5,3)}%)`;rr(g,x+1.5,y+1.5,w-3,rh-3,6);g.fill();g.fillStyle='rgba(255,255,255,.05)';rr(g,x+3,y+2.5,w-7,4,2);g.fill();g.fillStyle='rgba(0,0,0,.22)';rr(g,x+2,y+rh-6,w-4,3.5,1.5);g.fill();x+=w;}}}

// ───────────────────────── Musique : pistes par lieu, fondu enchaîné
// Dépose les fichiers dans le dossier publié « music/ » puis renseigne leurs chemins ici.
const MUSIC={files:{titre:'music/titre.mp3',sanctuaire:'music/sanctuaire.mp3',acte1:'music/acte1.mp3',acte2:'music/acte2.mp3',acte3:'music/acte3.mp3',boss3:'music/boss3.mp3',boss1:'music/boss1.mp3',boss2:'music/boss2.mp3',colporteur:'music/colporteur.mp3',victoire:'music/victoire.mp3',fin:'music/fin.mp3'},tracks:[],cur:null,vol:0.55,blocked:false};
const ONE_SHOT=['victoire','fin'];
function newTrack(key){const el=new Audio(MUSIC.files[key]);el.loop=false;el.preload='auto';el.volume=0;const t={key,el,v:0,target:1};el.addEventListener('error',()=>{t.dead=true;});MUSIC.tracks.push(t);return t;}
try{const v=localStorage.getItem('la-brume-music');if(v!==null&&!isNaN(+v))MUSIC.vol=clamp(+v,0,1);}catch(e){}
function musicKey(){if(state==='title')return 'titre';if(state==='over')return RUN&&RUN.final&&RUN.final.win?'victoire':'fin';if(!RUN||!room)return null;if(RUN.hub)return 'sanctuaire';if(room.type==='boss')return 'boss'+RUN.act;if(room.type==='marchand')return 'colporteur';return 'acte'+RUN.act;}
function updateMusic(dt){
 let k=musicKey();if(k&&!MUSIC.files[k])k={acte3:'acte2',boss3:'boss2'}[k]||k;const want=k&&MUSIC.files[k]?k:null;
 if(want!==MUSIC.cur){MUSIC.cur=want;for(const t of MUSIC.tracks)t.target=0;if(want){let t=MUSIC.tracks.filter(x=>x.key===want&&!x.handoff).pop();if(!t)t=newTrack(want);t.target=1;if(t.el.paused){if(ONE_SHOT.includes(want)||t.el.ended)try{t.el.currentTime=0;}catch(e){}t.el.play().catch(()=>{MUSIC.blocked=true;});}}}
 // boucle douce : à 2,5 s de la fin, une nouvelle lecture démarre en fondu
 for(const t of MUSIC.tracks.slice()){if(t.handoff||t.target!==1||ONE_SHOT.includes(t.key))continue;const d=t.el.duration;if(d&&isFinite(d)&&t.el.currentTime>d-2.5){t.handoff=true;t.target=0;const n=newTrack(t.key);n.el.play().catch(()=>{MUSIC.blocked=true;});}}
 const master=muted?0:MUSIC.vol*((paused&&state==='play')?0.5:1);
 for(const t of MUSIC.tracks){const rate=dt/1.6;t.v+=clamp(t.target-t.v,-rate,rate);try{t.el.volume=clamp(t.v*master,0,1);}catch(e){}if(t.v<=0.001&&t.target===0&&!t.el.paused){t.el.pause();if(t.handoff)t.dead=true;}}
 MUSIC.tracks=MUSIC.tracks.filter(t=>!t.dead);
}
function musicKick(){if(!MUSIC.blocked)return;MUSIC.blocked=false;const t=MUSIC.tracks.find(x=>x.key===MUSIC.cur);if(t&&t.el.paused)t.el.play().catch(()=>{MUSIC.blocked=true;});}

// ═════════════════════════ Effets visuels v5 : traînées, rayons, morsures, éclaboussures
let decals=[];
const easeOut=k=>1-Math.pow(1-k,3);
function star4(c,x,y,s,col,a,rot){c.save();c.translate(x,y);c.rotate(rot||0);c.fillStyle=`rgba(${col},${a})`;c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(s*0.12,-s*0.12,s,0);c.quadraticCurveTo(s*0.12,s*0.12,0,s);c.quadraticCurveTo(-s*0.12,s*0.12,-s,0);c.quadraticCurveTo(-s*0.12,-s*0.12,0,-s);c.fill();c.restore();}
function impactFx(x,y,crit,col){fx.push({k:'star',x,y,s:crit?22:12,t:crit?0.2:0.13,max:crit?0.2:0.13,col:col||'255,225,160',crit,rot:rand(0,TAU)});}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(120,340),l=rand(0.18,0.4);parts.push({shape:'streak',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,size:rand(1.2,2.2),col,layer:'post',drag:5});}}
function heroGhost(c,x,y,cls,sc){if(cls==='gou'){c.save();c.translate(x,y);c.scale(sc,sc);blobPath(c,16,T*1.4);c.fill();c.restore();return;}c.beginPath();c.moveTo(x-9,y-8);c.bezierCurveTo(x-11,y-18,x-5,y-25,x,y-27);c.bezierCurveTo(x+5,y-25,x+11,y-18,x+9,y-8);c.bezierCurveTo(x+13,y-3,x+15,y+6,x+14,y+15);c.lineTo(x-14,y+15);c.bezierCurveTo(x-15,y+6,x-13,y-3,x-9,y-8);c.closePath();c.fill();}
function spitFx(sx,sy,a,arc,L){
 for(let i=0;i<20;i++){const ang=a+rand(-arc/2,arc/2),v=rand(260,640);parts.push({shape:'glob',x:sx,y:sy,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,life:0.42,max:0.42,size:rand(3,6.5),col:i%4?'#9be07a':'#e1d75a',layer:'post',drag:3.2});}
 for(let i=0;i<5;i++){const ang=a+rand(-arc/2,arc/2)*0.8,d=rand(L*0.35,L*0.95);decals.push({x:clamp(sx+Math.cos(ang)*d,AR.x0+8,AR.x1-8),y:clamp(sy+Math.sin(ang)*d,AR.y0+8,AR.y1-8),r:rand(10,22),t:5,max:5,col:'72,118,40',seed:Math.random()*10});}
 fx.push({k:'wave',x:sx,y:sy,a,arc:Math.max(arc,0.3),r:L,t:0.32,max:0.32,col:'160,235,110'});}
function updateDecals(dt){for(const d of decals)d.t-=dt;decals=decals.filter(d=>d.t>0);if(decals.length>70)decals.splice(0,decals.length-70);}
function drawDecals(){if(!decals.length)return;const c=ctx;for(const d of decals){const k=Math.min(1,d.t/d.max*1.6);c.fillStyle=`rgba(${d.col},${0.55*k})`;c.beginPath();for(let i=0;i<=10;i++){const a=i/10*TAU,rr2=d.r*(0.7+0.3*Math.sin(a*3+d.seed));const px=d.x+Math.cos(a)*rr2,py=d.y+Math.sin(a)*rr2*0.7;if(i)c.lineTo(px,py);else c.moveTo(px,py);}c.closePath();c.fill();for(let i=0;i<3;i++){const a=d.seed+i*2.1;ell(c,d.x+Math.cos(a)*d.r*1.25,d.y+Math.sin(a)*d.r*0.85,d.r*0.16,d.r*0.12);c.fill();}}}

// ───────────────────────── Effets ponctuels
function drawFx(){const c=ctx;
 for(const f of fx){if(f.k!=='ghost')continue;const k=f.t/f.max;c.save();c.globalCompositeOperation='lighter';c.fillStyle=`rgba(${f.col},${0.45*k})`;heroGhost(c,f.x,f.y,f.cls,f.sc);c.restore();}
 c.save();c.globalCompositeOperation='lighter';
 for(const f of fx){const k=f.t/f.max,p=1-k;
  if(f.k==='slash'){const e=easeOut(Math.min(1,p*1.35)),a0=f.a-f.dir*f.arc/2,head=a0+f.dir*f.arc*e,tail=a0+f.dir*f.arc*Math.max(0,e-0.7),N=16,th=f.r*0.42;c.strokeStyle=`rgba(${SLASHCOL[f.style]?SLASHCOL[f.style][0]:f.style==='lum'?'255,190,100':f.style==='sol'?'255,90,60':'150,110,255'},${0.2*k})`;c.lineWidth=th*1.5;c.beginPath();c.arc(f.x,f.y,f.r-th*0.4,Math.min(tail,head),Math.max(tail,head));c.stroke();
   if(f.style==='obs'||f.style==='shadow'){c.globalCompositeOperation='source-over';c.fillStyle=`rgba(8,5,18,${0.75*k})`;c.beginPath();for(let i=0;i<=N;i++){const u=i/N,an=tail+(head-tail)*u;c.lineTo(f.x+Math.cos(an)*f.r,f.y+Math.sin(an)*f.r);}for(let i=N;i>=0;i--){const u=i/N,an=tail+(head-tail)*u;c.lineTo(f.x+Math.cos(an)*(f.r-th*u),f.y+Math.sin(an)*(f.r-th*u));}c.closePath();c.fill();c.globalCompositeOperation='lighter';}
   const col=SLASHCOL[f.style]?SLASHCOL[f.style][1]:f.style==='lum'?'255,205,120':f.style==='sol'?'255,110,70':'175,135,255';
   for(let i=0;i<N;i++){const u0=i/N,u1=(i+1)/N,a1=tail+(head-tail)*u0,a2=tail+(head-tail)*u1,w1=th*u0,w2=th*u1;c.fillStyle=`rgba(${col},${(f.style==='lum'||f.style==='sol'||SLASHCOL[f.style]?1:0.7)*u1*Math.sqrt(k)+0.08})`;c.beginPath();c.moveTo(f.x+Math.cos(a1)*f.r,f.y+Math.sin(a1)*f.r);c.lineTo(f.x+Math.cos(a2)*f.r,f.y+Math.sin(a2)*f.r);c.lineTo(f.x+Math.cos(a2)*(f.r-w2),f.y+Math.sin(a2)*(f.r-w2));c.lineTo(f.x+Math.cos(a1)*(f.r-w1),f.y+Math.sin(a1)*(f.r-w1));c.closePath();c.fill();}
   c.strokeStyle=`rgba(255,250,232,${0.9*k})`;c.lineWidth=1.6;c.beginPath();c.arc(f.x,f.y,f.r,Math.min(tail,head),Math.max(tail,head));c.stroke();
   const hx=f.x+Math.cos(head)*(f.r-th*0.4),hy=f.y+Math.sin(head)*(f.r-th*0.4);glow(c,hx,hy,16,col,0.6*k);star4(c,hx,hy,7*k+2,'255,250,232',0.9*k,head);}
  else if(f.k==='bite'){const cx=f.x+Math.cos(f.a)*f.r*0.55,cy=f.y+Math.sin(f.a)*f.r*0.55,w=f.r*0.55,gap=Math.pow(k,2)*f.r*0.42+2;c.save();c.translate(cx,cy);c.rotate(f.a);
   for(const s of[-1,1]){c.strokeStyle=`rgba(${f.col},${0.85*Math.min(1,k*2)})`;c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(-w*0.7,s*(gap+w*0.55));c.quadraticCurveTo(w*0.15,s*(gap+w*0.7),w*0.8,s*gap);c.stroke();c.fillStyle=`rgba(240,235,215,${0.9*Math.min(1,k*2)})`;for(let i=0;i<4;i++){const u=0.15+i*0.22,bx=-w*0.7+(w*1.5)*u,by=s*(gap+w*0.55*(1-u)+w*0.1);c.beginPath();c.moveTo(bx-3,by);c.lineTo(bx+3,by);c.lineTo(bx,by-s*7);c.closePath();c.fill();}}
   if(k<0.4)star4(c,w*0.3,0,14*(1-k),f.col,0.8*(1-k/0.4),0.4);c.restore();}
  else if(f.k==='star'){const s=f.s*(0.6+0.4*Math.sin(p*Math.PI));glow(c,f.x,f.y,s*1.6,f.col,0.55*k);star4(c,f.x,f.y,s,f.col,0.95*k,f.rot);star4(c,f.x,f.y,s*0.55,'255,255,245',k,f.rot+Math.PI/4);
   if(f.crit){c.strokeStyle=`rgba(${f.col},${0.8*k})`;c.lineWidth=2;c.beginPath();c.arc(f.x,f.y,f.s*(0.6+p*1.4),0,TAU);c.stroke();c.lineWidth=1.4;for(let i=0;i<8;i++){const a=f.rot+i/8*TAU,r1=f.s*(0.9+p),r2=f.s*(1.5+p*1.6);c.beginPath();c.moveTo(f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1);c.lineTo(f.x+Math.cos(a)*r2,f.y+Math.sin(a)*r2);c.stroke();}}}
  else if(f.k==='wave'){const e=easeOut(p),r=f.r*e;c.strokeStyle=`rgba(${f.col},${0.7*k})`;c.lineWidth=10*k+2;c.beginPath();c.arc(f.x,f.y,r,f.a-f.arc/2,f.a+f.arc/2);c.stroke();c.strokeStyle=`rgba(240,255,220,${0.6*k})`;c.lineWidth=2;c.beginPath();c.arc(f.x,f.y,r*0.92,f.a-f.arc/2.4,f.a+f.arc/2.4);c.stroke();}
  else if(f.k==='sun'){const e=easeOut(p);for(let i=0;i<18;i++){const a=f.rot+i/18*TAU,r1=f.r*0.15+f.r*0.4*e,r2=f.r*(0.45+0.7*e)*(i%2?0.8:1);c.strokeStyle=`rgba(${f.col},${0.75*k})`;c.lineWidth=(i%2?2:3.5)*k+0.5;c.beginPath();c.moveTo(f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1);c.lineTo(f.x+Math.cos(a)*r2,f.y+Math.sin(a)*r2);c.stroke();}glow(c,f.x,f.y,f.r*0.6*(1-e*0.5),f.col,0.5*k);}

// ───────────────────────── Faisceau, Ventre-Canon
const PRISM=['255,190,120','255,120,175','140,220,255'];
function drawBeam(){const b=P.beam;if(!b)return;const c=ctx;c.save();c.beginPath();c.rect(AR.x0,AR.y0,AR.x1-AR.x0,AR.y1-AR.y0);c.clip();c.globalCompositeOperation='lighter';c.lineCap='round';c.lineJoin='round';
 const style=b.kind==='cor'?'cor':P.s.sub==='sol'?'sol':'lum';
 b.rays.forEach((r,i)=>{const a=b.a+r,ca=Math.cos(a),sa=Math.sin(a),nx=-sa,ny=ca,len=b.len;
  const col=style==='cor'?'160,235,105':style==='sol'?'255,95,60':(b.rays.length>1?PRISM[i]:'255,200,115');
  if(style!=='cor'){const g=c.createLinearGradient(b.x,b.y,b.x+ca*len,b.y+sa*len);g.addColorStop(0,`rgba(${col},.28)`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.moveTo(b.x+nx*3,b.y+ny*3);c.lineTo(b.x+ca*len+nx*30,b.y+sa*len+ny*30);c.lineTo(b.x+ca*len-nx*30,b.y+sa*len-ny*30);c.lineTo(b.x-nx*3,b.y-ny*3);c.closePath();c.fill();}
  const pts=[];const N=28,amp=style==='cor'?5:2.6;for(let k=0;k<=N;k++){const d=k/N*len,o=Math.sin(d*0.045-T*(style==='cor'?18:32)+i*2)*amp*Math.min(1,d/60);pts.push([b.x+ca*d+nx*o,b.y+sa*d+ny*o]);}
  const path=()=>{c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const q of pts)c.lineTo(q[0],q[1]);};
  const fl=1+Math.sin(T*40+i)*0.12;
  path();c.strokeStyle=`rgba(${col},.22)`;c.lineWidth=(style==='cor'?26:20)*fl;c.stroke();
  path();c.strokeStyle=`rgba(${col},.55)`;c.lineWidth=(style==='cor'?12:8)*fl;c.stroke();
  if(style==='sol'){c.globalCompositeOperation='source-over';path();c.strokeStyle='rgba(18,6,6,.9)';c.lineWidth=3.2;c.stroke();c.globalCompositeOperation='lighter';path();c.strokeStyle='rgba(255,170,130,.55)';c.lineWidth=1;c.stroke();}
  else{path();c.strokeStyle=style==='cor'?'rgba(230,255,200,.85)':'rgba(255,252,236,.95)';c.lineWidth=2.6;c.stroke();}

 ['f11',1,0,'Le Marais d’Étain','reeds','Hors les murs, le marais. C’est là qu’on jeta d’abord ceux que plus personne ne reconnaissait.'],

function lblSVG(name,x,y){const t=name.replace(/^(Le |La |Les |L’)/,'');if(t.length<=13)return `<text x="${x}" y="${y}" class="lbl">${esc(t)}</text>`;const w=t.split(' ');let best=1,bd=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ').length,b=w.slice(i).join(' ').length,d=Math.abs(a-b);if(d<bd){bd=d;best=i;}}return `<text x="${x}" y="${y-2}" class="lbl"><tspan x="${x}">${esc(w.slice(0,best).join(' '))}</tspan><tspan x="${x}" dy="11">${esc(w.slice(best).join(' '))}</tspan></text>`;}

 // maisons, routes, champs : générés avec une graine fixe
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 let houses='';for(let i=0;i<340;i++){const x=70+rnd()*460,y=40+rnd()*380,w=5+rnd()*9,h=4+rnd()*6;houses+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" transform="rotate(${((rnd()-0.5)*40).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;}

 let streets='';for(let i=0;i<14;i++){const a=-Math.PI*0.05+i/13*Math.PI*1.1;streets+=`M300 222L${(300+Math.cos(a)*300).toFixed(0)} ${(222+Math.sin(a)*210).toFixed(0)}`;}

function archTabs(){const m=M(),nf=m.fragNew.length+m.truthNew.length,nr=LORE.filter(l=>l.c(SAVE)&&!SAVE.loreSeen.includes(l.id)).length;

 return `<div class="tabs" role="tablist">${t('reg','Registres',nr)}${t('echo','Échos de la Brume',0)}${t('map','Carte du Glas',nf)}</div>`;}
function renderArchiviste(){
 const n=npcById('archiviste'),m=M();let body='';
 if(ARCH_TAB==='reg'){const un=LORE.filter(l=>l.c(SAVE));
  const recs=[['Descentes',SAVE.runs],['Victoires',SAVE.wins],['Gardiens vaincus',SAVE.bossKills],['Ennemis vaincus',fmt(SAVE.kills)],['Meilleure progression',SAVE.bestLabel||'Aucune'],['Éclats récoltés',fmt(SAVE.total)]];
  body=`<div class="tiles t3" style="margin-top:0">${recs.map(([a,b])=>`<div class="tile"><span>${a}</span><b>${b}</b></div>`).join('')}</div><p class="h-sec">Chroniques de la Brume · ${un.length} / ${LORE.length}</p><ul class="lore">${LORE.map(l=>l.c(SAVE)?`<li><h3>${esc(l.t)}${SAVE.loreSeen.includes(l.id)?'':'<span class="new">Nouveau</span>'}</h3><p>${esc(l.x)}</p></li>`:`<li class="locked"><h3>Chronique scellée</h3><p>${esc(l.h)}</p></li>`).join('')}</ul>`;

 else if(ARCH_TAB==='echo'){
  const traits=TRAITS.map(t=>{const tr=tierOf(t,m),v=t.k(m),nx=t.tiers[tr];return `<div class="trait ${tr?'on':''}"><div class="top"><h3>${t.name}${tr?' '+ROM[tr]:''}</h3><b>${v}</b></div><p>${t.desc}</p><div class="pips">${t.tiers.map((x,i)=>`<i class="${i<tr?'on':''}"></i>`).join('')}</div><span class="k">${nx!=null?`Prochain palier à ${nx}`:'Palier maximal'}</span></div>`;}).join('');
  const fav=favCls(m),extra=fav?`<span class="chip" style="--c:${CCOL(fav)}">Fidèle au ${CLS[fav].short}</span>`:versatile(m)?'<span class="chip">Polymorphe : les quatre formes</span>':'';
  const top=topKiller(m);
  const who=[['veilleuse','Sœur Ismène'],['fondeur','Maître Corbin'],['archiviste','L’Archiviste'],['colporteur','Tobiah']].map(([id,nm])=>{const [a,d]=regard(id);return `<div class="who"><span class="k">${nm}</span><b>${a}</b><p>${d}</p></div>`;}).join('');
  const adapt=['lum','gou','her','tis'].map(c=>{const v=m.adapt[c]||0,L=Math.min(3,Math.floor(v)),A=ADAPT[c];return `<div class="mrow adapt" style="--c:${CCOL(c)}"><div><h3>${CLS[c].short} · ${L?esc(A.name)+' '+ROM[L]:'<span class="muted">rien d’appris</span>'}</h3><p>${L?esc(A.desc(L))+' '+esc(A.counter):`La Brume observe ${esc(A.what)}. Si tes dégâts en dépendent trop, elle finira par s’y accoutumer.`}</p><div class="gauge"><i style="width:${Math.min(100,v/3.4*100).toFixed(0)}%"></i><s style="left:29.4%"></s><s style="left:58.8%"></s><s style="left:88.2%"></s></div></div><span class="k">${L?`+${6*L} % d’éclats`:''}</span></div>`;}).join('');
  const jr=m.journal.length?`<ul class="journal">${m.journal.map(j=>`<li style="--c:${CCOL(j.cls)}"><span class="k">Descente ${j.n}</span><p>${esc(j.t)}${j.tags.length?` <em>${j.tags.map(esc).join(' · ')}</em>`:''}</p></li>`).join('')}</ul>`:'<p class="tip" style="margin:0">Aucune descente consignée pour l’instant.</p>';
  const graves=m.graves.length?`<p class="k" style="margin-top:10px">Tombes d’Écho en attente : ${m.graves.map(g=>`acte ${ROM[g.act]} salle ${g.room} (${CLS[g.cls].short})`).join(' · ')}</p>`:'';
  body=`<p class="tip" style="margin:0 0 4px">La Brume retient ce que tu fais d’une descente à l’autre. Les habitants aussi.</p>
  <p class="h-sec">Ce que la Brume retient de toi</p><div class="traits">${traits}</div>${extra?`<div class="chips" style="margin-top:10px">${extra}</div>`:''}${top?`<p class="k" style="margin-top:10px">Ce qui te fait tomber le plus souvent : ${esc(V7FOE[top[0]]||'la Brume')} (${top[1]} fois).</p>`:''}
  <p class="h-sec">Comment ils te voient</p><div class="whos">${who}</div>
  <p class="h-sec">Accoutumance · ce que la Brume a appris</p><div class="meta">${adapt}</div><p class="k" style="margin-top:8px">Chaque descente, la Brume mesure la part de tes dégâts qui repose sur la mécanique de ta classe. Au-delà de 40 %, elle apprend ; en dessous, ou avec une autre classe, elle oublie. Une Brume qui a appris rapporte plus d’éclats.</p>

 else{

  const chaps=CHAP.slice(1).map((C,i)=>{const ch=i+1,got=FRAGS.filter(f=>f.ch===ch&&m.frags.includes(f.id)).length,done=got===6,isNew=m.truthNew.includes(ch);
   return `<li class="${done?'done':''}"><div class="top"><h3>${C.n} · ${esc(C.t)}</h3><span class="k">${got} / 6</span></div>${done?`<details ${isNew?'open':''}><summary>Vérité : « ${esc(C.truth)} »${isNew?'<span class="new">Nouveau</span>':''}</summary><p>${esc(C.tx)}</p></details>`:`<p class="k">${esc(C.hint)}</p>`}</li>`;}).join('');
  body=`<div class="mapwrap"><div class="mapbox">${mapSVG()}<p class="k" style="margin-top:6px">${m.frags.length} / ${FRAGS.length} fragments · ${m.truths.length} / 5 Vérités${m.frags.length===FRAGS.length?' · Valsonne était une ville en forme de cloche.':''}</p></div><div class="mapside"><div class="fdet">${det}</div><ul class="chaps">${chaps}</ul></div></div>`;}
 overlayEl.innerHTML=`<div class="panel ${ARCH_TAB==='map'?'':'narrow'}">${npcHead(n)}${archTabs()}<div class="tabbody">${body}</div><div class="row"><button type="button" class="btn primary" id="close">Fermer</button>${ARCH_TAB==='reg'?'<button type="button" class="btn" id="wipe">Effacer la progression</button>':''}<span class="k">Échap pour fermer · 1, 2, 3 pour changer d’onglet</span></div></div>`;
 overlayEl.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{if(ARCH_TAB==='map'){m.fragNew=[];m.truthNew=[];persist();}ARCH_TAB=b.dataset.tab;MAP_SEL=null;renderArchiviste();}));

 const w=$('#wipe');if(w){let armedW=false;w.addEventListener('click',()=>{if(!armedW){armedW=true;w.textContent='Confirmer : tout effacer';w.classList.add('danger');setTimeout(()=>{if(w.isConnected){armedW=false;w.textContent='Effacer la progression';w.classList.remove('danger');}},3500);return;}SAVE=defaultSave();persist();chosenCls='lum';ARCH_TAB='reg';enterHub();toast('Progression effacée');});}
 overlayKeys=c=>{if(c==='Escape'){if(ARCH_TAB==='map'){m.fragNew=[];m.truthNew=[];persist();}closeOverlay();}else if(c==='Digit1'||c==='Digit2'||c==='Digit3'){ARCH_TAB=['reg','echo','map'][+c.slice(5)-1];MAP_SEL=null;renderArchiviste();}};

const RZN={};
for(const d of RZ_DEF){const [id,k,name,eff,con,syn,pre,any,impl,zones]=d;RZN[id]={id,k,name,eff,con,syn,pre,any,impl:!!impl,zones:zones||null,z:k==='b'?null:id[0],cost:RZ_COST[k]};}
// Positions : anneau de 7 zones, 7 nœuds par zone
const RZ_SLOT={1:[-84,0],2:[-38,-52],3:[-38,52],4:[0,-80],5:[22,46],6:[22,-46],7:[84,0]};
const RZ_C=500;
function rzZoneAng(z){return -Math.PI/2+RZ_ORDER.indexOf(z)*TAU/7;}
(function(){
 for(const z of RZ_ORDER){
  const th=rzZoneAng(z),R=262,cx=RZ_C+R*Math.cos(th),cy=RZ_C+R*Math.sin(th),ux=Math.cos(th),uy=Math.sin(th),vx=-uy,vy=ux;
  const mine=Object.values(RZN).filter(n=>n.z===z);
  const idx=n=>+n.id.slice(1);
  for(const n of mine){
   let slot;
   const i=idx(n);
   if(i===1)slot=1;else if(i===2)slot=2;else if(i===3)slot=3;else if(i===7)slot=7;
   else if(n.k==='m')slot=4;                                  // 4e mineur
   else slot=RZN[n.pre[0]].id.slice(1)==='2'?6:5;               // notable après 2 → haut, après 3 → bas
   const [u,v]=RZ_SLOT[slot];n.x=cx+u*ux+v*vx;n.y=cy+u*uy+v*vy;
  }
 }
 const ang=z=>rzZoneAng(z);
 for(const n of Object.values(RZN)){
  if(n.k!=='b')continue;
  const [a,b]=n.zones,ia=RZ_ORDER.indexOf(a),ib=RZ_ORDER.indexOf(b);
  let d=Math.abs(ia-ib);d=Math.min(d,7-d);
  let ma=ang(a),mb=ang(b);
  // angle moyen par le plus court chemin
  let df=mb-ma;while(df>Math.PI)df-=TAU;while(df<-Math.PI)df+=TAU;
  const mid=ma+df/2;
  const r=d===1?262:75;
  n.x=RZ_C+r*Math.cos(mid);n.y=RZ_C+r*Math.sin(mid);
 }
})();

  for(const t of TRAITS)earned+=tierOf(t,m);
  earned+=Object.keys(m.bossFirst||{}).length+2*(m.truths||[]).length;
  SAVE.res={v:1,nodes:{},earned,respecs:0,lastEnd:'',lastKiller:'',portalAct:1,portalOn:false,foyerOut:false,ambush:false,seenHub:0};

}

const rzKeys=()=>Object.keys(RZS().nodes).filter(k=>RZN[k]&&RZN[k].k==='k').length;

function rzPreOK(n,set){
 if(n.k==='b')return n.zones.every(z=>[...set].some(k=>RZN[k]&&RZN[k].z===z&&RZN[k].k==='m'));
 if(n.pre.some(p=>!set.has(p)))return false;
 if(n.any.length&&!n.any.some(p=>set.has(p)))return false;
 return true;
}
function rzMissing(n){
 const set=new Set(Object.keys(RZS().nodes)),out=[];
 if(n.k==='b'){for(const z of n.zones)if(![...set].some(k=>RZN[k]&&RZN[k].z===z&&RZN[k].k==='m'))out.push(`un mineur de ${RZ_Z[z].n}`);return out;}
 for(const p of n.pre)if(!set.has(p))out.push(RZN[p].name);

function rzState(id){

// ───────────────────────── hitEnemy : multiplicateurs, compensation corps à corps, effets sur coup
const _hit10=hitEnemy;
hitEnemy=function(e,base,o){
 o=o||{};
 const s=P&&P.s;
 if(!s||e.dead||e.puppet>0)return _hit10(e,base,o);
 const f=s.v10,cls=P.cls;
 if(!f&&!(MEL>0&&isBoss(e)))return _hit10(e,base,o);
 const v=pv();let m=1;
 // compensation : les gardiens laissent peu de fenêtres au corps à corps
 if(MEL>0&&isBoss(e)){
  m*=cls==='lum'?1.2:1.3;
  if(RUN&&RUN.time-v.lastRef>0.25){v.lastRef=RUN.time;if(P.dashCh<s.dashCharges)P.dashRecT-=0.3;}
  if(RUN&&!RUN.mel10&&!o.dot){RUN.mel10=1;later(0.2,()=>toast('Corps à corps contre un gardien : +'+(cls==='lum'?20:30)+' % de dégâts et esquive rechargée plus vite',3.2));}
 }
 if(f){

   if(f.charge&&o.light&&o.dot&&P.beam)m*=1+[0.17,0.33,0.5][f.charge-1]*Math.min(1,v.beamOn/2);
