<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaelmor : Les Marées de Cendre</title>
  <style>
    :root {
      --bg: #12121f;
      --ash: #c9bfa9;
      --ember: #e07b39;
      --mist: #7fe0e8;
      --violet: #4b2e6f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ash);
      background:
        radial-gradient(circle at 20% 15%, rgba(75, 46, 111, 0.55), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(127, 224, 232, 0.14), transparent 40%),
        var(--bg);
    }
    main { text-align: center; max-width: 560px; }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f2e9d4;
      text-shadow: 0 0 24px rgba(224, 123, 57, 0.45);
    }
    h2 {
      margin: 0 0 28px;
      font-weight: normal;
      font-style: italic;
      color: var(--mist);
      letter-spacing: 0.06em;
    }
    p { line-height: 1.6; margin: 0 0 22px; }
    .play {
      display: inline-block;
      margin-bottom: 18px;
      padding: 12px 34px;
      border: 1px solid var(--ember);
      border-radius: 4px;
      background: linear-gradient(#2a1d2e, #1a1424);
      color: #f2e9d4;
      font-size: 1.15rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 18px rgba(224, 123, 57, 0.35);
    }
    .play:hover, .play:focus-visible { background: linear-gradient(#3a2536, #241a30); box-shadow: 0 0 26px rgba(224, 123, 57, 0.6); }
    .badge {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid var(--ember);
      border-radius: 999px;
      color: var(--ember);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    a { color: var(--mist); }
  </style>
</head>
<body>
  <main>
    <h1>Vaelmor</h1>
    <h2>Les Marées de Cendre</h2>
    <p>RPG tactique en monde ouvert, fantasy médiévale, jouable dans le navigateur.</p>
    <a class="play" href="play/">Jouer</a><br />
    <span class="badge">Prototype · jalon M0</span>
    <p style="margin-top:28px;font-size:0.9rem;">
      <a href="docs/GDD_Vaelmor.md">Game Design Document</a>
    </p>
  </main>
</body>
</html>
