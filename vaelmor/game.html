<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex" />
  <title>Vaelmor : Les Marées de Cendre</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #game {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }
    #game canvas {
      display: block;
      image-rendering: pixelated;
      outline: none;
    }
    noscript, #vaelmor-fatal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px max(24px, calc(50vw - 320px));
      background: #12121f;
      color: #c9bfa9;
      font: 16px/1.6 Georgia, "Times New Roman", serif;
    }
    #vaelmor-fatal h1 { margin: 0 0 16px; color: #e07b39; font-size: 1.4rem; }
    #vaelmor-fatal ul { margin: 0 0 16px; padding-left: 20px; font: 13px/1.5 ui-monospace, Consolas, monospace; color: #e8f1f5; }
  </style>
</head>
<body>
  <div id="game"></div>
  <noscript>Vaelmor nécessite JavaScript pour fonctionner.</noscript>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
